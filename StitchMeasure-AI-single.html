      <header class="rep-head">
        <div><div class="rep-brand">StitchMeasure AI</div><h1>Measurement sheet</h1></div>
        <dl class="rep-meta">
          <div><dt>Customer</dt><dd>${esc(c.name || "–")}</dd></div><div><dt>ID</dt><dd>${esc(c.code || "–")}</dd></div>
          <div><dt>Date</dt><dd>${esc(SM.util.fmtDate(r.session.date))}</dd></div><div><dt>Designer</dt><dd>${esc(r.designer || "–")}</dd></div>
          <div><dt>Garment</dt><dd>${esc(r.template ? r.template.name : "–")}</dd></div><div><dt>Units</dt><dd>${esc(SM.engine.unitLabel(r.unit))}</dd></div>
          ${c.heightCm ? `<div><dt>Height</dt><dd>${SM.engine.format(c.heightCm, r.unit)} ${SM.engine.unitLabel(r.unit)}</dd></div>` : ""}
          <div><dt>Seam allowance</dt><dd>${esc(seam)} <small>(pattern only, not added)</small></dd></div>
        </dl>
      </header>
      <p class="rep-summary">${esc(summaryLine(r))}</p>
      <div class="rep-scroll"><table class="rep-table">
        <thead><tr><th>Measurement</th><th class="num">Body</th><th>Source</th><th>Status</th><th class="num">Ease</th><th class="num">Design</th><th class="num">Finished</th></tr></thead>
        <tbody>${r.rows.map((x) => `<tr class="${x.needsTape ? "flag" : ""}">
          <td>${esc(x.name)}${x.note ? `<div class="rep-note">${esc(x.note)}</div>` : ""}</td>
          <td class="num">${x.display}${x.value != null ? " " + esc(x.unit) : ""}</td>
          <td>${esc(x.source)}${x.readings > 1 ? ` <small>(${x.readings} readings)</small>` : ""}</td>
          <td>${esc(x.status)}${x.needsTape ? ' <strong class="rep-flag">Tape check needed</strong>' : ""}</td>
          <td class="num">${x.ease != null ? SM.engine.format(x.ease, r.unit, x.id) : ""}</td>
          <td class="num">${x.design != null ? SM.engine.format(x.design, r.unit, x.id) : ""}</td>
          <td class="num">${x.finished != null ? SM.engine.format(x.finished, r.unit, x.id) : ""}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="rep-legend">Body = measurement of the body. Finished = body + ease + design allowance. Seam allowance is listed separately and is not included. Values marked “Tape check needed” come from a camera or an estimate and must be confirmed with a measuring tape before cutting.</p>

      ${histTable}
      <footer class="rep-foot">Generated ${esc(SM.util.fmtDateTime(r.generatedAt))} · Measurements from photographs are approximate unless verified with a tape.</footer>
    </article>`;
  }

  function csv(r) {
    const c = r.customer || {};
    const head = ["Customer", "Customer ID", "Date", "Garment", "Measurement", "Measurement ID", "Body value", "Unit", "Source", "Status", "Tape check needed", "Readings", "Ease", "Design allowance", "Finished", "Verified by", "Note"];
    const lines = [head.map(SM.util.csvCell).join(",")];
    r.rows.forEach((x) => {
      lines.push([c.name, c.code, r.session.date, r.template ? r.template.name : "", x.name, x.id, x.value != null ? SM.engine.format(x.value, r.unit, x.id).replace("°", "") : "", x.unit, x.source, x.status, x.needsTape ? "yes" : "no", x.readings,

  }

  function json(r) {
    return JSON.stringify({
      schema: "stitchmeasure.report/1", generatedAt: r.generatedAt, unitStored: "cm", displayUnit: r.unit,
      customer: r.customer ? { id: r.customer.id, code: r.customer.code, name: r.customer.name, ageGroup: r.customer.ageGroup, template: r.customer.template, heightCm: r.customer.heightCm } : null,
      session: r.session, garment: r.template ? { id: r.template.id, name: r.template.name } : null,
      rows: r.rows.map((x) => ({ id: x.id, name: x.name, valueCm: x.value, source: x.source, status: x.status, needsTapeVerification: x.needsTape, easeCm: x.ease, designCm: x.design, finishedCm: x.finished }))

  async function pdf(r, photoImgs) {

    doc.setFillColor(14, 27, 44); doc.rect(0, 0, W, 30, "F");
    doc.setTextColor(216, 183, 106); doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.text("STITCHMEASURE AI", M, 11);
    doc.setTextColor(255, 255, 255); doc.setFontSize(18); doc.text("Measurement sheet", M, 21);
    y = 38; doc.setTextColor(14, 27, 44); doc.setFontSize(9.5); doc.setFont("helvetica", "normal");

    meta.forEach((m, i) => { const col = i % 2, row = Math.floor(i / 2); doc.setFont("helvetica", "bold"); doc.text(ascii(m[0]) + ":", M + col * 92, y + row * 6); doc.setFont("helvetica", "normal"); doc.text(ascii(m[1] || "-"), M + 28 + col * 92, y + row * 6); });

    r.rows.forEach((x) => {
      if (y > 280) { doc.addPage(); y = 18; header(); doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); }
      if (x.needsTape) { doc.setFillColor(253, 243, 224); doc.rect(M, y - 4, W - 2 * M, 6, "F"); }
      const vals = [x.name, x.value != null ? x.display + " " + x.unit : "-", x.source, x.status + (x.needsTape ? " *" : ""), x.ease != null ? SM.engine.format(x.ease, r.unit, x.id) : "", x.design != null ? SM.engine.format(x.design, r.unit, x.id) : "", x.finished != null ? SM.engine.format(x.finished, r.unit, x.id) : ""];
      let cx = M + 1.5; doc.setTextColor(14, 27, 44);
      vals.forEach((v, i) => { const t = doc.splitTextToSize(ascii(v), cols[i][1] - 2)[0] || ""; doc.text(t, cx, y); cx += cols[i][1]; });

  }

<script>/* src/customer-profiles/customers.js */
/* Customer profile service (data layer). UI lives in src/app.js views. */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});
  const SCHEMA = "stitchmeasure.customer/1";

  const TEMPLATES = { women: "Women", men: "Men", girls: "Girls", boys: "Boys", unisex: "Unisex", custom: "Custom" };
  const AGE_GROUPS = { adult: "Adult", child: "Child" };

  async function nextCode() {
    const all = await SM.db.all("customers");
    let max = 0;
    all.forEach((c) => { const m = /^SM-(\d+)$/.exec(c.code || ""); if (m) max = Math.max(max, +m[1]); });
    return "SM-" + String(max + 1).padStart(4, "0");
  }

  function blank() {
    return {
      schema: SCHEMA, id: SM.util.uid("cus"), code: "", name: "", phone: "", ageGroup: "adult", age: "",
      template: "women", heightCm: null, garment: "", unit: "", designer: "", notes: "",
      consent: { photos: false, guardian: { name: "", given: false } },
      profilePhotoId: null, sample: false,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    };
  }

  /* validation used by the form and by imports */
  function validate(c) {
    const errs = [];
    if (!c.name || !c.name.trim()) errs.push("Enter the customer's name.");
    if (c.ageGroup === "child" && c.consent && c.consent.photos && !(c.consent.guardian && c.consent.guardian.given && c.consent.guardian.name)) errs.push("Photos of a child need a guardian's name and consent.");
    if (c.heightCm != null && !(c.heightCm > 30 && c.heightCm < 260)) errs.push("Height looks wrong. Enter it in the selected unit.");
    return errs;
  }

  const svc = {
    SCHEMA, TEMPLATES, AGE_GROUPS, blank, validate, nextCode,
    async list() { const a = await SM.db.all("customers"); return a.sort((x, y) => (y.updatedAt || "").localeCompare(x.updatedAt || "")); },
    get: (id) => SM.db.get("customers", id),
    async save(c) {
      if (!c.code) c.code = await nextCode();
      c.updatedAt = new Date().toISOString();
      if (!c.createdAt) c.createdAt = c.updatedAt;
      await SM.db.put("customers", c);
      return c;
    },
    async duplicate(id) {
      const c = await svc.get(id); if (!c) return null;
      const d = JSON.parse(JSON.stringify(c));
      d.id = SM.util.uid("cus"); d.code = await nextCode(); d.name = c.name + " (copy)"; d.profilePhotoId = null; d.sample = false;
      d.createdAt = d.updatedAt = new Date().toISOString();
      await SM.db.put("customers", d);
      // copy the latest measurement session (photos are not copied, for privacy)
      const ses = await svc.sessions(id);
      if (ses[0]) { const s = JSON.parse(JSON.stringify(ses[0])); s.id = SM.util.uid("ses"); s.customerId = d.id; s.createdAt = s.updatedAt = d.createdAt; await SM.db.put("sessions", s); }
      return d;
    },
    async remove(id) {
      for (const s of await SM.db.where("sessions", "customerId", id)) await SM.db.del("sessions", s.id);
      for (const p of await SM.db.where("photos", "customerId", id)) await SM.db.del("photos", p.id);
      await SM.db.del("customers", id);
    },
    async sessions(customerId) { const a = await SM.db.where("sessions", "customerId", customerId); return a.sort((x, y) => (y.date + y.updatedAt).localeCompare(x.date + x.updatedAt)); },

})(typeof window !== "undefined" ? window : globalThis);

</script>

<script>/* src/app.js */
/* App shell: router, navigation, shared helpers. Screens register in SM.views. */
(function (root) {
  "use strict";
  const SM = root.SM;
  const U = SM.util, t = SM.t;
  SM.views = SM.views || {};

  const TITLES = {
    dashboard: "Dashboard", "new-customer": "New customer", customers: "Saved profiles", customer: "Customer", "edit-customer": "Edit customer",
    session: "Measurements", scan: "Body scanner", library: "Measurement library", measure: "Measurement", templates: "Garment templates",
    template: "Template", reports: "Reports", report: "Report", settings: "Settings", more: "More", photos: "Photo library", compare: "Compare", poses: "Pose references"
  };

  const app = {
    get settings() { return SM.settings.values; },
    route: { name: "dashboard", args: [] },
    state: { customerId: null }, // currently selected customer (for camera saves)

    /* templates: built-in + custom (IndexedDB) */
    async templatesAll() {
      const custom = await SM.db.all("templates");
      return SM.templates.builtin.concat(custom.sort((a, b) => (a.name || "").localeCompare(b.name || "")));
    },
    async resolveTemplate(id) {
      if (!id) return null;
      const b = SM.templates.builtin.find((x) => x.id === id);
      return b || (await SM.db.get("templates", id));
    },
    /* ordered measurement ids for a session (template list + session custom items) */
    sessionIds(session, template) {
      let ids = session.order && session.order.length ? session.order.slice() : SM.templates.items(template).slice();
      (session.customDefs || []).forEach((d) => { if (!ids.includes(d.id)) ids.push(d.id); });
      Object.keys(session.items || {}).forEach((id) => { if (!ids.includes(id) && session.items[id].value != null) ids.push(id); });
      return ids;
    },
    itemName(id, session, template) {
      if (template && template.labels && template.labels[id]) return template.labels[id];
      const d = session && (session.customDefs || []).find((x) => x.id === id);
      if (d) return d.name;
      const tdef = template && (template.customDefs || []).find((x) => x.id === id);
      if (tdef) return tdef.name;
      return SM.catalog.name(id);
    },
    unit(customer) { return (customer && customer.unit) || app.settings.unit || "cm"; },
    initials(name) { return (name || "?").split(/\s+/).filter((w) => /^\p{L}/u.test(w)).slice(0, 2).map((w) => w[0].toUpperCase()).join(""); },

    go(hash) { if (location.hash === hash) app.render(); else location.hash = hash; },
    async render() {
      const raw = (location.hash || "#/").replace(/^#\/?/, "").split("#")[0];
      const parts = raw.split("/").filter(Boolean).map(decodeURIComponent);
      const name = parts[0] || "dashboard";
      const view = SM.views[name] ? name : "dashboard";
      app.route = { name: view, args: parts.slice(1) };
      U.$$("[data-nav]").forEach((a) => {
        const n = a.getAttribute("data-nav");
        const on = n === view || (n === "customers" && ["customer", "edit-customer", "session", "compare"].includes(view)) ||
          (n === "library" && ["measure", "poses"].includes(view)) || (n === "templates" && view === "template") ||
          (n === "reports" && view === "report") || (n === "more" && ["more", "templates", "template", "reports", "report", "settings", "photos", "new-customer"].includes(view) && !U.$(".sidebar").offsetParent);
        a.classList.toggle("on", on);
        if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
      });
      U.$("#topTitle").textContent = t(TITLES[view] || "StitchMeasure AI");
      const el = U.$("#view");
      el.innerHTML = "";
      try { await SM.views[view](el, app.route.args); }
      catch (e) { console.error(e); el.innerHTML = `<div class="notice danger">${SM.icon("warn")}<div><b>${t("Something went wrong on this screen.")}</b><br>${U.esc(e.message)}</div></div>`; }
      if (!app._noScroll) root.scrollTo(0, 0);
      app._noScroll = false;
    },
    rerender() { app._noScroll = true; return app.render(); },

    statusChip(status) { return `<span class="chip st-${status}">${t(SM.engine.STATUS[status] || status)}</span>`; },

    /* page header helper */
    head(opts) {
      return `<header class="page-head"><div>${opts.eyebrow ? `<div class="eyebrow">${U.esc(opts.eyebrow)}</div>` : ""}<h1>${U.esc(opts.title)}</h1>${opts.sub ? `<p>${opts.sub}</p>` : ""}</div>${opts.actions ? `<div class="btn-row">${opts.actions}</div>` : ""}</header>`;
    },

    /* offline readiness */
    async offlineStatus() {
      const s = { protocol: location.protocol, sw: "unsupported", online: navigator.onLine, secure: !!root.isSecureContext };
      if (location.protocol === "file:" || window.SM_SINGLE_FILE) s.sw = "file";
      else if ("serviceWorker" in navigator) {
        const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
        s.sw = reg && reg.active ? (navigator.serviceWorker.controller ? "ready" : "installed") : "installing";
      }
      s.ready = s.sw === "ready" || s.sw === "installed";
      return s;
    },
    async updateStatusPills() {
      const s = await app.offlineStatus();
      const pill = U.$("#topStatus"), side = U.$("#sideStatus");
      let cls = "", text;
      if (s.sw === "file") { cls = "off"; text = t("Opened as file"); }
      else if (s.ready) { cls = "ready"; text = s.online ? t("Offline ready") : t("Offline mode"); }
      else if (s.sw === "unsupported") { cls = "off"; text = t("No offline cache"); }
      else text = t("Preparing offline");
      if (pill) { pill.className = "status-pill " + cls; pill.innerHTML = `<span class="dot"></span><span>${text}</span>`; }
      if (side) side.innerHTML = `<span class="status-pill ${cls}"><span class="dot"></span><span>${text}</span></span><div style="margin-top:8px">${t("Data stays on this device.")}</div>`;
    },

    /* pick a customer (sheet). Resolves to customer or null */
    pickCustomer(opts) {
      opts = opts || {};
      return new Promise(async (resolve) => {
        const list = await SM.customers.list();
        let chosen = null;
        const s = U.sheet({
          title: opts.title || t("Select customer"),
          html: `<div class="search">${SM.icon("search")}<input type="search" placeholder="${t("Search name, ID or phone")}" data-q></div>
            <div class="list" data-list></div>
            <a class="btn primary" href="#/new-customer${opts.returnTo ? "/" + encodeURIComponent(opts.returnTo) : ""}" data-new>${SM.icon("userPlus")}${t("New customer")}</a>`,
          onClose: () => resolve(chosen)
        });
        const draw = (q) => {
          q = (q || "").toLowerCase();
          const rows = list.filter((c) => !q || [c.name, c.code, c.phone].join(" ").toLowerCase().includes(q));
          s.el.querySelector("[data-list]").innerHTML = rows.length ? rows.map((c) => `<button class="list-item" data-id="${c.id}"><span class="avatar">${U.esc(app.initials(c.name))}</span><span class="main"><span class="t">${U.esc(c.name)}</span><span class="s">${U.esc(c.code)} · ${t(SM.customers.TEMPLATES[c.template] || "")}</span></span>${SM.icon("chevron")}</button>`).join("") : `<div class="empty">${t("No saved customers yet.")}</div>`;
        };
        draw("");
        s.el.querySelector("[data-q]").oninput = (e) => draw(e.target.value);
        s.el.querySelector("[data-list]").onclick = (e) => { const b = e.target.closest("[data-id]"); if (!b) return; chosen = list.find((c) => c.id === b.dataset.id); s.close(); };
        s.el.querySelector("[data-new]").onclick = () => s.close();
      });
    },

    /* create or reuse the latest open session for a customer + template */
    async ensureSession(customerId, templateId) {
      const list = await SM.customers.sessions(customerId);
      const today = U.todayISO();
      let s = list.find((x) => x.templateId === templateId && x.date === today);
      if (!s) { s = SM.engine.newSession(customerId, templateId, app.settings.designer); s.seamAllowanceCm = app.settings.seamAllowanceCm; await SM.db.put("sessions", s); }
      return s;
    },

    async saveSession(s) { s.updatedAt = new Date().toISOString(); await SM.db.put("sessions", s); const c = await SM.db.get("customers", s.customerId); if (c) { c.updatedAt = s.updatedAt; await SM.db.put("customers", c); } },

    /* save a blob (report, backup) with the honest platform message */
    async deliver(blob, name, mode) {
      let r;
      if (mode === "share") r = await SM.photoExport.share(blob, name);
      else if (mode === "saveas") { r = await SM.photoExport.saveAs(blob, name); if (r.unsupported) r = await SM.photoExport.download(blob, name); }
      else r = await SM.photoExport.download(blob, name);
      U.toast(r.message, r.done ? "" : r.unsupported ? "err" : "");
      return r;
    }
  };
  SM.app = app;
})(window);

</script>
<script>/* src/components/dashboard.js */

(function () {

  const SM = window.SM, U = SM.util, t = SM.t, app = SM.app;

  SM.views.dashboard = async function (el) {

    ]);
    let complete = 0, incomplete = 0, pending = 0;
    const pendingRows = [];
    const custById = Object.fromEntries(customers.map((c) => [c.id, c]));
    const latest = {};
    sessions.forEach((s) => { const k = s.customerId; if (!latest[k] || (s.date + s.updatedAt) > (latest[k].date + latest[k].updatedAt)) latest[k] = s; });
    for (const s of Object.values(latest)) {
      const tpl = templatesAll.find((x) => x.id === s.templateId);
      const ids = app.sessionIds(s, tpl);
      const sum = SM.engine.summary(s, ids);
      if (sum.complete) complete++; else incomplete++;
      if (sum.verify) { pending += sum.verify; pendingRows.push({ s, n: sum.verify, c: custById[s.customerId] }); }
    }
    const status = await app.offlineStatus();
    const est = await SM.db.estimate();
    const fileWarn = location.protocol === "file:";
    const recentPhotos = photos.sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 6);
    const recentAct = activity.sort((a, b) => b.at.localeCompare(a.at)).slice(0, 6);
    const backupAge = app.settings.lastBackupAt ? Math.floor((Date.now() - new Date(app.settings.lastBackupAt)) / 86400000) : null;

    el.innerHTML = `
      ${fileWarn ? `<div class="notice warn" style="margin-bottom:14px">${SM.icon("warn")}<div><b>${t("Opened directly as a file.")}</b> ${t("Camera access, offline installation and the service worker need the app to be served over https:// or localhost. Manual measurement entry, photo import, reports and backups still work. See docs/installation.md.")}</div></div>` : ""}
      ${SM.db.inMemory ? `<div class="notice danger" style="margin-bottom:14px">${SM.icon("warn")}<div>${t("This browser is blocking storage (private mode?). Nothing will be kept after you close the app.")}</div></div>` : ""}

          <div class="btn-row"><a class="btn primary" href="#/scan">${SM.icon("scan")}${t("Start new measurement")}</a><a class="btn gold" href="#/camera">${SM.icon("camera")}${t("Open camera")}</a></div>
        </div>

        <div class="grid-2">

      const q = f.q.toLowerCase();
      const rows = all.filter((c) => (!q || [c.name, c.code, c.phone].join(" ").toLowerCase().includes(q)) &&
        (f.group === "all" || c.template === f.group || (f.group === "child" && c.ageGroup === "child") || (f.group === "sample" && c.sample)));
      U.$("#custList").innerHTML = rows.length ? rows.map((c) => {
        const s = last[c.id];
        return `<a class="list-item" href="#/customer/${c.id}"><span class="avatar">${U.esc(app.initials(c.name))}</span><span class="main"><span class="t">${U.esc(c.name)} ${c.sample ? `<span class="chip sample">${t("Sample")}</span>` : ""}</span>
          <span class="s">${U.esc(c.code)} · ${t(SM.customers.TEMPLATES[c.template] || "")}${c.ageGroup === "child" ? " · " + t("Child") : ""} · ${s ? t("Measured") + " " + U.esc(U.fmtDate(s.date)) : t("No measurements yet")}</span></span>${SM.icon("chevron")}</a>`;
      }).join("") : `<div class="empty">${SM.icon("users")}<p>${all.length ? t("No customers match this search.") : t("No customers yet.")}</p></div>`;
    };
    draw();
    U.$("#custSearch").oninput = (e) => { f.q = e.target.value; draw(); };
    U.$$("[data-f]", el).forEach((b) => (b.onclick = () => { f.group = b.dataset.f; app.rerender(); }));
    U.$("[data-import]", el).onclick = () => U.$("#impFile").click();
    U.$("#impFile").onchange = (e) => importFile(e.target.files[0]);
  };

  async function importFile(file) {
    if (!file) return;
    try {
      let data = JSON.parse(await U.readFileAsText(file));
      if (data.schema === "stitchmeasure.encrypted/1") {
        const pw = await U.prompt({ title: t("Encrypted file"), label: t("Password"), type: "password", ok: t("Unlock") });
        if (!pw) return;
        data = await SM.backup.decrypt(data, pw);
      }
      const n = await SM.backup.restore(data);
      await SM.db.log(`Imported ${n.customers} profile(s)`);
      U.toast(t("Imported {c} customer(s), {s} measurement record(s), {p} photo(s).", { c: n.customers, s: n.sessions, p: n.photos }));
      app.rerender();
    } catch (e) { U.toast(t("Import failed: ") + e.message, "err"); }
  }
  SM.app.importFile = importFile;

  /* ---------- create / edit ---------- */
  async function form(el, c, isNew, returnTo) {
    const unit = c.unit || app.settings.unit;
    const templates = await app.templatesAll();
    el.innerHTML = app.head({ eyebrow: isNew ? t("Step 1 · Customer") : c.code, title: isNew ? t("New customer") : t("Edit customer"), sub: t("Only the name is required. Collect no more personal information than the job needs.") }) + `
      <form class="stack" id="custForm" novalidate>
        <section class="card stack">
          <h3>${t("Profile")}</h3>
          <div class="form-grid">
            <label class="field">${t("Customer name")}<input type="text" id="cName" value="${U.esc(c.name)}" autocomplete="off" required></label>
            <label class="field">${t("Customer ID")}<input type="text" id="cCode" value="${U.esc(c.code)}" placeholder="${t("Assigned on save")}" autocomplete="off"><span class="hint">${t("Leave blank to auto-number (SM-0001…)")}</span></label>
            <label class="field">${t("Phone (optional)")}<input type="tel" id="cPhone" value="${U.esc(c.phone)}" autocomplete="off"></label>
            <label class="field">${t("Tailor / designer")}<input type="text" id="cDesigner" value="${U.esc(c.designer || app.settings.designer)}"></label>
          </div>
          <div class="form-grid">
            <label class="field">${t("Adult or child")}<select id="cAge">${Object.entries(SM.customers.AGE_GROUPS).map(([k, v]) => `<option value="${k}" ${c.ageGroup === k ? "selected" : ""}>${t(v)}</option>`).join("")}</select></label>
            <label class="field">${t("Age or age group (optional)")}<input type="text" id="cAgeVal" value="${U.esc(c.age)}" placeholder="${t("e.g. 34 or 8–10")}"></label>
            <label class="field">${t("Measurement template")}<select id="cTpl">${Object.entries(SM.customers.TEMPLATES).map(([k, v]) => `<option value="${k}" ${c.template === k ? "selected" : ""}>${t(v)}</option>`).join("")}</select><span class="hint">${t("Only orders the garment list. Body values are never assumed from it.")}</span></label>
          </div>
          <div class="form-grid">
            <label class="field">${t("Known standing height")} (${unit})<input type="number" id="cHeight" inputmode="decimal" step="any" value="${c.heightCm ? E.format(c.heightCm, unit).replace(/\.0+$/, "") : ""}"><span class="hint">${t("Measured barefoot against a wall. Used for height calibration.")}</span></label>
            <label class="field">${t("Preferred unit")}<select id="cUnit"><option value="">${t("App default")} (${app.settings.unit})</option>${Object.keys(E.UNITS).map((u) => `<option value="${u}" ${c.unit === u ? "selected" : ""}>${u}</option>`).join("")}</select></label>
            <label class="field">${t("Garment category")}<select id="cGarment"><option value="">${t("Choose later")}</option>${SM.templates.GROUPS.map((g) => { const list = templates.filter((x) => x.group === g); return list.length ? `<optgroup label="${t(g)}">${list.map((x) => `<option value="${x.id}" ${c.garment === x.id ? "selected" : ""}>${U.esc(x.name)}</option>`).join("")}</optgroup>` : ""; }).join("")}</select></label>
          </div>
          <label class="field">${t("Measurement notes")}<textarea id="cNotes" placeholder="${t("Fit preferences, posture notes, fabric…")}">${U.esc(c.notes)}</textarea></label>
        </section>
        <section class="card stack">
          <h3>${t("Consent & privacy")}</h3>
          <label class="check"><input type="checkbox" id="cConsent" ${c.consent.photos ? "checked" : ""}><span>${t("The customer agrees to body photographs being taken and stored on this device for measurement.")}</span></label>
          <div class="stack-sm" id="guardianBox" ${c.ageGroup === "child" ? "" : "hidden"}>
            <div class="notice">${SM.icon("shield")}<div>${t("For a child, a parent or guardian must give consent. Store only what the garment needs.")}</div></div>
            <label class="field">${t("Guardian name")}<input type="text" id="gName" value="${U.esc(c.consent.guardian.name)}"></label>
            <label class="check"><input type="checkbox" id="gGiven" ${c.consent.guardian.given ? "checked" : ""}><span>${t("The guardian has given consent for measurements and photographs.")}</span></label>
          </div>
          <p class="muted small">${t("Without photo consent you can still record tape measurements and analyse a photo without keeping it.")}</p>
        </section>
        <div class="notice danger" id="formErr" hidden></div>
        <div class="btn-row end">
          <a class="btn ghost" href="${isNew ? "#/customers" : "#/customer/" + c.id}">${t("Cancel")}</a>
          <button class="btn primary" type="submit">${SM.icon("check")}${isNew ? t("Create profile") : t("Save changes")}</button>
        </div>
      </form>`;
    U.$("#cAge").onchange = (e) => (U.$("#guardianBox").hidden = e.target.value !== "child");
    U.$("#custForm").onsubmit = async (e) => {
      e.preventDefault();
      const u = U.$("#cUnit").value || app.settings.unit;
      const h = U.$("#cHeight").value.trim();
      Object.assign(c, {
        name: U.$("#cName").value.trim(), code: U.$("#cCode").value.trim(), phone: U.$("#cPhone").value.trim(), designer: U.$("#cDesigner").value.trim(),
        ageGroup: U.$("#cAge").value, age: U.$("#cAgeVal").value.trim(), template: U.$("#cTpl").value, unit: U.$("#cUnit").value,
        heightCm: h ? E.parse(h, u) : null, garment: U.$("#cGarment").value, notes: U.$("#cNotes").value.trim()
      });
      c.consent.photos = U.$("#cConsent").checked;
      c.consent.guardian = { name: U.$("#gName") ? U.$("#gName").value.trim() : "", given: U.$("#gGiven") ? U.$("#gGiven").checked : false };
      if (c.ageGroup !== "child") c.consent.guardian = { name: "", given: false };
      const errs = SM.customers.validate(c);
      if (c.code) { const dup = (await SM.customers.list()).find((x) => x.code === c.code && x.id !== c.id); if (dup) errs.push(t("Customer ID {id} is already used by {n}.", { id: c.code, n: dup.name })); }
      if (errs.length) { const b = U.$("#formErr"); b.hidden = false; b.innerHTML = `${SM.icon("warn")}<div>${errs.map(U.esc).join("<br>")}</div>`; b.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
      await SM.customers.save(c);
      await SM.db.log((isNew ? "Created " : "Updated ") + c.name, c.id);
      app.state.customerId = c.id;
      U.toast(isNew ? t("Profile created: {code}", { code: c.code }) : t("Changes saved"));
      if (returnTo === "scan") { const w = await SM.db.setting("wizard", null); if (w) { w.customerId = c.id; w.step = Math.max(1, w.step); await SM.db.setSetting("wizard", w); } app.go("#/scan"); } else app.go("#/customer/" + c.id);
    };
  }
  SM.views["new-customer"] = async (el, args) => form(el, SM.customers.blank(), true, args[0]);
  SM.views["edit-customer"] = async (el, args) => { const c = await SM.customers.get(args[0]); if (!c) return app.go("#/customers"); form(el, c, false); };

  /* ---------- detail ---------- */
  SM.views.customer = async function (el, args) {
    const c = await SM.customers.get(args[0]);
    if (!c) { el.innerHTML = `<div class="empty">${t("Customer not found.")}</div>`; return; }
    app.state.customerId = c.id;
    const [sessions, photos, templates] = await Promise.all([SM.customers.sessions(c.id), SM.customers.photos(c.id), app.templatesAll()]);
    const unit = app.unit(c);
    el.innerHTML = app.head({ eyebrow: c.code + (c.sample ? " · " + t("Sample") : ""), title: c.name, sub: [t(SM.customers.TEMPLATES[c.template] || ""), c.ageGroup === "child" ? t("Child") + (c.age ? " · " + U.esc(c.age) : "") : (c.age ? U.esc(c.age) : ""), c.heightCm ? t("Height") + " " + E.format(c.heightCm, unit) + " " + E.unitLabel(unit) : "", c.phone ? U.esc(c.phone) : ""].filter(Boolean).join(" · "),
      actions: `<a class="btn" href="#/edit-customer/${c.id}">${SM.icon("edit")}${t("Edit")}</a><button class="btn primary" data-newm>${SM.icon("plus")}${t("New measurement")}</button>` }) + `
      <div class="stack">
        ${!c.consent.photos ? `<div class="notice">${SM.icon("shield")}<div>${t("No photo consent recorded. Photos can be analysed but will not be stored for this customer.")} <a href="#/edit-customer/${c.id}">${t("Update consent")}</a></div></div>` : ""}
        <div class="tiles">
          <button class="tile" data-scan>${SM.icon("scan")}<span>${t("Guided scan")}<small>${t("Camera with body outline")}</small></span></button>
          <button class="tile" data-cam>${SM.icon("camera")}<span>${t("Take photo")}<small>${t("Quick capture")}</small></span></button>
          <button class="tile" data-dup>${SM.icon("copy")}<span>${t("Duplicate")}<small>${t("Copy profile & latest values")}</small></span></button>
          <button class="tile" data-exp>${SM.icon("download")}<span>${t("Export profile")}<small>${t("JSON with photos")}</small></span></button>
        </div>
        <section class="card">
          <div class="card-head"><h2>${t("Measurement history")}</h2>${sessions.length > 1 ? `<a class="btn sm" href="#/compare/${c.id}">${SM.icon("compare")}${t("Compare")}</a>` : ""}</div>
          ${sessions.length ? `<div class="list">${sessions.map((s) => {
            const tpl = templates.find((x) => x.id === s.templateId);
            const sum = E.summary(s, app.sessionIds(s, tpl));
            return `<a class="list-item" href="#/session/${s.id}"><span class="avatar">${SM.icon("tape")}</span><span class="main"><span class="t">${U.esc(tpl ? tpl.name : t("Custom"))} · ${U.esc(U.fmtDate(s.date))}</span>
              <span class="s">${sum.done}/${sum.total} ${t("recorded")}${sum.verify ? " · " + sum.verify + " " + t("to verify") : ""}${sum.verified ? " · " + sum.verified + " " + t("verified") : ""}</span>
              <span class="progress" style="margin-top:6px"><span style="width:${sum.total ? Math.round(sum.done / sum.total * 100) : 0}%"></span></span></span>${SM.icon("chevron")}</a>`;
          }).join("")}</div>` : `<div class="empty">${SM.icon("tape")}<p>${t("No measurements yet. Start with a garment template.")}</p></div>`}
        </section>
        <section class="card">
          <div class="card-head"><h2>${t("Photos")}</h2><span class="muted small">${photos.length}</span></div>
          ${photos.length ? `<div class="photo-grid" data-photos></div>` : `<p class="muted">${t("No photos stored for this customer.")}</p>`}
        </section>
        ${c.notes ? `<section class="card"><h3>${t("Notes")}</h3><p style="margin-top:8px">${U.esc(c.notes)}</p></section>` : ""}
        <section class="card">
          <div class="card-head"><h2>${t("Delete customer")}</h2></div>
          <p class="muted small">${t("Removes this profile, all measurement records and all stored photos from this device. This cannot be undone. Export a copy first if you may need it.")}</p>
          <div class="btn-row" style="margin-top:10px"><button class="btn danger" data-del>${SM.icon("trash")}${t("Delete customer and data")}</button></div>
        </section>
      </div>`;
    const grid = U.$("[data-photos]", el);
    if (grid) photos.forEach((p) => {
      const a = document.createElement("a"); a.className = "photo-card"; a.href = "#/photos/" + p.id;
      a.innerHTML = `<img src="${URL.createObjectURL(p.thumb || p.blob)}" alt=""><span class="cap">${t(SM.overlays.VIEWS[p.view] ? SM.overlays.VIEWS[p.view].name : "Photo")} · ${U.esc(U.fmtDate(p.createdAt))}</span>`;
      grid.appendChild(a);
    });
    U.$("[data-newm]", el).onclick = () => chooseTemplate(c);
    U.$("[data-scan]", el).onclick = () => { app.state.customerId = c.id; SM.wizard.start({ customerId: c.id }); };
    U.$("[data-cam]", el).onclick = () => { app.state.customerId = c.id; app.go("#/camera"); };
    U.$("[data-dup]", el).onclick = async () => { const d = await SM.customers.duplicate(c.id); await SM.db.log("Duplicated " + c.name, d.id); U.toast(t("Duplicate created: {code}", { code: d.code })); app.go("#/customer/" + d.id); };
    U.$("[data-exp]", el).onclick = async () => {
      const data = await SM.backup.build({ customerId: c.id });
      const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
      await app.deliver(blob, U.safeName(c.code + "_" + c.name) + "_profile.json", "saveas");
    };
    U.$("[data-del]", el).onclick = async () => {
      if (!(await U.confirm({ title: t("Delete {n}?", { n: c.name }), message: t("This permanently removes the profile, {s} measurement record(s) and {p} photo(s) from this device.", { s: sessions.length, p: photos.length }), ok: t("Delete permanently"), danger: true }))) return;
      await SM.customers.remove(c.id); await SM.db.log("Deleted customer " + c.code);
      U.toast(t("Customer deleted")); app.go("#/customers");
    };
  };

  /* choose a garment template then open a session */
  async function chooseTemplate(c, then) {
    const templates = await app.templatesAll();
    const group = SM.templates.suggestedGroup(c.template);
    const order = [group].concat(SM.templates.GROUPS.filter((g) => g !== group));
    const s = U.sheet({
      title: t("Choose garment"), html: `${c.garment ? `<button class="list-item" data-t="${c.garment}"><span class="avatar">${SM.icon("star")}</span><span class="main"><span class="t">${U.esc((templates.find((x) => x.id === c.garment) || {}).name || "")}</span><span class="s">${t("Customer's garment category")}</span></span></button>` : ""}
      ${order.map((g) => { const list = templates.filter((x) => x.group === g); return list.length ? `<h3>${t(g)}</h3><div class="choice-grid">${list.map((x) => `<button class="choice" data-t="${x.id}"><b>${U.esc(x.name)}</b><small>${SM.templates.items(x).length} ${t("measurements")}</small></button>`).join("")}</div>` : ""; }).join("")}`
    });
    s.el.onclick = async (e) => {
      const b = e.target.closest("[data-t]"); if (!b) return;
      s.close();
      const ses = await app.ensureSession(c.id, b.dataset.t);
      if (then) then(ses); else app.go("#/session/" + ses.id);
    };
  }
  SM.app.chooseTemplate = chooseTemplate;

  /* ---------- compare history ---------- */
  SM.views.compare = async function (el, args) {
    const c = await SM.customers.get(args[0]); if (!c) return app.go("#/customers");
    const sessions = await SM.customers.sessions(c.id);
    if (sessions.length < 2) { el.innerHTML = app.head({ title: t("Compare") }) + `<div class="empty">${t("At least two measurement records are needed.")}</div>`; return; }
    const unit = app.unit(c);
    const st = app._cmp && app._cmp.cid === c.id ? app._cmp : (app._cmp = { cid: c.id, a: sessions[1].id, b: sessions[0].id });
    const A = sessions.find((s) => s.id === st.a) || sessions[1], B = sessions.find((s) => s.id === st.b) || sessions[0];
    const ids = Array.from(new Set(Object.keys(A.items).concat(Object.keys(B.items)))).filter((id) => (A.items[id] && A.items[id].value != null) || (B.items[id] && B.items[id].value != null));
    const rows = E.compare(A, B, ids);
    const opt = (sel) => sessions.map((s) => `<option value="${s.id}" ${s.id === sel ? "selected" : ""}>${U.esc(U.fmtDate(s.date))} · ${U.esc(((SM.templates.builtin.find((x) => x.id === s.templateId)) || {}).name || t("Custom"))}</option>`).join("");
    el.innerHTML = app.head({ eyebrow: c.name, title: t("Compare measurements"), actions: `<a class="btn" href="#/customer/${c.id}">${SM.icon("back")}${t("Back")}</a>` }) + `
      <div class="card stack">
        <div class="form-grid"><label class="field">${t("Older record")}<select id="cmpA">${opt(A.id)}</select></label><label class="field">${t("Newer record")}<select id="cmpB">${opt(B.id)}</select></label></div>
        <div class="rep-scroll"><table class="rep-table" style="color:var(--ink)"><thead><tr><th>${t("Measurement")}</th><th class="num">${U.esc(U.fmtDate(A.date))}</th><th class="num">${U.esc(U.fmtDate(B.date))}</th><th class="num">${t("Change")} (${E.unitLabel(unit)})</th></tr></thead>
        <tbody>${rows.map((r) => `<tr><td>${U.esc(SM.catalog.name(r.id))}</td><td class="num">${E.format(r.a, unit, r.id)}</td><td class="num">${E.format(r.b, unit, r.id)}</td><td class="num" style="color:${r.diff > 0 ? "var(--warn)" : r.diff < 0 ? "var(--teal)" : "inherit"}">${r.diff == null ? "–" : (r.diff > 0 ? "+" : "") + E.format(Math.abs(r.diff), unit, r.id).replace(/^/, r.diff < 0 ? "−" : "")}</td></tr>`).join("")}</tbody></table></div>
      </div>`;
    U.$("#cmpA").onchange = (e) => { st.a = e.target.value; app.rerender(); };
    U.$("#cmpB").onchange = (e) => { st.b = e.target.value; app.rerender(); };
  };
})();

</script>
<script>/* src/measurement-engine/session-view.js */
/* Measurement record editor: manual entry, repeat readings, verification,
 * allowances, custom measurements. Saves automatically. */
(function () {
  "use strict";
  const SM = window.SM, U = SM.util, t = SM.t, app = SM.app, E = SM.engine;

  SM.views.session = async function (el, args) {
    const s = await SM.db.get("sessions", args[0]);
    if (!s) { el.innerHTML = `<div class="empty">${t("Measurement record not found.")}</div>`; return; }
    const c = await SM.customers.get(s.customerId);
    const tpl = await app.resolveTemplate(s.templateId);
    const unit = app.unit(c);
    const tol = (app.settings.tolerance || E.DEFAULT_TOL)[(tpl && tpl.fit) || "semi"] || 1;
    const ui = (app._sesUI = app._sesUI && app._sesUI.id === s.id ? app._sesUI : { id: s.id, filter: "all", open: {} });
    app.state.customerId = s.customerId;

    const save = U.debounce(() => app.saveSession(s), 250);
    const ids = () => app.sessionIds(s, tpl);
    const item = (id) => (s.items[id] = s.items[id] || E.newItem());
    const name = (id) => app.itemName(id, s, tpl);

    el.innerHTML = app.head({ eyebrow: (c ? c.name + " · " + c.code : "") , title: tpl ? tpl.name : t("Measurements"),
      actions: `<a class="btn" href="#/customer/${s.customerId}">${SM.icon("back")}${t("Profile")}</a><a class="btn" href="#/report/${s.id}">${SM.icon("report")}${t("Report")}</a><button class="btn primary" data-scan>${SM.icon("scan")}${t("Scan")}</button>` }) + `
      <div class="stack">
        <section class="card stack" id="sesSummary"></section>
        <div class="row between">
          <div class="filters" role="group" aria-label="${t("Show")}">${[["all", "All"], ["todo", "To do"], ["verify", "Needs tape check"], ["verified", "Verified"]].map(([k, n]) => `<button class="btn sm ${ui.filter === k ? "navy" : ""}" data-filter="${k}">${t(n)}</button>`).join("")}</div>
          <button class="btn sm" data-add>${SM.icon("plus")}${t("Add measurement")}</button>
        </div>
        <div class="m-list" id="mList"></div>
        <section class="card stack">
          <h3>${t("Record details")}</h3>
          <div class="form-grid">
            <label class="field">${t("Measurement date")}<input type="date" id="sDate" value="${U.esc(s.date)}"></label>
            <label class="field">${t("Tailor / designer")}<input type="text" id="sDesigner" value="${U.esc(s.designer)}"></label>
            <label class="field">${t("Seam allowance")} (${E.unitLabel(unit)})<input type="number" step="any" inputmode="decimal" id="sSeam" value="${s.seamAllowanceCm != null ? E.format(s.seamAllowanceCm, unit) : ""}"><span class="hint">${t("Recorded for the pattern. Never added to body or finished values.")}</span></label>
          </div>
          <label class="field">${t("Tailor remarks")}<textarea id="sRemarks">${U.esc(s.remarks)}</textarea></label>
          <div class="btn-row"><button class="btn danger sm" data-delses>${SM.icon("trash")}${t("Delete this record")}</button></div>
        </section>
      </div>`;

    function summary() {
      const sum = E.summary(s, ids());
      const incons = ids().filter((id) => s.items[id] && E.inconsistent(s.items[id], tol)).length;
      U.$("#sesSummary").innerHTML = `
        <div class="row between"><div><b class="tnum" style="font:700 26px/1 var(--body)">${sum.done}<span class="muted" style="font-size:18px"> / ${sum.total}</span></b> <span class="muted">${t("recorded")}</span></div>
        <div class="row">${sum.verified ? `<span class="chip st-verified">${sum.verified} ${t("verified")}</span>` : ""}${sum.verify ? `<span class="chip st-requires_verification">${sum.verify} ${t("need tape check")}</span>` : ""}${incons ? `<span class="chip st-rejected">${incons} ${t("inconsistent")}</span>` : ""}</div></div>
        <div class="progress"><span style="width:${sum.total ? Math.round(sum.done / sum.total * 100) : 0}%"></span></div>
        <p class="muted small">${t("Units")}: ${E.unitLabel(unit)} · ${t("Repeat-reading tolerance")}: ${E.format(tol, unit)} ${E.unitLabel(unit)} (${t(SM.templates.FIT[(tpl && tpl.fit) || "semi"])}) · ${t("Changes save automatically.")}</p>`;
    }

    function rowHTML(id) {
      const it = s.items[id] || E.newItem(), entry = SM.catalog.get(id);
      const st = E.status(it, entry), need = it.value != null && !it.verified && E.needsVerification(it, entry);
      const inc = E.inconsistent(it, tol), open = ui.open[id];
      const isAngle = E.isAngle(id);
      const fin = E.finished(it);
      return `<div class="m-row ${need || inc ? "flag" : ""} ${it.verified ? "verified" : ""}" data-id="${id}">
        <button class="m-name" data-info style="border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;font-weight:600">${U.esc(name(id))}<small>${entry ? t(SM.catalog.KIND_LABEL[entry.kind]) + (entry.camera ? " · " + t("photo-measurable") : " · " + t("tape only")) : t("Custom measurement")}${entry && entry.critical ? " · " + t("fit-critical") : ""}</small></button>
        <div class="m-val"><input type="number" inputmode="decimal" step="any" data-val value="${it.value != null ? E.format(it.value, unit, id).replace("°", "") : ""}" aria-label="${U.esc(name(id))}" ${it.verified ? 'data-verified="1"' : ""}><span class="u">${isAngle ? "°" : E.unitLabel(unit)}</span></div>
        <div class="m-meta">${app.statusChip(st)}${it.value != null || it.method === "unavailable" ? `<span class="chip">${U.esc(t(E.classification(it)))}</span>` : ""}${it.readings.length > 1 ? `<span class="chip">${it.readings.length} ${t("readings")}</span>` : ""}${inc ? `<span class="chip st-rejected">${t("Readings differ by")} ${E.format(E.spread(it), unit, id)}</span>` : ""}${fin != null ? `<span class="chip teal">${t("Finished")} ${E.format(fin, unit, id)}</span>` : ""}
          <button class="btn sm ghost" data-toggle style="margin-left:auto">${open ? t("Less") : t("More")}</button></div>
        ${open ? `<div class="m-more">
          <div class="form-grid">
            <label class="field">${t("Method")}<select data-method>${Object.entries(E.METHODS).map(([k, v]) => `<option value="${k}" ${(it.method || "manual") === k ? "selected" : ""} ${k === "ai" ? "disabled" : ""}>${t(v)}${k === "ai" ? " (" + t("Phase 2") + ")" : ""}</option>`).join("")}</select></label>
            <label class="field">${t("Add a reading")}<span class="row" style="flex-wrap:nowrap"><input type="number" inputmode="decimal" step="any" data-newread placeholder="${isAngle ? "°" : E.unitLabel(unit)}"><button class="btn sm" data-addread>${t("Add")}</button></span></label>
          </div>
          ${it.readings.length ? `<div><div class="muted small" style="margin-bottom:6px">${t("Readings (value = average of readings with the current method)")}</div><div class="readings">${it.readings.map((r, i) => `<span class="reading" title="${U.esc(t(E.METHODS[r.method] || r.method))} · ${U.esc(U.fmtDateTime(r.at))}">${E.format(r.v, unit, id)} <small class="muted">${r.method === "camera" ? t("cam") : r.method === "ai" ? t("AI") : t("tape")}</small><button data-rmread="${i}" aria-label="${t("Remove reading")}">${SM.icon("x")}</button></span>`).join("")}</div></div>` : ""}
          ${!isAngle ? `<div class="form-grid">
            <label class="field">${t("Garment ease")} (${E.unitLabel(unit)})<input type="number" step="any" inputmode="decimal" data-ease value="${it.ease != null ? E.format(it.ease, unit) : ""}"></label>
            <label class="field">${t("Design allowance")} (${E.unitLabel(unit)})<input type="number" step="any" inputmode="decimal" data-design value="${it.design != null ? E.format(it.design, unit) : ""}"></label>
            <div class="field">${t("Finished measurement")}<div style="padding:12px 0;font-weight:700" class="tnum">${fin != null ? E.format(fin, unit) + " " + E.unitLabel(unit) : "–"}</div></div>
          </div>` : ""}
          <label class="field">${t("Note")}<input type="text" data-note value="${U.esc(it.note || "")}" placeholder="${t("e.g. measured over thin kurta")}"></label>
          <div class="btn-row">
            ${it.verified ? `<button class="btn sm" data-unverify>${t("Remove verification")}</button>` : `<button class="btn sm primary" data-verify ${it.value == null ? "disabled" : ""}>${SM.icon("check")}${t("Mark tape-verified")}</button>`}
            <button class="btn sm danger" data-reject ${it.value == null ? "disabled" : ""}>${t("Reject value")}</button>
            ${entry && entry.camera ? `<button class="btn sm" data-photo>${SM.icon("ruler")}${t("Measure on photo")}</button>` : ""}
            ${(s.customDefs || []).some((d) => d.id === id) || (s.order && s.order.includes(id) && !SM.templates.items(tpl).includes(id)) ? `<button class="btn sm ghost" data-remove>${t("Remove from list")}</button>` : ""}
          </div>
          ${it.verified ? `<p class="muted small">${t("Verified")} ${it.verified.by ? t("by") + " " + U.esc(it.verified.by) + " " : ""}${U.esc(U.fmtDateTime(it.verified.at))}. ${t("Verified values cannot be changed without confirmation.")}</p>` : ""}
          ${it.rejected ? `<p class="small" style="color:var(--danger)">${t("Rejected")}: ${U.esc(it.rejected.reason || "")}</p>` : ""}
        </div>` : ""}
      </div>`;
    }

    function list() {
      const all = ids();
      const shown = all.filter((id) => {
        const it = s.items[id], entry = SM.catalog.get(id);
        if (ui.filter === "todo") return !it || it.value == null;
        if (ui.filter === "verify") return it && it.value != null && !it.verified && E.needsVerification(it, entry);
        if (ui.filter === "verified") return it && it.verified;
        return true;
      });
      U.$("#mList").innerHTML = shown.length ? shown.map(rowHTML).join("") : `<div class="empty">${t("Nothing in this filter.")}</div>`;
    }
    function refreshRow(id) {
      const old = U.$(`.m-row[data-id="${CSS.escape(id)}"]`);
      if (old) { const tmp = document.createElement("div"); tmp.innerHTML = rowHTML(id); old.replaceWith(tmp.firstElementChild); }
      summary();
    }

    async function guardVerified(id) {
      const it = item(id);
      if (!it.verified) return true;
      return U.confirm({ title: t("Replace a verified value?"), message: t("{n} was verified with a tape. Replacing it removes the verification.", { n: name(id) }), ok: t("Replace"), danger: true });
    }

    summary(); list();

    const mlist = U.$("#mList");
    mlist.addEventListener("change", async (e) => {
      const row = e.target.closest(".m-row"); if (!row) return;
      const id = row.dataset.id, it = item(id);
      if (e.target.matches("[data-val]")) {
        const txt = e.target.value.trim();
        if (!txt) {
          if (it.verified && !(await guardVerified(id))) { refreshRow(id); return; }
          it.readings = []; it.value = null; it.method = null; it.verified = null; save(); refreshRow(id); return;
        }
        const v = E.parse(txt, unit, id);
        if (v == null) { U.toast(t("Enter a number greater than zero."), "err"); refreshRow(id); return; }
        const force = it.verified ? await guardVerified(id) : false;
        if (it.verified && !force) { refreshRow(id); return; }
        const r = E.setValue(it, v, "manual", { force, by: s.designer });
        if (!r.ok) U.toast(t("Not saved."), "err");
        save(); refreshRow(id);
      } else if (e.target.matches("[data-method]")) {
        if (it.value == null) { it.method = e.target.value; if (e.target.value === "unavailable") it.method = "unavailable"; save(); refreshRow(id); return; }
        if (it.verified && !(await guardVerified(id))) { refreshRow(id); return; }
        it.method = e.target.value; it.verified = null;
        if (it.method === "unavailable") { it.readings = []; it.value = null; }
        else it.readings.forEach((r) => (r.method = it.method));
        save(); refreshRow(id);
      } else if (e.target.matches("[data-ease],[data-design]")) {
        const v = e.target.value.trim(); const k = e.target.matches("[data-ease]") ? "ease" : "design";
        it[k] = v === "" ? null : E.fromUnit(parseFloat(v), unit);
        if (it[k] != null && !isFinite(it[k])) it[k] = null;
        save(); refreshRow(id);
      } else if (e.target.matches("[data-note]")) { it.note = e.target.value.trim(); save(); }
    });
    mlist.addEventListener("click", async (e) => {
      const row = e.target.closest(".m-row"); if (!row) return;
      const id = row.dataset.id, it = item(id);
      if (e.target.closest("[data-toggle]")) { ui.open[id] = !ui.open[id]; refreshRow(id); }
      else if (e.target.closest("[data-info]")) SM.bodymap.showEntry(id, { sessionId: s.id });
      else if (e.target.closest("[data-addread]")) {
        const inp = row.querySelector("[data-newread]"); const v = E.parse(inp.value, unit, id);
        if (v == null) { U.toast(t("Enter a reading greater than zero."), "err"); return; }
        let force = false; if (it.verified) { force = await guardVerified(id); if (!force) return; }
        const method = row.querySelector("[data-method]").value === "unavailable" ? "manual" : row.querySelector("[data-method]").value;
        E.addReading(it, v, method, { force, by: s.designer });
        save(); refreshRow(id);
        if (E.inconsistent(it, tol)) U.toast(t("Readings differ by more than the tolerance. Measure again."), "err");
      } else if (e.target.closest("[data-rmread]")) {
        const i = +e.target.closest("[data-rmread]").dataset.rmread;
        let force = false; if (it.verified) { force = await guardVerified(id); if (!force) return; }
        E.removeReading(it, i, { force }); save(); refreshRow(id);
      } else if (e.target.closest("[data-verify]")) {
        if (E.inconsistent(it, tol) && !(await U.confirm({ title: t("Readings are inconsistent"), message: t("The readings differ by more than the tolerance. Verify anyway?"), ok: t("Verify anyway") }))) return;
        E.verify(it, s.designer || app.settings.designer); save(); refreshRow(id); U.toast(t("{n} marked as tape-verified", { n: name(id) }));
      } else if (e.target.closest("[data-unverify]")) { E.unverify(it); save(); refreshRow(id); }
      else if (e.target.closest("[data-reject]")) {
        const reason = await U.prompt({ title: t("Reject value"), label: t("Reason (shown in the report)"), value: "", ok: t("Reject") });
        if (reason == null) return; E.reject(it, reason); save(); refreshRow(id);
      } else if (e.target.closest("[data-photo]")) SM.photosView.pickForMeasure(s, id);
      else if (e.target.closest("[data-remove]")) {
        s.customDefs = (s.customDefs || []).filter((d) => d.id !== id);
        if (s.order) s.order = s.order.filter((x) => x !== id);
        delete s.items[id]; save(); list(); summary();
      }
    });
    U.$$("[data-filter]", el).forEach((b) => (b.onclick = () => { ui.filter = b.dataset.filter; app.rerender(); }));
    U.$("[data-scan]", el).onclick = () => SM.wizard.start({ customerId: s.customerId, sessionId: s.id });
    U.$("[data-add]", el).onclick = () => addMeasurement();
    U.$("#sDate").onchange = (e) => { s.date = e.target.value || s.date; save(); };
    U.$("#sDesigner").onchange = (e) => { s.designer = e.target.value.trim(); save(); };
    U.$("#sSeam").onchange = (e) => { const v = e.target.value.trim(); s.seamAllowanceCm = v === "" ? null : E.fromUnit(parseFloat(v), unit); save(); };
    U.$("#sRemarks").onchange = (e) => { s.remarks = e.target.value; save(); };
    U.$("[data-delses]", el).onclick = async () => {
      if (!(await U.confirm({ title: t("Delete this record?"), message: t("All values in this measurement record will be removed. Photos stay in the customer's library."), ok: t("Delete"), danger: true }))) return;
      await SM.db.del("sessions", s.id); U.toast(t("Record deleted")); app.go("#/customer/" + s.customerId);
    };

    function addMeasurement() {
      const have = new Set(ids());
      const sh = U.sheet({ title: t("Add measurement"), html: `
        <form class="row" data-custom style="flex-wrap:nowrap"><input type="text" placeholder="${t("Custom measurement name")}" data-cname><button class="btn primary">${t("Add")}</button></form>
        <div class="search">${SM.icon("search")}<input type="search" placeholder="${t("Search the library")}" data-q></div>
        <div class="list" data-list></div>` });
      const draw = (q) => {
        q = (q || "").toLowerCase();
        sh.el.querySelector("[data-list]").innerHTML = SM.catalog.all.filter((e) => !have.has(e.id) && (!q || SM.catalog.name(e.id).toLowerCase().includes(q))).slice(0, 60)
          .map((e) => `<button class="list-item" data-pick="${e.id}"><span class="main"><span class="t">${U.esc(SM.catalog.name(e.id))}</span><span class="s">${t((SM.catalog.REGIONS.find((r) => r.id === e.region) || {}).name || "")} · ${t(SM.catalog.KIND_LABEL[e.kind])}</span></span>${SM.icon("plus")}</button>`).join("");
      };
      draw("");
      sh.el.querySelector("[data-q]").oninput = (e) => draw(e.target.value);
      sh.el.querySelector("[data-list]").onclick = (e) => {
        const b = e.target.closest("[data-pick]"); if (!b) return;
        s.order = ids(); s.order.push(b.dataset.pick); save(); sh.close(); list(); summary();
      };
      sh.el.querySelector("[data-custom]").onsubmit = (e) => {
        e.preventDefault(); const n = sh.el.querySelector("[data-cname]").value.trim(); if (!n) return;
        const id = "c_" + U.uid("m").slice(2);
        s.customDefs = (s.customDefs || []).concat([{ id, name: n }]); save(); sh.close(); list(); summary();
      };
    }
  };
})();

</script>
<script>/* src/body-map/bodymap.js */
/* Interactive body map, measurement library, measurement detail and the pose
 * reference library. Illustrations are generated from SM.figure (original SVG). */
(function () {
  "use strict";
  const SM = window.SM, U = SM.util, t = SM.t, app = SM.app;

  const st = { view: "front", age: "adult", region: "shoulders", q: "" };

  SM.views.library = async function (el) {
    el.innerHTML = app.head({ title: t("Measurement library"), sub: t("{n} head-to-toe measurements. Tap the body to choose a region, then a measurement for instructions.", { n: SM.catalog.all.length }), actions: `<a class="btn" href="#/poses">${SM.icon("body")}${t("Pose references")}</a>` }) + `
      <div class="bodymap">
        <div class="map-stage">
          <div class="row between">
            <div class="seg" role="group" aria-label="${t("View")}">${["front", "side", "back"].map((v) => `<button data-view="${v}" aria-pressed="${st.view === v}">${t(v[0].toUpperCase() + v.slice(1))}</button>`).join("")}</div>
            <div class="seg" role="group" aria-label="${t("Figure")}">${[["adult", "Adult"], ["child", "Child"]].map(([v, n]) => `<button data-age="${v}" aria-pressed="${st.age === v}">${t(n)}</button>`).join("")}</div>
          </div>
          <div class="map-svg" id="mapSvg" role="img" aria-label="${t("Body map. Tap a body region.")}"></div>
          <div class="filters">${SM.catalog.REGIONS.map((r) => `<button class="btn sm ${st.region === r.id ? "navy" : ""}" data-region="${r.id}">${t(r.name)}</button>`).join("")}</div>
        </div>
        <div class="stack">
          <div class="search">${SM.icon("search")}<input type="search" id="libQ" placeholder="${t("Search all measurements")}" value="${U.esc(st.q)}"></div>
          <div id="libList" class="list"></div>
        </div>
      </div>`;
    drawMap(); drawList();
    U.$$("[data-view]", el).forEach((b) => (b.onclick = () => { st.view = b.dataset.view; U.$$("[data-view]", el).forEach((x) => x.setAttribute("aria-pressed", x === b)); drawMap(); }));
    U.$$("[data-age]", el).forEach((b) => (b.onclick = () => { st.age = b.dataset.age; U.$$("[data-age]", el).forEach((x) => x.setAttribute("aria-pressed", x === b)); drawMap(); drawList(); }));
    U.$$("[data-region]", el).forEach((b) => (b.onclick = () => setRegion(b.dataset.region)));
    U.$("#libQ").oninput = (e) => { st.q = e.target.value; drawList(); };
    U.$("#mapSvg").onclick = (e) => {
      const svg = U.$("#mapSvg svg"); if (!svg) return;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const r = SM.figure.regionAt(st.view, st.age, p.x, p.y);
      if (r) setRegion(r);
    };
    function setRegion(r) { st.region = r; st.q = ""; U.$("#libQ").value = ""; U.$$("[data-region]", el).forEach((b) => b.classList.toggle("navy", b.dataset.region === r)); drawMap(); drawList(); }
  };
  function drawMap() { U.$("#mapSvg").innerHTML = SM.figure.svg({ view: st.view, age: st.age, arms: st.view === "side" ? "down" : "a", mode: "map", region: st.region === "full" ? null : st.region }); }
  function drawList() {
    const q = st.q.toLowerCase();
    const list = q ? SM.catalog.all.filter((e) => (SM.catalog.name(e.id) + " " + e.desc).toLowerCase().includes(q)) : SM.catalog.byRegion(st.region);
    const reg = SM.catalog.REGIONS.find((r) => r.id === st.region);
    U.$("#libList").innerHTML = (q ? `<h3>${list.length} ${t("results")}</h3>` : `<h3>${t(reg ? reg.name : "")} · ${list.length}</h3>`) + list.map((e) => `
      <a class="list-item lib-item" href="#/measure/${e.id}"><span class="lib-thumb">${SM.figure.forEntry(e, st.age)}</span><span class="main"><span class="t">${U.esc(SM.catalog.name(e.id))}</span><span class="s">${t(SM.catalog.KIND_LABEL[e.kind])} · ${e.camera ? t("Tape or calibrated photo") : t("Tape only")}${e.critical ? " · " + t("fit-critical") : ""}</span></span>${SM.icon("chevron")}</a>`).join("");
  }

  function entryHTML(e, age) {
    const pose = SM.catalog.POSES[e.pose] || {};
    const method = e.camera
      ? t("Manual tape measurement, or a calibrated photo measurement (marker, A4 or known length; height calibration for vertical lines only).")
      : t("Manual tape measurement only. A photo cannot give a reliable value for this measurement.");
    const verify = e.critical
      ? t("Fit-critical. Any value from a photo must be confirmed with a tape before cutting.")
      : e.camera ? t("Photo values are marked “Requires verification” until checked, if used for fit.") : t("Record with a tape; mark as verified once double-checked.");
    return `
      <div class="ref-fig lg">${SM.figure.forEntry(e, age)}</div>
      <p class="lead">${U.esc(SM.i18n.catalog(e.id, "desc", e.desc))}</p>
      <div class="card stack-sm"><h3>${t("How to measure")}</h3><p>${U.esc(SM.i18n.catalog(e.id, "how", e.how))}</p></div>
      <dl class="kv">
        <dt>${t("Type")}</dt><dd>${t(SM.catalog.KIND_LABEL[e.kind])} · ${e.kind === "angle" ? t("degrees") : t("cm / mm / in")}</dd>
        <dt>${t("Landmarks")}</dt><dd>${t("Highlighted in gold on the illustration")}</dd>
        <dt>${t("Recommended pose")}</dt><dd><a href="#/poses/${e.pose}">${U.esc(t(pose.name || ""))}</a></dd>
        <dt>${t("Camera view")}</dt><dd>${t(e.view === "side" ? "Side" : e.view === "back" ? "Back" : "Front")}</dd>
        <dt>${t("Method")}</dt><dd>${method}</dd>
        <dt>${t("Verification")}</dt><dd>${verify}</dd>
      </dl>`;
  }

  SM.views.measure = async function (el, args) {
    const e = SM.catalog.get(args[0]); if (!e) return app.go("#/library");
    el.innerHTML = app.head({ eyebrow: t((SM.catalog.REGIONS.find((r) => r.id === e.region) || {}).name || ""), title: SM.catalog.name(e.id),
      actions: `<a class="btn" href="#/library">${SM.icon("back")}${t("Library")}</a>` }) +
      `<div class="grid-2"><div class="stack">${entryHTML(e, st.age)}</div>
      <div class="stack"><section class="card stack"><h2>${t("Record this measurement")}</h2>
        <p class="muted">${t("Choose a customer to enter the value by hand, or measure it on a calibrated photo.")}</p>
        <div class="btn-row"><button class="btn primary" data-manual>${SM.icon("edit")}${t("Enter manually")}</button>${e.camera ? `<button class="btn" data-photo>${SM.icon("ruler")}${t("Measure on photo")}</button>` : ""}</div>
        ${!e.camera ? `<div class="notice">${SM.icon("info")}<div>${t("Camera-assisted measurement is not offered here because a photo cannot capture the full girth or depth.")}</div></div>` : ""}
      </section></div></div>`;
    U.$("[data-manual]", el).onclick = () => recordFor(e.id, "manual");
    const ph = U.$("[data-photo]", el); if (ph) ph.onclick = () => recordFor(e.id, "photo");
  };

  /* open (or create) a record for a chosen customer that contains this measurement */
  async function recordFor(id, mode, ctx) {
    let s = ctx && ctx.sessionId ? await SM.db.get("sessions", ctx.sessionId) : null;
    if (!s) {
      const c = app.state.customerId ? await SM.customers.get(app.state.customerId) : null;
      const cust = c && (await U.confirm({ title: t("Use {n}?", { n: c.name }), message: t("Record this measurement for the selected customer?"), ok: t("Yes"), cancel: t("Choose another") })) ? c : await app.pickCustomer();
      if (!cust) return;
      const list = await SM.customers.sessions(cust.id);
      s = list[0] || (await app.ensureSession(cust.id, cust.garment || "u_body_basic"));
    }
    const tpl = await app.resolveTemplate(s.templateId);
    const ids = app.sessionIds(s, tpl);
    if (!ids.includes(id)) { s.order = ids.concat([id]); await app.saveSession(s); }
    app._sesUI = { id: s.id, filter: "all", open: { [id]: true } };
    if (mode === "photo") SM.photosView.pickForMeasure(s, id);
    else app.go("#/session/" + s.id);
  }

  function showEntry(id, ctx) {
    const e = SM.catalog.get(id);
    if (!e) { U.toast(t("Custom measurement: no library entry.")); return; }
    const s = U.sheet({ title: SM.catalog.name(id), wide: true, html: entryHTML(e, st.age) + `<div class="btn-row end">${e.camera ? `<button class="btn" data-photo>${SM.icon("ruler")}${t("Measure on photo")}</button>` : ""}<button class="btn primary" data-close>${t("Done")}</button></div>` });
    const ph = s.el.querySelector("[data-photo]"); if (ph) ph.onclick = () => { s.close(); recordFor(id, "photo", ctx); };
  }

  /* ---------- pose references ---------- */
  SM.views.poses = async function (el, args) {
    const focus = args[0];
    const canSpeak = "speechSynthesis" in window;
    el.innerHTML = app.head({ title: t("Pose references"), sub: t("Show the customer the pose before opening the camera. Text guidance is always shown; spoken guidance uses the device's built-in voices where available."), actions: `<a class="btn" href="#/library">${SM.icon("back")}${t("Library")}</a>` }) +
      `<div class="stack">${Object.entries(SM.catalog.POSES).map(([id, p]) => `
        <section class="card" id="pose-${id}" ${focus === id ? 'style="border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)"' : ""}>

              <div class="notice warn">${SM.icon("warn")}<div><b>${t("Common mistakes")}</b><ul>${p.mistakes.map((m) => `<li>${U.esc(t(m))}</li>`).join("")}</ul></div></div>

<script>/* src/garment-templates/views.js */
/* Garment template screens: browse built-ins, customise copies, edit custom templates. */
(function () {

  const SM = window.SM, U = SM.util, t = SM.t, app = SM.app;

  SM.views.templates = async function (el) {

      `<div class="stack">${SM.templates.GROUPS.map((g) => { const list = all.filter((x) => x.group === g); return list.length ? `<section class="stack-sm"><h3>${t(g)}</h3><div class="choice-grid">${list.map((x) => `<a class="choice" href="#/template/${x.id}" style="text-decoration:none"><b>${U.esc(x.name)}</b><small>${SM.templates.items(x).length} ${t("measurements")} · ${t(SM.templates.FIT[x.fit] || "")}${x.builtin ? "" : " · " + t("custom")}</small></a>`).join("")}</div></section>` : ""; }).join("")}</div>`;
    U.$("[data-new]", el).onclick = async () => {
