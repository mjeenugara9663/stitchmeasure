:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --surface-2:#EFEBE2; --ink:#0E1B2C; --ink-2:#4A586C; --ink-3:#7A8698; --line:#E3DDD1;
  --navy:#0E1B2C; --navy-2:#16294A; --ivory:#F6F3EC;
  --teal:#1F8A84; --teal-ink:#FFFFFF; --teal-soft:#DCEFEC; --gold:#A98236; --gold-bright:#D8B76A; --gold-soft:#F4EAD3;
  --ok:#2E7D5B; --ok-soft:#DDF0E6; --warn:#9A6212; --warn-soft:#FBEBCF; --danger:#B03A3A; --danger-soft:#F8E1DF; --info-soft:#E3EAF5;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(14,27,44,.06),0 6px 20px rgba(14,27,44,.06);
  --sel-bg:#0E1B2C; --sel-ink:#F6F3EC; --nav-h:68px; --top-h:58px;
  --fig-fill:#C9D3DF; --fig-line:#8D9AAD;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1522; --surface:#111F35; --surface-2:#172A46; --ink:#F2EEE5; --ink-2:#AFBACB; --ink-3:#7F8CA1; --line:#223656;
  --teal:#3CC4B8; --teal-ink:#06201E; --teal-soft:#0F3638; --gold:#D8B76A; --gold-soft:#33291A;
  --ok:#5CC28F; --ok-soft:#123326; --warn:#E3A34A; --warn-soft:#3A2A12; --danger:#EE7B72; --danger-soft:#3D1C1B; --info-soft:#1A2A44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --fig-fill:#2B405F; --fig-line:#5B7397; --sel-bg:#F2EEE5; --sel-ink:#0B1522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1522; --surface:#111F35; --surface-2:#172A46; --ink:#F2EEE5; --ink-2:#AFBACB; --ink-3:#7F8CA1; --line:#223656;
  --teal:#3CC4B8; --teal-ink:#06201E; --teal-soft:#0F3638; --gold:#D8B76A; --gold-soft:#33291A;
  --ok:#5CC28F; --ok-soft:#123326; --warn:#E3A34A; --warn-soft:#3A2A12; --danger:#EE7B72; --danger-soft:#3D1C1B; --info-soft:#1A2A44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --fig-fill:#2B405F; --fig-line:#5B7397; --sel-bg:#F2EEE5; --sel-ink:#0B1522; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}
img,svg,video,canvas{max-width:100%}
[hidden]{display:none!important}
a{color:var(--teal)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 30px/1.1 var(--display);letter-spacing:.005em}
h2{font:600 22px/1.2 var(--display)}
h3{font:600 13px/1.3 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
p{margin:0}
.lead{color:var(--ink-2)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.num,.tnum{font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;flex:none}
:focus-visible{outline:2.5px solid var(--gold-bright);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{min-height:100%;display:grid;grid-template-columns:1fr}
.sidebar{display:none}
.topbar{position:sticky;top:0;z-index:30;height:calc(var(--top-h) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;background:var(--navy);color:var(--ivory)}
.topbar .title{font:600 21px/1 var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .icon-btn{color:var(--ivory)}
.brand-mark{width:30px;height:30px;flex:none}
.status-pill{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--body);letter-spacing:.04em;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ivory);white-space:nowrap}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gold-bright)}
.status-pill.ready .dot{background:#3CC4B8}
.status-pill.off .dot{background:#EE7B72}
main.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:1080px;width:100%;margin:0 auto;min-width:0}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--ink-3);text-decoration:none;font:600 11px/1.1 var(--body);border-radius:12px;min-height:52px;justify-content:center}
.bottomnav a.on{color:var(--teal)}
.bottomnav a.scan .ic{width:28px;height:28px;padding:10px;box-sizing:content-box;background:var(--navy);color:var(--gold-bright);border-radius:50%;margin-top:-26px;box-shadow:0 4px 14px rgba(14,27,44,.3);border:3px solid var(--surface)}
@media (min-width:900px){
  .app{grid-template-columns:256px 1fr}
  .sidebar{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--navy);color:var(--ivory);padding:22px 14px;overflow:auto}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
  .sidebar .brand b{font:600 22px/1 var(--display)}
  .sidebar .brand small{display:block;font:600 10px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-bright)}
  .sidebar a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#C9D2E0;text-decoration:none;font-weight:500}
  .sidebar a:hover{background:rgba(255,255,255,.06);color:#fff}
  .sidebar a.on{background:rgba(60,196,184,.14);color:#fff}
  .sidebar a.on .ic{color:#3CC4B8}
  .sidebar .side-foot{margin-top:auto;padding:12px;font-size:12px;color:#8E9BB0}
  .bottomnav{display:none}
  .topbar{display:none}
  main.content{padding-block:28px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
}

/* ---------- page furniture ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head .eyebrow{font:600 11.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.page-head p{color:var(--ink-2);margin-top:6px;max-width:62ch}
.stack{display:grid;gap:14px}
.stack-sm{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.pad-lg{padding:20px}
.card h2+p,.card h2+.lead{margin-top:4px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:4px 0}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:var(--ivory);border-radius:18px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:32px}
.hero p{color:#C4CDDB;margin-top:6px;max-width:44ch}
.hero .eyebrow{color:var(--gold-bright);font:600 11.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
.hero .hero-fig{width:96px;opacity:.95}
.hero .hero-fig .fig-fill{fill:rgba(255,255,255,.1);stroke:rgba(216,183,106,.8)}
.hero .btn-row{margin-top:16px}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero .hero-fig{display:none}}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14.5px/1 var(--body);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn .ic{width:19px;height:19px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.navy{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.btn.gold{background:transparent;border-color:var(--gold);color:var(--gold)}
.hero .btn.gold{color:var(--gold-bright);border-color:var(--gold-bright)}
.hero .btn.primary{background:#3CC4B8;border-color:#3CC4B8;color:#06201E}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px}
.btn.block{width:100%}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row.end{justify-content:flex-end}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:rgba(127,140,161,.14)}
.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.field .hint{font-weight:400;color:var(--ink-3);font-size:12.5px}
input[type=text],input[type=tel],input[type=number],input[type=search],input[type=password],input[type=date],select,textarea{width:100%;min-width:0;font:500 16px/1.3 var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;min-height:46px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink);font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal);margin:1px 0 0;flex:none}
input[type=range]{width:100%;accent-color:var(--teal)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink-2);font:600 13px/1 var(--body);padding:9px 13px;border-radius:999px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,27,44,.12)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:19px}
.search input{padding-left:40px}

/* ---------- chips & badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--body);padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.st-not_started{background:var(--surface-2);color:var(--ink-3)}
.chip.st-captured{background:var(--info-soft);color:var(--ink)}
.chip.st-estimated{background:var(--warn-soft);color:var(--warn)}
.chip.st-requires_verification{background:var(--warn-soft);color:var(--warn)}
.chip.st-verified{background:var(--ok-soft);color:var(--ok)}
.chip.st-rejected{background:var(--danger-soft);color:var(--danger)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.sample{background:var(--gold-soft);color:var(--gold)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--info-soft);font-size:14px;color:var(--ink)}
.notice .ic{margin-top:1px;width:20px;height:20px;color:var(--teal)}
.notice.warn{background:var(--warn-soft)} .notice.warn .ic{color:var(--warn)}
.notice.danger{background:var(--danger-soft)} .notice.danger .ic{color:var(--danger)}
.notice.ok{background:var(--ok-soft)} .notice.ok .ic{color:var(--ok)}
.notice ul{margin:6px 0 0;padding-left:18px}

/* ---------- KPI tiles (real counts) ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit;display:grid;gap:2px}
.kpi b{font:600 30px/1 var(--body);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi.attn b{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;min-height:104px;cursor:pointer;text-align:left;font-family:inherit;font-size:14.5px}
.tile .ic{width:26px;height:26px;color:var(--teal)}
.tile small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.tile:hover{border-color:var(--teal)}

/* ---------- lists ---------- */
.list{display:grid;gap:8px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;min-width:0;cursor:pointer;text-align:left;font:inherit;width:100%}
.list-item:hover{border-color:var(--ink-3)}
.list-item .main{flex:1;min-width:0}
.list-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .s{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font:600 16px/1 var(--display);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;padding:30px 16px;color:var(--ink-3);display:grid;gap:10px;justify-items:center}
.empty .ic{width:40px;height:40px;color:var(--gold)}

/* ---------- measurement session ---------- */
.m-list{display:grid;gap:8px}
.m-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.m-row.flag{border-color:var(--warn)}
.m-row.verified{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.m-name{font-weight:600;min-width:0}
.m-name small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px}
.m-val{display:flex;align-items:center;gap:6px}
.m-val input{width:104px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.m-val .u{font-size:13px;color:var(--ink-3);width:22px}
.m-meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.m-more{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:10px}
.readings{display:flex;gap:6px;flex-wrap:wrap}
.reading{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:8px;padding:4px 4px 4px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.reading button{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:2px;display:grid}
.reading .ic{width:15px;height:15px}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--teal);border-radius:999px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none}

/* ---------- body map & figures ---------- */
.figure .fig-fill{fill:var(--fig-fill);stroke:var(--fig-line);stroke-width:1.2;stroke-linejoin:round}
.figure .fig-arm{fill:var(--fig-fill)}
.figure .fig-seam{stroke:var(--fig-line);stroke-width:1;fill:none;stroke-dasharray:3 3}
.figure .fig-seam.faint{opacity:.5}
.figure .hl-line{stroke:var(--gold);stroke-width:2.6;fill:none;stroke-linecap:round}
.figure .hl-ghost{stroke:var(--gold);stroke-width:1.4;fill:none;opacity:.4;stroke-dasharray:3 3}
.figure .hl-dot{fill:var(--gold);stroke:var(--surface);stroke-width:1.2}
.figure .region-hl{fill:var(--teal);opacity:.16;stroke:var(--teal);stroke-width:1.2;stroke-opacity:.6}
.figure .ov-center{stroke:var(--teal);stroke-width:.8;stroke-dasharray:3 3}
.figure .ov-limit{stroke:var(--gold);stroke-width:1;stroke-dasharray:5 3}
.figure .ov-marker{stroke:var(--teal);stroke-width:1}
.figure .ov-label{fill:var(--ink-3);font:600 7.5px var(--body)}
.figure .ov-foot{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1}
.bodymap{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:18px;align-items:start}
@media (max-width:760px){.bodymap{grid-template-columns:1fr}}
.map-stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;position:sticky;top:calc(var(--top-h) + 10px)}
@media (max-width:760px){.map-stage{position:static}}
.map-svg{display:flex;justify-content:center;cursor:pointer;touch-action:manipulation}
.map-svg svg{height:min(56vh,460px);width:auto}
.ref-fig{background:var(--surface-2);border-radius:var(--r-sm);display:flex;justify-content:center;padding:10px}
.ref-fig svg{height:240px;width:auto}
.ref-fig.lg svg{height:min(48vh,360px)}
.lib-item{display:flex;gap:12px;align-items:center}
.lib-thumb{width:46px;height:64px;flex:none;background:var(--surface-2);border-radius:8px;display:flex;justify-content:center;align-items:center;overflow:hidden}
.lib-thumb svg{height:60px;width:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}

/* ---------- sheet (modal) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:100;background:rgba(6,12,22,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .2s ease-out}
.sheet.wide{max-width:920px}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 10px 10px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;min-width:0}
.sheet-body{padding:16px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));overflow:auto;display:grid;gap:14px}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:20px}.sheet{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--navy);color:var(--ivory);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(92vw,520px);box-shadow:0 8px 30px rgba(0,0,0,.3);text-align:center}
.toast.err{background:var(--danger);color:#fff}
@media (min-width:900px){.toast{bottom:28px}}

/* ---------- wizard ---------- */
.wiz-progress{display:grid;gap:8px;margin-bottom:16px}
.wiz-bar{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.wiz-bar span{height:5px;border-radius:3px;background:var(--line)}
.wiz-bar span.done{background:var(--teal)}
.wiz-bar span.on{background:var(--gold)}
.wiz-step-name{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);font-weight:600}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:grid;gap:4px}
.choice b{font-size:15px}
.choice small{color:var(--ink-3)}
.choice[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photo-card{position:relative;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);aspect-ratio:3/4;border:1px solid var(--line);cursor:pointer;padding:0;max-width:100%}
.photo-card img{width:100%;height:100%;object-fit:cover;display:block}
.photo-card .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(6,12,22,.8));color:#fff;font-size:12px;font-weight:600;text-align:left}
.photo-card.need{display:grid;place-items:center;text-align:center;color:var(--ink-3);font-size:13px;font-weight:600;border-style:dashed;padding:10px}

/* ---------- camera (full screen) ---------- */
.cam{position:fixed;inset:0;z-index:90;background:#000;color:#fff;display:flex;flex-direction:column}
.cam-top{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.75),transparent);position:absolute;top:0;left:0;right:0;z-index:5}
.cam-top .title{flex:1;font-weight:600;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam .icon-btn{color:#fff;background:rgba(0,0,0,.45);width:46px;height:46px}
.cam .icon-btn[aria-pressed="true"]{background:#3CC4B8;color:#06201E}
.cam-stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.cam-stage{position:relative;max-width:100%;max-height:100%}
.cam-stage video{display:block;width:100%;height:100%;object-fit:fill;background:#111}
.cam-stage video.mirror{transform:scaleX(-1)}
.cam-layer{position:absolute;inset:0;pointer-events:none}
.cam-outline{position:absolute;pointer-events:auto;touch-action:none;cursor:grab}
.cam-outline svg{width:100%;height:100%;display:block}
.cam-guide{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:6;max-width:min(92vw,440px);width:max-content;background:rgba(6,12,22,.78);border:1px solid rgba(255,255,255,.15);padding:9px 14px;border-radius:14px;font-weight:600;font-size:14.5px;text-align:center;display:grid;gap:3px}
.cam-guide.ok{border-color:#3CC4B8}
.cam-guide.warn{border-color:#E3A34A}
.cam-guide small{font-weight:500;color:#C4CDDB;font-size:12.5px}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(0,0,0,.8));display:grid;gap:12px}
.cam-views{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.cam-views::-webkit-scrollbar{display:none}
.cam-views button{flex:none;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;font:600 12.5px/1 var(--body);padding:9px 12px;border-radius:999px;cursor:pointer}
.cam-views button[aria-pressed="true"]{background:#fff;color:#0E1B2C}
.cam-actions{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.cam-actions .l{display:flex;gap:8px}
.cam-actions .r{display:flex;gap:8px;justify-content:flex-end}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.2);cursor:pointer;display:grid;place-items:center;padding:0}
.shutter span{width:58px;height:58px;border-radius:50%;background:#fff;display:block;transition:transform .1s}
.shutter:active span{transform:scale(.9)}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font:600 120px/1 var(--display);color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);z-index:7;pointer-events:none}
.cam-panel{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:8;width:min(300px,calc(100vw - 20px));background:rgba(10,18,32,.92);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;display:grid;gap:12px;max-height:calc(100vh - 220px);overflow:auto;font-size:13.5px}
.cam-panel label{display:grid;gap:5px;font-weight:600;color:#DCE3EE}
.cam-panel select{background:#16243B;color:#fff;border-color:#2B3F60;min-height:40px;padding:8px 10px;font-size:14px}
.cam-panel .check{color:#fff;display:flex}
.cam-panel .btn{min-height:38px;font-size:13px;background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.cam-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;z-index:4}
.cam-msg .box{max-width:420px;display:grid;gap:14px;justify-items:center}
.cam-msg .btn{background:#fff;color:#0E1B2C;border-color:#fff}
.cam-msg .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}

/* ---------- photo review & editor ---------- */
.review-img{background:#0B1522;border-radius:var(--r);display:flex;justify-content:center;overflow:hidden}
.review-img img,.review-img canvas{max-height:52vh;width:auto;max-width:100%;display:block}
.editor{position:fixed;inset:0;z-index:95;background:#0B1522;color:#fff;display:flex;flex-direction:column}
.ed-top{display:flex;align-items:center;gap:4px;padding:calc(6px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));background:#0E1B2C;border-bottom:1px solid #22375A}
.ed-top .title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor .icon-btn{color:#fff}
.editor .icon-btn[aria-pressed="true"]{background:#3CC4B8;color:#06201E}
.editor .icon-btn:disabled{opacity:.35}
.ed-stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#0E1B2C 0 25%,#0B1522 0 50%) 0 0/24px 24px}
.ed-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.ed-tools{display:flex;gap:4px;padding:6px max(8px,env(safe-area-inset-left,0px));background:#0E1B2C;border-top:1px solid #22375A;overflow-x:auto;scrollbar-width:none}
.ed-tools::-webkit-scrollbar{display:none}
.ed-tools button{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;padding:8px 6px;border:0;border-radius:12px;background:transparent;color:#C9D2E0;font:600 11px/1.1 var(--body);cursor:pointer}
.ed-tools button[aria-pressed="true"]{background:rgba(60,196,184,.18);color:#3CC4B8}
.ed-panel{background:#111F35;border-top:1px solid #22375A;padding:12px max(14px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:44vh;overflow:auto;font-size:14px}
.ed-panel .field{color:#C9D2E0}
.ed-panel select,.ed-panel input[type=number],.ed-panel input[type=text]{background:#0B1522;color:#fff;border-color:#2B3F60}
.ed-panel .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.ed-panel .btn.primary{background:#3CC4B8;border-color:#3CC4B8;color:#06201E}
.ed-panel .notice{background:#172A46;color:#E8EDF5}
.ed-panel .notice.warn{background:#3A2A12}
.ed-panel .notice.danger{background:#3D1C1B}
.ed-panel .notice.ok{background:#123326}
.ed-panel .check{color:#fff}
.ed-hint{font-size:13px;color:#AFBACB}
.ed-lines{display:grid;gap:6px}
.ed-line{display:flex;gap:8px;align-items:center;background:#0B1522;border:1px solid #22375A;border-radius:10px;padding:8px 10px}
.ed-line .v{font-weight:700;font-variant-numeric:tabular-nums;color:#3CC4B8;white-space:nowrap}
.ed-line .n{flex:1;min-width:0;font-size:13px}
.ed-line select{min-height:36px;padding:6px 8px;font-size:13px}

/* ---------- report ---------- */
.report{background:#fff;color:#0E1B2C;border-radius:var(--r);padding:22px;border:1px solid var(--line);display:grid;gap:14px;font-size:13.5px}
.rep-head{display:grid;gap:14px;border-bottom:2px solid #0E1B2C;padding-bottom:14px}
.rep-brand{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:#A98236}
.report h1{font-size:30px;color:#0E1B2C}
.report h3{color:#4A586C;margin-top:6px}
.rep-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:0}
.rep-meta dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7A8698;font-weight:600}
.rep-meta dd{margin:2px 0 0;font-weight:600}
.rep-summary{font-weight:600;color:#1F8A84}
.rep-scroll{overflow-x:auto}
.rep-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rep-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#4A586C;border-bottom:1.5px solid #0E1B2C;padding:7px 6px;white-space:nowrap}
.rep-table td{border-bottom:1px solid #E3DDD1;padding:7px 6px;vertical-align:top}
.rep-table .num{text-align:right;white-space:nowrap}
.rep-table tr.flag td{background:#FDF3E0}
.rep-flag{color:#9A6212;font-size:11px;display:block}
.rep-note{font-size:12px;color:#7A8698}
.rep-legend,.rep-foot{font-size:12px;color:#4A586C}
.rep-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.rep-photos figure{margin:0}
.rep-photos img{width:100%;border-radius:8px;border:1px solid #E3DDD1}
.rep-photos figcaption{font-size:12px;color:#4A586C}

/* lock screen */
.lock{position:fixed;inset:0;z-index:200;background:var(--navy);color:var(--ivory);display:grid;place-items:center;padding:24px}
.lock form{display:grid;gap:14px;width:min(320px,100%);text-align:center;justify-items:center}
.lock input{text-align:center;font-size:24px;letter-spacing:.3em}

.offline-banner{background:var(--warn-soft);color:var(--ink);padding:10px 14px;border-radius:var(--r-sm);font-size:13.5px;display:flex;gap:8px;align-items:flex-start}

/* ---------- print ---------- */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .sidebar,.topbar,.bottomnav,.no-print,.toast,.page-head .btn-row{display:none!important}
  .app{display:block}
  main.content{padding:0;max-width:none}
  .report{border:0;padding:0;border-radius:0}
  .rep-table tr{break-inside:avoid}
  .rep-photos figure{break-inside:avoid}
}

body:has(.editor) .toast,body:has(.cam) .toast{bottom:auto;top:calc(70px + env(safe-area-inset-top,0px))}

</style>

<script>/* src/core/i18n.js */
/* StitchMeasure AI — text system.
 * English text is the lookup key, so a translation file only has to map
 * English phrases to the target language. The measurement engine never
 * depends on display text; it uses stable measurement ids.
 * Add a language: SM.i18n.add("kn", { "Customers": "ಗ್ರಾಹಕರು", ... })
 */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});
  const dicts = { en: {} };
  let lang = "en";
  SM.i18n = {
    add(code, map) { dicts[code] = Object.assign(dicts[code] || {}, map); },
    set(code) { lang = dicts[code] ? code : "en"; },
    get lang() { return lang; },
    languages() { return Object.keys(dicts); },
    /* catalog text can be overridden per id: SM.i18n.add("kn", {"m:chest:name": "..."}) */
    catalog(id, field, fallback) {
      const d = dicts[lang] || {};
      return d["m:" + id + ":" + field] || fallback;
    }
  };
  /* t("Hello {name}", {name:"Asha"}) */
  SM.t = function (key, vars) {
    let s = (dicts[lang] && dicts[lang][key]) || key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
    return s;
  };
})(typeof window !== "undefined" ? window : globalThis);

<script>/* src/core/util.js */
/* Shared helpers (pure where possible, so tests can load them in Node). */

  U.uid = (p) => (p || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  U.pad = (n, l) => String(n).padStart(l || 2, "0");

    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });

  U.bytes = (n) => (n == null ? "–" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : n < 1073741824 ? (n / 1048576).toFixed(1) + " MB" : (n / 1073741824).toFixed(2) + " GB");
  U.safeName = (s) => String(s || "file").replace(/[^\w.-]+/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "") || "file";
  U.csvCell = (v) => { const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

  if (typeof document === "undefined") return;

  U.$ = (sel, ctx) => (ctx || document).querySelector(sel);
  U.$$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));

  /* toast: short status line, never used to claim something that did not happen */
  let toastTimer;
  U.toast = function (msg, kind) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.className = "toast " + (kind || ""); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200);
  };

  /* modal sheet. Returns {el, close}. content is HTML string. */
  U.sheet = function (opts) {
    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = `<div class="sheet ${opts.wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${U.esc(opts.title || "")}">
      <header class="sheet-head"><h2>${U.esc(opts.title || "")}</h2><button class="icon-btn" data-close aria-label="${SM.t("Close")}">${SM.icon("x")}</button></header>
      <div class="sheet-body">${opts.html || ""}</div></div>`;
    document.body.appendChild(wrap);
    document.body.classList.add("no-scroll");
    const close = () => { wrap.remove(); if (!document.querySelector(".sheet-wrap")) document.body.classList.remove("no-scroll"); opts.onClose && opts.onClose(); };
    wrap.addEventListener("click", (e) => { if (e.target === wrap || e.target.closest("[data-close]")) close(); });
    wrap.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    setTimeout(() => { const f = wrap.querySelector("input,select,textarea,button:not([data-close])"); f && f.focus({ preventScroll: true }); }, 30);
    return { el: wrap.querySelector(".sheet-body"), root: wrap, close };
  };

  /* in-page confirmation (browsers' confirm() is avoided for consistent styling) */
  U.confirm = function (opts) {
    return new Promise((resolve) => {
      const s = U.sheet({
        title: opts.title || SM.t("Please confirm"),
        html: `<p class="lead">${U.esc(opts.message || "")}</p>
          <div class="btn-row end"><button class="btn ghost" data-no>${U.esc(opts.cancel || SM.t("Cancel"))}</button>
          <button class="btn ${opts.danger ? "danger" : "primary"}" data-yes>${U.esc(opts.ok || SM.t("Confirm"))}</button></div>`,
        onClose: () => resolve(false)
      });
      s.el.querySelector("[data-no]").onclick = () => s.close();
      s.el.querySelector("[data-yes]").onclick = () => { s.root.remove(); document.body.classList.remove("no-scroll"); resolve(true); };
    });
  };

  U.prompt = function (opts) {
    return new Promise((resolve) => {
      let done = false;
      const s = U.sheet({
        title: opts.title,
        html: `<form class="stack" data-f><label class="field"><span>${U.esc(opts.label || "")}</span>
          <input type="${opts.type || "text"}" value="${U.esc(opts.value || "")}" ${opts.type === "number" ? 'step="any" inputmode="decimal"' : ""} required></label>
          <div class="btn-row end"><button type="button" class="btn ghost" data-close>${SM.t("Cancel")}</button><button class="btn primary">${U.esc(opts.ok || SM.t("Save"))}</button></div></form>`,
        onClose: () => { if (!done) resolve(null); }
      });
      s.el.querySelector("[data-f]").onsubmit = (e) => { e.preventDefault(); done = true; const v = s.el.querySelector("input").value; s.close(); resolve(v); };
    });
  };

  U.readFileAsText = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(file); });
  U.blobToDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
  U.dataURLToBlob = (url) => { const [h, b] = url.split(","); const mime = (h.match(/data:([^;]+)/) || [])[1] || "application/octet-stream"; const bin = atob(b); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); };
  U.loadImage = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Image could not be decoded")); i.src = src; });
  U.blobToImage = async (blob) => { const url = URL.createObjectURL(blob); try { return await U.loadImage(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); } };
  U.canvasToBlob = (c, type, q) => new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("Could not encode image"))), type || "image/jpeg", q == null ? 0.9 : q));
})(typeof window !== "undefined" ? window : globalThis);

<script>/* src/storage/db.js */
/* Offline storage service (IndexedDB).
 * Stores: customers, sessions, photos (with image Blobs), templates (custom),
 *         calibrations (history), settings (key/value), activity (log).
 * Falls back to an in-memory store if IndexedDB is blocked, and reports it. */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});
  const NAME = "stitchmeasure-ai", VERSION = 1;
  const STORES = {
    customers: { keyPath: "id", indexes: ["updatedAt"] },
    sessions: { keyPath: "id", indexes: ["customerId", "updatedAt"] },
    photos: { keyPath: "id", indexes: ["customerId", "sessionId", "createdAt"] },
    templates: { keyPath: "id", indexes: [] },
    calibrations: { keyPath: "id", indexes: ["photoId"] },
    settings: { keyPath: "key", indexes: [] },
    activity: { keyPath: "id", indexes: ["at"] }
  };
  let dbp = null, memory = null;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve) => {
      if (!root.indexedDB) { memory = {}; return resolve(null); }
      let req;
      try { req = indexedDB.open(NAME, VERSION); } catch (e) { memory = {}; return resolve(null); }
      req.onupgradeneeded = () => {
        const db = req.result;
        Object.entries(STORES).forEach(([name, def]) => {
          if (db.objectStoreNames.contains(name)) return;
          const s = db.createObjectStore(name, { keyPath: def.keyPath });
          def.indexes.forEach((i) => s.createIndex(i, i));
        });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { memory = {}; resolve(null); };
      req.onblocked = () => { /* another tab holds an old version */ };
    });
    return dbp;
  }
  const mem = (store) => (memory[store] = memory[store] || new Map());
  const key = (store, obj) => obj[STORES[store].keyPath];

  async function tx(store, mode, fn) {
    const db = await open();
    if (!db) return fn(null);
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode), s = t.objectStore(store);
      let result;
      Promise.resolve(fn(s)).then((r) => (result = r));
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error("Storage transaction aborted (the device may be out of space)."));
    });
  }
  const req2p = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

  const api = {
    get inMemory() { return !!memory; },
    open,
    async get(store, id) {
      await open(); if (memory) return mem(store).get(id) || null;
      return tx(store, "readonly", (s) => req2p(s.get(id))).then((r) => r || null);
    },
    async put(store, obj) {
      await open(); if (memory) { mem(store).set(key(store, obj), obj); return obj; }
      await tx(store, "readwrite", (s) => { s.put(obj); });
      return obj;
    },
    async putMany(store, list) {
      await open(); if (memory) { list.forEach((o) => mem(store).set(key(store, o), o)); return; }
      await tx(store, "readwrite", (s) => { list.forEach((o) => s.put(o)); });
    },
    async del(store, id) {
      await open(); if (memory) { mem(store).delete(id); return; }
      await tx(store, "readwrite", (s) => { s.delete(id); });
    },
    async all(store) {
      await open(); if (memory) return Array.from(mem(store).values());
      return tx(store, "readonly", (s) => req2p(s.getAll()));
    },
    async where(store, index, value) {
      await open(); if (memory) return Array.from(mem(store).values()).filter((o) => o[index] === value);
      return tx(store, "readonly", (s) => req2p(s.index(index).getAll(value)));
    },
    async clear(store) {
      await open(); if (memory) { mem(store).clear(); return; }
      await tx(store, "readwrite", (s) => { s.clear(); });
    },
    async clearAll() { for (const s of Object.keys(STORES)) await api.clear(s); },
    async setting(k, fallback) { const r = await api.get("settings", k); return r ? r.value : fallback; },
    async setSetting(k, v) { return api.put("settings", { key: k, value: v }); },
    async log(text, ref) {
      const a = { id: "act_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), at: new Date().toISOString(), text, ref: ref || null };
      await api.put("activity", a);
      return a;
    },
    async estimate() {
      try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) {}
      return null;
    },
    async persist() {
      try { if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist(); } catch (e) {}
      return false;
    },
    async persisted() {
      try { if (navigator.storage && navigator.storage.persisted) return await navigator.storage.persisted(); } catch (e) {}
      return false;
    },
    STORES: Object.keys(STORES)
  };
  SM.db = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* src/storage/backup.js */
/* Backup, restore, profile export/import. Optional AES-GCM encryption with a
 * password (PBKDF2, 250k iterations). Files are versioned JSON. */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});
  const VERSION = "1.0.0";

  async function photoOut(p, withImages) {
    const o = Object.assign({}, p);
    delete o.blob; delete o.thumb;
    if (withImages && p.blob) o.imageDataURL = await SM.util.blobToDataURL(p.blob);
    if (withImages && p.thumb) o.thumbDataURL = await SM.util.blobToDataURL(p.thumb);
    return o;
  }
  function photoIn(o) {
    const p = Object.assign({}, o);
    if (o.imageDataURL) p.blob = SM.util.dataURLToBlob(o.imageDataURL);
    if (o.thumbDataURL) p.thumb = SM.util.dataURLToBlob(o.thumbDataURL);
    delete p.imageDataURL; delete p.thumbDataURL;
    return p;
  }

  async function build(opts) {
    opts = opts || {};
    const only = opts.customerId;
    const customers = only ? [await SM.db.get("customers", only)].filter(Boolean) : await SM.db.all("customers");
    const ids = new Set(customers.map((c) => c.id));
    const sessions = (await SM.db.all("sessions")).filter((s) => ids.has(s.customerId));
    const photosRaw = opts.includePhotos === false ? [] : (await SM.db.all("photos")).filter((p) => ids.has(p.customerId));
    const photos = [];
    for (const p of photosRaw) photos.push(await photoOut(p, true));
    const data = {
      schema: only ? "stitchmeasure.profile/1" : "stitchmeasure.backup/1",
      app: "StitchMeasure AI", appVersion: VERSION, createdAt: new Date().toISOString(),
      customers, sessions, photos
    };
    if (!only) {
      data.templates = await SM.db.all("templates");
      data.calibrations = await SM.db.all("calibrations");
      data.settings = (await SM.db.all("settings")).filter((s) => s.key !== "pinHash");
    }
    return data;
  }

  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = (buf) => { let s = ""; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function keyFrom(password, salt) {
    const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function encrypt(obj, password) {
    if (!(root.crypto && crypto.subtle)) throw new Error("Encryption needs a secure context (HTTPS or localhost).");
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await keyFrom(password, salt);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
    return { schema: "stitchmeasure.encrypted/1", kdf: "PBKDF2-SHA256-250000", cipher: "AES-GCM-256", salt: b64(salt), iv: b64(iv), data: b64(ct) };
  }
  async function decrypt(wrap, password) {
    if (!(root.crypto && crypto.subtle)) throw new Error("Decryption needs a secure context (HTTPS or localhost).");
    const key = await keyFrom(password, unb64(wrap.salt));
    try {

<script>/* src/settings/settings.js */
/* App settings (stored in IndexedDB 'settings'). */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});
  const DEFAULTS = {
    unit: "cm", theme: "system", language: "en", designer: "", keepPhotos: true,
    tolerance: { fitted: 0.5, semi: 1.0, loose: 1.5 }, seamAllowanceCm: 1.5,
    countdown: 3, gridDensity: 8, gridOpacity: 0.5, overlayOpacity: 0.7, mirrorFront: true,
    privacyAccepted: false, cameraConsent: false, lastBackupAt: null, pinEnabled: false
  };
  const S = {
    values: JSON.parse(JSON.stringify(DEFAULTS)),
    async load() {
      const rows = await SM.db.all("settings");
      rows.forEach((r) => { if (r.key in DEFAULTS) S.values[r.key] = r.value; });
      S.applyTheme();
      return S.values;
    },
    async set(k, v) { S.values[k] = v; await SM.db.setSetting(k, v); if (k === "theme") S.applyTheme(); },
    applyTheme() {
      const t = S.values.theme;
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      else document.documentElement.removeAttribute("data-theme");
      const meta = document.querySelector('meta[name="theme-color"]');
      const dark = t === "dark" || (t === "system" && root.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      if (meta) meta.setAttribute("content", dark ? "#0B1522" : "#0E1B2C");
    },
    /* simple app lock: SHA-256 of salt+PIN. Deters casual access only. */
    async hashPin(pin) {
      const data = new TextEncoder().encode("stitchmeasure:" + pin);
      if (root.crypto && crypto.subtle) { const h = await crypto.subtle.digest("SHA-256", data); return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, "0")).join(""); }
      let h = 0; for (const b of data) h = (h * 31 + b) >>> 0; return "weak:" + h.toString(16);
    },
    async setPin(pin) { await SM.db.setSetting("pinHash", pin ? await S.hashPin(pin) : null); await S.set("pinEnabled", !!pin); },
    async checkPin(pin) { const h = await SM.db.setting("pinHash", null); return !!h && h === (await S.hashPin(pin)); },
    DEFAULTS
  };
  SM.settings = S;
})(typeof window !== "undefined" ? window : globalThis);

</script>

<script>/* src/measurement-engine/engine.js */
/* Measurement engine: units, readings, statuses, tolerances, allowances,
 * comparison. Pure functions: no DOM, no storage, testable in Node.
 * All lengths are stored in centimetres; angles in degrees. */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});

  const UNITS = { cm: { label: "cm", per: 1, dp: 1 }, mm: { label: "mm", per: 10, dp: 0 }, in: { label: "in", per: 1 / 2.54, dp: 2 } };

  const METHODS = {
    manual: "Manual measurement",
    camera: "Calibrated camera measurement",
    ai: "Experimental AI estimate",
    unavailable: "Unavailable"
  };
  const STATUS = {
    not_started: "Not started",
    captured: "Captured",
    estimated: "Estimated",
    requires_verification: "Requires verification",
    verified: "Verified",
    rejected: "Rejected"
  };
  const DEFAULT_TOL = { fitted: 0.5, semi: 1.0, loose: 1.5 }; // cm spread allowed between repeat readings

  const E = (SM.engine = { UNITS, METHODS, STATUS, DEFAULT_TOL, SCHEMA_SESSION: "stitchmeasure.session/1" });

  E.isAngle = (id) => { const e = SM.catalog && SM.catalog.get(id); return !!(e && e.kind === "angle"); };

  /* unit conversion */
  E.toUnit = (cm, unit) => cm * (UNITS[unit] || UNITS.cm).per;
  E.fromUnit = (v, unit) => v / (UNITS[unit] || UNITS.cm).per;
  E.format = (cm, unit, id) => {
    if (cm == null || !isFinite(cm)) return "–";
    if (id && E.isAngle(id)) return (+cm).toFixed(1) + "°";
    const u = UNITS[unit] || UNITS.cm;
    return (cm * u.per).toFixed(u.dp);
  };
  E.unitLabel = (unit, id) => (id && E.isAngle(id) ? "°" : (UNITS[unit] || UNITS.cm).label);
  /* parse user input in display unit → stored value (cm or degrees) */
  E.parse = (text, unit, id) => {
    const v = parseFloat(String(text).replace(",", "."));
    if (!isFinite(v) || v <= 0) return null;
    return id && E.isAngle(id) ? v : E.fromUnit(v, unit);
  };

  E.newItem = () => ({ readings: [], value: null, method: null, status: "not_started", verified: null, rejected: null, ease: null, design: null, note: "" });

  const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
  E.spread = (item) => {
    const r = (item.readings || []).map((x) => x.v);
    return r.length > 1 ? Math.max.apply(null, r) - Math.min.apply(null, r) : 0;
  };
  E.inconsistent = (item, tolCm) => (item.readings || []).length > 1 && E.spread(item) > tolCm + 1e-9;

  /* derived status — the single source of truth for status display */
  E.status = (item, entry) => {
    if (!item || item.value == null) return item && item.rejected ? "rejected" : "not_started";
    if (item.rejected) return "rejected";
    if (item.verified) return "verified";
    if (item.method === "unavailable") return "not_started";
    if (item.method === "ai") return "estimated";
    if (item.method === "camera") return entry && !entry.critical ? "captured" : "requires_verification";
    return "captured";
  };
  E.classification = (item) => {
    if (!item || item.value == null) return item && item.method === "unavailable" ? METHODS.unavailable : "—";
    if (item.verified) return "Professionally verified";
    return METHODS[item.method] || METHODS.manual;
  };
  /* needs a tape check before it can be used for cutting */
  E.needsVerification = (item, entry) => {
    const s = E.status(item, entry);
    if (s === "requires_verification" || s === "estimated") return true;
    if (s === "captured" && item.method !== "manual" && entry && entry.critical) return true;
    return false;
  };

  /* add one reading. Refuses to touch a verified value unless force=true. */
  E.addReading = (item, valueCm, method, opts) => {
    opts = opts || {};
    if (item.verified && !opts.force) return { ok: false, reason: "verified" };
    if (!(valueCm > 0)) return { ok: false, reason: "invalid" };
    if (item.verified && opts.force) item.verified = null;
    item.rejected = null;
    item.readings.push({ v: +valueCm, method: method || "manual", at: opts.at || new Date().toISOString(), by: opts.by || "", photoId: opts.photoId || null });
    const sameMethod = item.readings.filter((r) => r.method === (method || "manual"));
    item.method = method || "manual";
    item.value = Math.round(mean(sameMethod.map((r) => r.v)) * 10) / 10;
    return { ok: true };
  };
  /* replace all readings with a single value */
  E.setValue = (item, valueCm, method, opts) => {
    opts = opts || {};
    if (item.verified && !opts.force) return { ok: false, reason: "verified" };
    item.readings = [];
    item.verified = null;
    return E.addReading(item, valueCm, method, opts);
  };
  E.removeReading = (item, idx, opts) => {
    if (item.verified && !(opts && opts.force)) return { ok: false, reason: "verified" };
    item.readings.splice(idx, 1);
    if (!item.readings.length) { item.value = null; item.method = null; item.verified = null; }
    else { const m = item.readings[item.readings.length - 1].method; item.method = m; item.value = Math.round(mean(item.readings.filter((r) => r.method === m).map((r) => r.v)) * 10) / 10; }
    return { ok: true };
  };
  E.verify = (item, by) => {
    if (item.value == null) return { ok: false, reason: "empty" };
    item.verified = { by: by || "", at: new Date().toISOString() }; item.rejected = null;
    return { ok: true };
  };
  E.unverify = (item) => { item.verified = null; return { ok: true }; };
  E.reject = (item, reason) => { item.rejected = { reason: reason || "", at: new Date().toISOString() }; item.verified = null; return { ok: true }; };

  /* finished garment measurement = body + ease + design allowance.
   * Seam allowance is NOT added: it belongs to the pattern, not the finished size. */
  E.finished = (item) => {
    if (!item || item.value == null) return null;
    if (item.ease == null && item.design == null) return null;
    return Math.round((item.value + (item.ease || 0) + (item.design || 0)) * 10) / 10;
  };

  E.summary = (session, ids) => {
    const items = (session && session.items) || {};
    let done = 0, verify = 0, verified = 0;
    ids.forEach((id) => {
      const it = items[id]; if (!it || it.value == null) return;
      done++;
      const entry = SM.catalog && SM.catalog.get(id);
      if (it.verified) verified++; else if (E.needsVerification(it, entry)) verify++;
    });
    return { total: ids.length, done, verify, verified, complete: ids.length > 0 && done === ids.length };
  };

  E.compare = (a, b, ids) => ids.map((id) => {
    const x = a.items[id], y = b.items[id];
    const va = x && x.value != null ? x.value : null, vb = y && y.value != null ? y.value : null;
    return { id, a: va, b: vb, diff: va != null && vb != null ? Math.round((vb - va) * 10) / 10 : null };
  });

  E.newSession = (customerId, templateId, by) => ({
    schema: E.SCHEMA_SESSION, id: "ses_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    customerId, templateId, date: new Date().toISOString().slice(0, 10), designer: by || "",
    remarks: "", seamAllowanceCm: null, items: {}, customDefs: [], order: null,
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* src/calibration/calibration.js */
/* Calibration service. Converts photo pixels to millimetres only when a
 * physical reference has been marked and passes validation. Pure functions.
 *
 * Methods
 *  marker  – printed square marker of known size (default 100 mm), both edges marked
 *  a4      – A4 sheet 210 × 297 mm; long edge required, short edge recommended
 *  known   – any straight object of known length (ruler, tape held flat)
 *  height  – the person's verified standing height (top of head to floor);
 *            only valid for lines close to vertical
 *  depth   – device depth sensing: not available to web browsers (future native app)
 *
 * A calibration only describes the plane where the reference was held.
 * Anything far in front of or behind that plane will be off; the UI says so.
 */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});

  const A4 = { long: 297, short: 210 };
  const MIN_PX = 60;          // reference shorter than this in the image is rejected
  const SHAPE_TOL = 0.05;     // 5 % deviation from the expected aspect ratio
  const RIGHT_ANGLE_TOL = 10; // degrees
  const VERTICAL_TOL = 8;     // degrees off vertical for the height line
  const HEIGHT_SCOPE = 20;    // degrees: lines this close to vertical may use a height calibration

  const len = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
  const angleDeg = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  const offVertical = (a, b) => { const ang = Math.abs(angleDeg(a, b)) % 180; return Math.abs(90 - ang); };
  const between = (a1, a2, b1, b2) => {
    const u = { x: a2.x - a1.x, y: a2.y - a1.y }, v = { x: b2.x - b1.x, y: b2.y - b1.y };
    const c = (u.x * v.x + u.y * v.y) / (Math.hypot(u.x, u.y) * Math.hypot(v.x, v.y));
    return Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
  };

  const METHODS = {
    marker: { name: "Printed calibration marker", needs: ["edge1", "edge2"], hint: "Print the marker at 100 % scale, hold it flat against the body at the level you will measure, then mark two adjacent edges." },
    a4: { name: "A4 reference sheet", needs: ["edge1", "edge2?"], hint: "Hold a flat A4 sheet (210 × 297 mm) against the body at measurement level, facing the camera. Mark the long edge, then the short edge." },
    known: { name: "Known-length object", needs: ["edge1"], hint: "Hold a ruler or rigid object of known length flat against the body, parallel to the camera, and mark its two ends." },
    height: { name: "Known standing height", needs: ["edge1"], hint: "Full-body photo only. Mark the top of the head and the floor at the heels. Supports near-vertical lengths only." },
    depth: { name: "Device depth sensing", needs: [], hint: "Requires a native app with depth hardware access. Not available in this web version." }
  };

  /* input: { method, edge1:[p,p], edge2:[p,p]|null, knownMm, heightCm, markerMm, confirmed }
   * output: { valid, method, mmPerPx, scope:'plane'|'vertical', errors[], warnings[], at } */
  function calibrate(inp) {
    const out = { valid: false, method: inp.method, mmPerPx: null, scope: "plane", errors: [], warnings: [], at: new Date().toISOString() };
    const e1 = inp.edge1, e2 = inp.edge2;
    if (inp.method === "depth") { out.errors.push("Depth sensing is not available to web browsers. Use a marker, an A4 sheet, a known-length object or the person's height."); return out; }
    if (!METHODS[inp.method]) { out.errors.push("Choose a calibration method."); return out; }
    if (!e1 || !e1[0] || !e1[1]) { out.errors.push("Mark both ends of the reference on the photo."); return out; }
    const l1 = len(e1[0], e1[1]);
    if (l1 < MIN_PX) { out.errors.push(`The reference is only ${Math.round(l1)} px long in the photo. Move closer or use a larger reference (needs at least ${MIN_PX} px).`); return out; }

    if (inp.method === "marker" || inp.method === "a4") {
      if (!inp.confirmed) { out.errors.push(inp.method === "a4" ? "Confirm the sheet is a genuine A4 sheet (210 × 297 mm), held flat." : "Confirm the marker was printed at actual size (100 %, no 'fit to page')."); return out; }
    }

    if (inp.method === "marker") {
      const size = +inp.markerMm || 100;
      if (!e2 || !e2[0] || !e2[1]) { out.errors.push("Mark the second edge of the marker so its shape can be checked."); return out; }
      const l2 = len(e2[0], e2[1]);
      const ratio = l1 / l2, dev = Math.abs(ratio - 1);
      if (dev > SHAPE_TOL) { out.errors.push(`The marker looks ${Math.round(dev * 100)} % out of square. It is tilted or not flat. Face it straight to the camera and retake.`); return out; }
      const ang = between(e1[0], e1[1], e2[0], e2[1]);
      if (Math.abs(ang - 90) > RIGHT_ANGLE_TOL) { out.errors.push(`The two marked edges meet at ${Math.round(ang)}°, not about 90°. Mark two adjacent edges, or retake with the marker facing the camera.`); return out; }
      out.mmPerPx = (size / l1 + size / l2) / 2;
    } else if (inp.method === "a4") {
      if (e2 && e2[0] && e2[1]) {
        const l2 = len(e2[0], e2[1]);
        const ratio = l1 / l2, expect = A4.long / A4.short, dev = Math.abs(ratio - expect) / expect;
        if (dev > SHAPE_TOL) { out.errors.push(`The sheet's shape is ${Math.round(dev * 100)} % off from A4. Check you marked the long edge first, hold the sheet flat facing the camera, and retake.`); return out; }
        const ang = between(e1[0], e1[1], e2[0], e2[1]);
        if (Math.abs(ang - 90) > RIGHT_ANGLE_TOL) { out.errors.push(`The edges meet at ${Math.round(ang)}°, not about 90°. The sheet is tilted. Retake facing the camera.`); return out; }
        out.mmPerPx = (A4.long / l1 + A4.short / l2) / 2;
      } else {
        out.mmPerPx = A4.long / l1;
        out.warnings.push("Only the long edge is marked, so tilt cannot be checked. Mark the short edge too for a safer calibration.");
      }
    } else if (inp.method === "known") {
      const k = +inp.knownMm;
      if (!(k > 0)) { out.errors.push("Enter the reference object's real length."); return out; }
      if (k < 100) out.warnings.push("References shorter than 10 cm magnify marking errors. A 30 cm ruler or longer is better.");
      out.mmPerPx = k / l1;
      out.warnings.push("Tilt cannot be checked with a single edge. Keep the object flat and parallel to the camera.");
    } else if (inp.method === "height") {
      const h = +inp.heightCm;
      if (!(h > 30 && h < 260)) { out.errors.push("Enter the person's verified standing height first."); return out; }

<script>/* src/reference-images/figure.js */

  // side profile [y, front, back]
  const SIDE = [[0.115, 0.025, -0.03], [0.15, 0.03, -0.035], [0.17, 0.05, -0.045], [0.23, 0.07, -0.055], [0.27, 0.078, -0.058], [0.31, 0.066, -0.055], [0.38, 0.055, -0.05], [0.43, 0.065, -0.052], [0.49, 0.06, -0.082], [0.53, 0.058, -0.075], [0.56, 0.055, -0.052], [0.62, 0.05, -0.046], [0.715, 0.035, -0.033], [0.8, 0.03, -0.05], [0.88, 0.025, -0.03], [0.94, 0.02, -0.022], [0.97, 0.03, -0.03], [0.985, 0.09, -0.035], [1, 0.095, -0.035]];

<script>/* src/overlays/overlays.js */
/* Overlay layers for the live camera and for exported photos.
 * Grid (canvas) and body outline (SVG) are separate layers.
 * Grid squares are positioning references only; they are never labelled in
 * centimetres because the camera has no scale until a photo is calibrated. */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});

  const VIEWS = {
    front: { name: "Front", fig: { view: "front", arms: "a" } },
    back: { name: "Back", fig: { view: "back", arms: "a" } },
    left: { name: "Left side", fig: { view: "side", arms: "down", flip: true } },
    right: { name: "Right side", fig: { view: "side", arms: "down" } },
    upper: { name: "Upper body", fig: { view: "front", arms: "a", crop: "upper" } },
    lower: { name: "Lower body", fig: { view: "front", arms: "a", crop: "lower" } },
    sleeve: { name: "Arm & sleeve", fig: { view: "front", arms: "a", sleeve: true } },
    extended: { name: "Arms extended", fig: { view: "front", arms: "t" } }

  const STYLE = `<style>
    .fig-outline{fill:rgba(255,255,255,.06);stroke:#ffffff;stroke-width:1.6;stroke-linejoin:round}
    .fig-arm{fill:rgba(255,255,255,.04)}

    .ov-limit{stroke:#D8B76A;stroke-width:1.4;stroke-dasharray:6 3}
    .ov-marker{stroke:#3CC4B8;stroke-width:1.2}
    .ov-label{fill:#ffffff;font:600 7.5px system-ui,sans-serif;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:2px}
    .ov-foot{fill:rgba(216,183,106,.18);stroke:#D8B76A;stroke-width:1.2}

  function outlineSVG(viewKey, age) {
    const v = VIEWS[viewKey] || VIEWS.front;
    const o = Object.assign({ age: age || "adult", mode: "outline", markers: true, cls: "ov" }, v.fig);

    for (let y = cell; y < h - 0.5; y += cell) { g.moveTo(0, Math.round(y) + 0.5); g.lineTo(w, Math.round(y) + 0.5); }

<script>/* src/camera/camera.js */
/* Camera Service: getUserMedia wrapper with camera switching, torch, zoom,
 * capture and simple frame checks (brightness and movement).
 * Requires a secure context (HTTPS or localhost). */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});
  let stream = null, track = null, facing = "environment", devices = [];

  function support() {
    if (!root.isSecureContext) return { ok: false, reason: "The camera needs a secure address (https:// or localhost). This page is opened from " + location.protocol + "//. You can still import photos and enter measurements." };
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return { ok: false, reason: "This browser does not allow camera access. Import photos instead, or enter measurements manually." };
    return { ok: true };
  }

  async function listCameras() {
    try { devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput"); } catch (e) { devices = []; }
    return devices;
  }

  function explain(err) {
    const n = err && err.name;
    if (n === "NotAllowedError" || n === "SecurityError") return "Camera permission was denied. Allow camera access for this site in the browser settings, then try again. You can still import photos.";
    if (n === "NotFoundError" || n === "OverconstrainedError") return "No suitable camera was found on this device. Import a photo instead.";
    if (n === "NotReadableError") return "The camera is being used by another app. Close it and try again.";
    return "The camera could not start (" + (err && err.message ? err.message : n || "unknown error") + ").";
  }

  async function start(video, opts) {
    opts = opts || {};
    const s = support(); if (!s.ok) throw new Error(s.reason);
    stop();
    if (opts.facing) facing = opts.facing;
    const base = { width: { ideal: 1920 }, height: { ideal: 1080 } };
    const tries = [
      { video: Object.assign({ facingMode: { ideal: facing } }, base), audio: false },
      { video: { facingMode: facing }, audio: false },
      { video: true, audio: false }
    ];
    let lastErr;
    for (const c of tries) {
      try { stream = await navigator.mediaDevices.getUserMedia(c); break; } catch (e) { lastErr = e; if (e.name === "NotAllowedError" || e.name === "SecurityError") break; }
    }
    if (!stream) throw new Error(explain(lastErr));
    track = stream.getVideoTracks()[0];
    video.srcObject = stream;
    video.setAttribute("playsinline", ""); video.muted = true;
    try { await video.play(); } catch (e) { /* autoplay blocked: the user can tap */ }
    await new Promise((r) => { if (video.videoWidth) return r(); video.onloadedmetadata = () => r(); setTimeout(r, 2500); });
    const settings = track.getSettings ? track.getSettings() : {};
    if (settings.facingMode) facing = settings.facingMode;
    await listCameras();
    return info(video);
  }

  function info(video) {
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    const settings = track && track.getSettings ? track.getSettings() : {};
    return {
      width: video ? video.videoWidth : settings.width, height: video ? video.videoHeight : settings.height,
      facing, label: track ? track.label : "",
      torch: !!caps.torch, zoom: caps.zoom ? { min: caps.zoom.min, max: caps.zoom.max, step: caps.zoom.step || 0.1, value: settings.zoom || caps.zoom.min } : null,
      cameras: devices.length

  }

  function stop() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; track = null;
  }
  async function flip(video) { facing = facing === "environment" ? "user" : "environment"; return start(video, { facing }); }
  async function setTorch(on) { if (!track) return false; try { await track.applyConstraints({ advanced: [{ torch: !!on }] }); return true; } catch (e) { return false; } }
  async function setZoom(z) { if (!track) return false; try { await track.applyConstraints({ advanced: [{ zoom: z }] }); return true; } catch (e) { return false; } }

  /* capture the current frame at full sensor resolution of the stream */
  function capture(video, mirror) {
    const w = video.videoWidth, h = video.videoHeight;

  }

  /* frame analysis for live guidance */
  const probe = document.createElement ? document.createElement("canvas") : null;
  let prev = null;
  function analyse(video) {
    if (!probe || !video.videoWidth) return null;
    const W = 48, H = Math.round(48 * video.videoHeight / video.videoWidth) || 64;

<script>/* src/pose-detection/pose.js */
/* Pose Detection Service — Phase 2 interface.
 *
 * Phase 1 ships WITHOUT an AI model, so this service reports itself as
 * unavailable and the app uses the manual alignment and landmark workflow.
 * Nothing in the app fabricates landmarks.
 *
 * To enable in Phase 2 (all files local, no CDN):
 *   public/local-models/vision_bundle.js        (MediaPipe Tasks Vision, UMD/IIFE build)
 *   public/local-models/wasm/                   (vision_wasm_internal.js / .wasm)
 *   public/local-models/pose_landmarker_lite.task
 * then implement detect() below and add the files to service-worker.js.
 * See docs/android-ios-integration.md and docs/measurement-validation.md.
 */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});
  const MODEL = "public/local-models/pose_landmarker_lite.task";

  let state = { checked: false, available: false, reason: "Not checked yet." };

  async function check() {
    if (state.checked) return state;
    state.checked = true;
    if (!root.FilesetResolver && !(root.vision && root.vision.FilesetResolver)) {
      state.available = false;
      state.reason = "No local pose model is installed in this version (Phase 2 feature). Use manual alignment and landmark placement.";
      return state;
    }
    try {
      const r = await fetch(MODEL, { method: "HEAD" });
      state.available = r.ok;
      state.reason = r.ok ? "Local pose model found (experimental)." : "Pose model file is missing from public/local-models.";
    } catch (e) {
      state.available = false; state.reason = "Pose model could not be read: " + e.message;
    }
    return state;
  }

  SM.pose = {
    check,
    get status() { return state; },
    /* Phase 2: returns [{name, x, y, visibility}] in image pixels, or throws.
     * Results must always be presented as "Experimental AI" and be editable. */
    async detect() { throw new Error(state.reason || "Pose detection is not available."); }
  };
})(typeof window !== "undefined" ? window : globalThis);

<script>/* src/photo-export/export.js */
/* Photo Storage & Export Service.
 * - Builds the four photo versions (original, with outline, with grid,
 *   with measurement lines) without altering the stored original.
 * - Saves via download, Web Share (files) or the File System Access API.
 * - A browser cannot insert into Gallery/Photos by itself; we never claim it did.
 */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});

  const VERSIONS = {
    original: "Original photo",
    outline: "With body outline",
    grid: "With measurement grid",
    lines: "With measurement lines & labels"
  };
  const VIEW_NAMES = { front: "Front", back: "Back", left: "LeftSide", right: "RightSide", upper: "UpperBody", lower: "LowerBody", sleeve: "Sleeve", extended: "ArmsExtended", measurement: "Measurement", other: "Photo" };

  /* geometry helpers for rotation (rot in degrees, clockwise) */
  function dims(w, h, rot) { return rot % 180 ? { w: h, h: w } : { w, h }; }
  function toView(p, w, h, rot) {
    switch (rot) { case 90: return { x: h - p.y, y: p.x }; case 180: return { x: w - p.x, y: h - p.y }; case 270: return { x: p.y, y: w - p.x }; default: return { x: p.x, y: p.y }; }
  }
  function fromView(p, w, h, rot) {
    switch (rot) { case 90: return { x: p.y, y: h - p.x }; case 180: return { x: w - p.x, y: h - p.y }; case 270: return { x: w - p.y, y: p.x }; default: return { x: p.x, y: p.y }; }
  }
  function drawRotated(g, img, w, h, rot) {
    g.save();
    if (rot === 90) { g.translate(h, 0); g.rotate(Math.PI / 2); }
    else if (rot === 180) { g.translate(w, h); g.rotate(Math.PI); }
    else if (rot === 270) { g.translate(0, w); g.rotate(-Math.PI / 2); }
    g.drawImage(img, 0, 0, w, h);
    g.restore();
  }

  /* draw annotations (in view coordinates) onto a 2D context. k = visual scale */
  function drawAnnotations(g, ann, w, h, rot, k, unit, opts) {
    opts = opts || {};
    if (!ann) return;
    const V = (p) => toView(p, w, h, rot);
    const fontPx = 13 * k;
    const label = (text, x, y, color) => {
      g.font = `600 ${fontPx}px "DM Sans", system-ui, sans-serif`;
      const tw = g.measureText(text).width, pad = 4 * k;
      g.fillStyle = "rgba(14,27,44,.82)"; g.fillRect(x - pad, y - fontPx - pad * 0.5, tw + pad * 2, fontPx + pad * 1.6);

      g.strokeStyle = color; g.lineWidth = 2.4 * k; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); g.restore();
      [a, b].forEach((p) => { g.beginPath(); g.arc(p.x, p.y, 5 * k, 0, 7); g.fillStyle = color; g.fill(); g.lineWidth = 1.5 * k; g.strokeStyle = "#0E1B2C"; g.stroke(); });
    };
    const cal = ann.cal;
    if (cal) {
      [cal.edge1, cal.edge2].forEach((e, i) => {
        if (!e || !e[0] || !e[1]) return;
        const a = V(e[0]), b = V(e[1]);
        seg(a, b, "#D8B76A", true);
        if (!opts.noLabels) label(i === 0 ? SM.t("Reference") : SM.t("Reference edge 2"), (a.x + b.x) / 2 + 8 * k, (a.y + b.y) / 2 - 8 * k, "#D8B76A");
      });
    }
    (ann.lines || []).forEach((ln) => {
      const a = V(ln.a), b = V(ln.b);
      seg(a, b, "#3CC4B8", false);
      if (opts.noLabels) return;
      const r = SM.calibration.measure(cal && cal.result, ln.a, ln.b);
      const val = r.mm != null ? SM.engine.format(r.mm / 10, unit || "cm") + " " + SM.engine.unitLabel(unit || "cm") : Math.round(r.px) + " px";
      const name = ln.measureId ? SM.catalog.name(ln.measureId) : (ln.label || SM.t("Line"));
      label(name + ": " + val, Math.min((a.x + b.x) / 2 + 10 * k, (rot % 180 ? h : w) - 200 * k), (a.y + b.y) / 2 - 10 * k);
    });

      const p = V(pt);
      g.beginPath(); g.arc(p.x, p.y, 7 * k, 0, 7); g.lineWidth = 3 * k; g.strokeStyle = "rgba(0,0,0,.6)"; g.stroke();
      g.lineWidth = 2 * k; g.strokeStyle = "#D8B76A"; g.stroke();
      g.beginPath(); g.arc(p.x, p.y, 1.8 * k, 0, 7); g.fillStyle = "#fff"; g.fill();

  async function render(photo, version, unit) {
    const img = await SM.util.blobToImage(photo.blob);
    const W = img.naturalWidth, Hh = img.naturalHeight;
    const ann = photo.ann || {};

    const g = c.getContext("2d");
    drawRotated(g, img, W, Hh, rot);

    if (version === "outline" || version === "all") {

    let part = VIEW_NAMES[photo.view] || "Photo";
    if (photo.measureId) part = SM.util.safeName(SM.catalog.name(photo.measureId).replace(/\s+/g, "")) + "_Measurement";

  async function toGallery(blob, name) {

<script>/* src/reports/reports.js */
/* Report Generation Service: measurement sheet as print-friendly HTML,
 * PDF (local jsPDF), CSV and JSON. All offline. Unverified camera values and
 * AI estimates are labelled in every format. */
(function (root) {
  "use strict";
  const SM = (root.SM = root.SM || {});
  const esc = (s) => SM.util.esc(s);

  /* gather everything a report needs */
  async function build(sessionId, opts) {
    opts = opts || {};
    const session = await SM.db.get("sessions", sessionId);
    if (!session) throw new Error("Measurement record not found.");
    const customer = await SM.db.get("customers", session.customerId);
    const template = await SM.app.resolveTemplate(session.templateId);
    const ids = SM.app.sessionIds(session, template);
    const unit = opts.unit || (customer && customer.unit) || SM.app.settings.unit || "cm";
    const rows = ids.map((id) => {
      const entry = SM.catalog.get(id);
      const cdef = (session.customDefs || []).find((d) => d.id === id);
      const it = session.items[id] || SM.engine.newItem();
      const label = (template && template.labels && template.labels[id]) || (cdef ? cdef.name : SM.catalog.name(id));
      return {
        id, name: label, kind: entry ? SM.catalog.KIND_LABEL[entry.kind] : "Custom",
        value: it.value, display: SM.engine.format(it.value, unit, id), unit: SM.engine.unitLabel(unit, id),
        source: SM.engine.classification(it), status: SM.engine.STATUS[SM.engine.status(it, entry)],
        needsTape: it.value != null && !it.verified && SM.engine.needsVerification(it, entry),
        readings: (it.readings || []).length,
        ease: it.ease, design: it.design, finished: SM.engine.finished(it),
        verifiedBy: it.verified ? it.verified.by : "", note: it.note || ""
      };
    });
    const history = (await SM.customers.sessions(session.customerId)).filter((s) => s.id !== session.id).slice(0, 4);
    const photos = (await SM.db.where("photos", "sessionId", session.id)).filter((p) => !opts.photoIds || opts.photoIds.includes(p.id));
    return { session, customer, template, rows, unit, history, photos, generatedAt: new Date().toISOString(), designer: session.designer || SM.app.settings.designer || "" };
  }

  function summaryLine(r) {
    const n = r.rows.filter((x) => x.value != null).length;
    const pending = r.rows.filter((x) => x.needsTape).length;
    return `${n} of ${r.rows.length} measurements recorded` + (pending ? ` · ${pending} need tape verification` : "");
  }

  /* HTML report (used on screen and for printing) */
  async function html(r, photoURLs) {
    const c = r.customer || {};
    const seam = r.session.seamAllowanceCm != null ? `${SM.engine.format(r.session.seamAllowanceCm, r.unit)} ${SM.engine.unitLabel(r.unit)}` : "Not set";
    const histIds = r.rows.slice(0, 8).map((x) => x.id);
    const histTable = r.history.length ? `<h3>Measurement history</h3><div class="rep-scroll"><table class="rep-table"><thead><tr><th>Measurement</th><th>This record</th>${r.history.map((h) => `<th>${esc(SM.util.fmtDate(h.date))}</th>`).join("")}</tr></thead><tbody>
      ${histIds.map((id) => { const row = r.rows.find((x) => x.id === id); return `<tr><td>${esc(row.name)}</td><td class="num">${row.display}</td>${r.history.map((h) => `<td class="num">${SM.engine.format(h.items[id] && h.items[id].value, r.unit, id)}</td>`).join("")}</tr>`; }).join("")}</tbody></table></div>` : "";
