      if (!name) return;
      const tp = { schema: "stitchmeasure.template/1", id: U.uid("tpl"), group: "Custom", name: name.trim(), fit: "semi", items: ["height", "full_chest", "waist", "hip"], labels: {}, customDefs: [], builtin: false };
      await SM.db.put("templates", tp); app.go("#/template/" + tp.id);
    };
  };

  SM.views.template = async function (el, args) {
    const tp = await app.resolveTemplate(args[0]);
    if (!tp) return app.go("#/templates");
    const items = SM.templates.items(tp);
    const name = (id) => (tp.labels && tp.labels[id]) || ((tp.customDefs || []).find((d) => d.id === id) || {}).name || SM.catalog.name(id);
    const editable = !tp.builtin;
    el.innerHTML = app.head({ eyebrow: t(tp.group) + " · " + t(SM.templates.FIT[tp.fit] || ""), title: tp.name, sub: editable ? t("Custom template. Changes save immediately and apply to new and existing records that use it.") : t("Built-in template. Make a copy to change it."),
      actions: `<a class="btn" href="#/templates">${SM.icon("back")}${t("Templates")}</a>${editable ? "" : `<button class="btn" data-copy>${SM.icon("copy")}${t("Customise a copy")}</button>`}<button class="btn primary" data-use>${SM.icon("users")}${t("Use for a customer")}</button>` }) + `
      <div class="stack">
        ${editable ? `<section class="card form-grid"><label class="field">${t("Template name")}<input type="text" id="tpName" value="${U.esc(tp.name)}"></label>
          <label class="field">${t("Fit")}<select id="tpFit">${Object.entries(SM.templates.FIT).map(([k, v]) => `<option value="${k}" ${tp.fit === k ? "selected" : ""}>${t(v)}</option>`).join("")}</select><span class="hint">${t("Sets the repeat-reading tolerance (Settings).")}</span></label></section>` : ""}
        <div class="notice">${SM.icon("info")}<div>${t("Templates list body measurements only. Ease, design and seam allowances are entered separately in each record and are never merged into body values.")}</div></div>
        <div class="list" id="tpList">${items.map((id, i) => `<div class="list-item" style="cursor:default" data-id="${id}">
          <span class="lib-thumb">${SM.catalog.get(id) ? SM.figure.forEntry(SM.catalog.get(id), "adult") : SM.icon("tape")}</span>
          <span class="main"><span class="t">${i + 1}. ${U.esc(name(id))}</span><span class="s">${SM.catalog.get(id) ? t(SM.catalog.KIND_LABEL[SM.catalog.get(id).kind]) + (tp.labels && tp.labels[id] ? " · " + t("library:") + " " + U.esc(SM.catalog.name(id)) : "") : t("Custom measurement")}</span></span>
          ${editable ? `<span class="row" style="flex-wrap:nowrap;gap:2px"><button class="icon-btn" data-up ${i === 0 ? "disabled" : ""} aria-label="${t("Move up")}" style="transform:rotate(-90deg)">${SM.icon("chevron")}</button><button class="icon-btn" data-down ${i === items.length - 1 ? "disabled" : ""} aria-label="${t("Move down")}" style="transform:rotate(90deg)">${SM.icon("chevron")}</button><button class="icon-btn" data-rename aria-label="${t("Rename")}">${SM.icon("edit")}</button><button class="icon-btn" data-rm aria-label="${t("Remove")}">${SM.icon("trash")}</button></span>` : SM.catalog.get(id) ? `<a class="icon-btn" href="#/measure/${id}" aria-label="${t("Instructions")}">${SM.icon("info")}</a>` : ""}
        </div>`).join("")}</div>
        ${editable ? `<div class="btn-row"><button class="btn" data-add>${SM.icon("plus")}${t("Add from library")}</button><button class="btn" data-addc>${SM.icon("plus")}${t("Add custom measurement")}</button><button class="btn danger" data-del>${SM.icon("trash")}${t("Delete template")}</button></div>` : ""}
      </div>`;
    const save = async () => { await SM.db.put("templates", tp); app.rerender(); };
    if (editable) {
      U.$("#tpName").onchange = (e) => { tp.name = e.target.value.trim() || tp.name; SM.db.put("templates", tp); };
      U.$("#tpFit").onchange = (e) => { tp.fit = e.target.value; SM.db.put("templates", tp); };
      U.$("#tpList").onclick = async (e) => {
        const row = e.target.closest("[data-id]"); if (!row) return;
        const id = row.dataset.id, i = tp.items.indexOf(id);
        if (e.target.closest("[data-up]") && i > 0) { tp.items.splice(i, 1); tp.items.splice(i - 1, 0, id); save(); }
        else if (e.target.closest("[data-down]") && i < tp.items.length - 1) { tp.items.splice(i, 1); tp.items.splice(i + 1, 0, id); save(); }
        else if (e.target.closest("[data-rm]")) { tp.items.splice(i, 1); save(); }
        else if (e.target.closest("[data-rename]")) {
          const n = await U.prompt({ title: t("Rename measurement"), label: t("Name shown in this template"), value: name(id) });
          if (n == null) return; tp.labels = tp.labels || {};
          const cd = (tp.customDefs || []).find((d) => d.id === id);
          if (cd) cd.name = n.trim(); else if (n.trim() && n.trim() !== SM.catalog.name(id)) tp.labels[id] = n.trim(); else delete tp.labels[id];
          save();
        }
      };
      U.$("[data-add]", el).onclick = () => {
        const sh = U.sheet({ title: t("Add from library"), html: `<div class="search">${SM.icon("search")}<input type="search" data-q placeholder="${t("Search")}"></div><div class="list" data-l></div>` });
        const draw = (q) => { q = (q || "").toLowerCase(); sh.el.querySelector("[data-l]").innerHTML = SM.catalog.all.filter((x) => !tp.items.includes(x.id) && (!q || SM.catalog.name(x.id).toLowerCase().includes(q))).map((x) => `<button class="list-item" data-p="${x.id}"><span class="main"><span class="t">${U.esc(SM.catalog.name(x.id))}</span><span class="s">${t((SM.catalog.REGIONS.find((r) => r.id === x.region) || {}).name)}</span></span>${SM.icon("plus")}</button>`).join(""); };
        draw(""); sh.el.querySelector("[data-q]").oninput = (e) => draw(e.target.value);
        sh.el.querySelector("[data-l]").onclick = (e) => { const b = e.target.closest("[data-p]"); if (!b) return; tp.items.push(b.dataset.p); b.remove(); SM.db.put("templates", tp); };
        sh.root.addEventListener("click", (e) => { if (e.target === sh.root || e.target.closest("[data-close]")) app.rerender(); });
      };
      U.$("[data-addc]", el).onclick = async () => {
        const n = await U.prompt({ title: t("Custom measurement"), label: t("Measurement name"), ok: t("Add") });
        if (!n || !n.trim()) return;
        const id = "c_" + U.uid("m").slice(2);
        tp.customDefs = (tp.customDefs || []).concat([{ id, name: n.trim() }]); tp.items.push(id); save();
      };
      U.$("[data-del]", el).onclick = async () => {
        if (!(await U.confirm({ title: t("Delete template?"), message: t("Existing measurement records keep their values; they will show items from the library list."), ok: t("Delete"), danger: true }))) return;
        await SM.db.del("templates", tp.id); app.go("#/templates");
      };
    } else {
      U.$("[data-copy]", el).onclick = async () => {
        const cp = { schema: "stitchmeasure.template/1", id: U.uid("tpl"), group: "Custom", name: tp.name + " (custom)", fit: tp.fit, items: items.slice(), labels: {}, customDefs: [], builtin: false, basedOn: tp.id };
        await SM.db.put("templates", cp); U.toast(t("Copy created. You can now edit it.")); app.go("#/template/" + cp.id);
      };
    }
    U.$("[data-use]", el).onclick = async () => {
      const c = await app.pickCustomer(); if (!c) return;
      const s = await app.ensureSession(c.id, tp.id); app.go("#/session/" + s.id);
    };
  };
})();

</script>
<script>/* src/camera/camera-view.js */
/* Live camera screen: transparent body outline + grid layers, guidance,
 * countdown, capture, review, save/export. Also handles photo import. */
(function () {
  "use strict";
  const SM = window.SM, U = SM.util, t = SM.t, app = SM.app;
  const PX = SM.photoExport;

  const GUIDE = {
    front: "Face the camera. Arms slightly away from the body, feet in the guides.",
    back: "Turn your back to the camera. Arms slightly away from the body.",
    left: "Turn so your left side faces the camera. Arms relaxed.",
    right: "Turn so your right side faces the camera. Arms relaxed.",
    upper: "Upper body in the frame, shoulders level and relaxed.",
    lower: "Waist to feet in the frame. Feet in the guides.",
    sleeve: "Arm slightly bent and away from the body, shoulder to wrist visible.",
    extended: "Arms straight out at shoulder height, palms down."
  };

  /* open the camera. opts: {customerId, sessionId, views[], view, measureId, onClose(captured[])} */
  async function open(opts) {
    opts = opts || {};
    const S = app.settings;
    const captured = [];
    const req = opts.views && opts.views.length ? opts.views : null;
    const st = {
      view: opts.view || (req ? req[0] : "front"), age: "adult",
      showOutline: true, opacity: S.overlayOpacity == null ? 0.7 : S.overlayOpacity,
      showGrid: true, density: S.gridDensity || 8, gridOpacity: S.gridOpacity == null ? 0.5 : S.gridOpacity,
      scale: 1, x: 0, y: 0, timer: S.countdown == null ? 3 : S.countdown, mirror: S.mirrorFront !== false,
      panel: false, tilt: null, tiltOn: false, info: null, running: false
    };
    let customer = opts.customerId || app.state.customerId ? await SM.customers.get(opts.customerId || app.state.customerId) : null;
    if (customer) st.age = customer.ageGroup === "child" ? "child" : "adult";

    const root = document.createElement("div");
    root.className = "cam"; root.setAttribute("role", "dialog"); root.setAttribute("aria-label", t("Camera"));
    root.innerHTML = `
      <div class="cam-top">
        <button class="icon-btn" data-close aria-label="${t("Close camera")}">${SM.icon("x")}</button>
        <div class="title" data-title></div>
        <button class="icon-btn" data-torch aria-label="${t("Torch")}" hidden>${SM.icon("bolt")}</button>
        <button class="icon-btn" data-flip aria-label="${t("Switch camera")}">${SM.icon("flip")}</button>
        <button class="icon-btn" data-panel aria-label="${t("Overlay settings")}" aria-pressed="false">${SM.icon("settings")}</button>
      </div>
      <div class="cam-guide" data-guide hidden></div>
      <div class="cam-stage-wrap" data-wrap>
        <div class="cam-stage" data-stage>
          <video data-video playsinline muted autoplay></video>
          <canvas class="cam-layer" data-grid></canvas>
          <div class="cam-outline" data-outline></div>
          <div class="countdown" data-count hidden></div>
        </div>
        <div class="cam-msg" data-msg hidden></div>
      </div>
      <div class="cam-panel" data-ppanel hidden></div>
      <div class="cam-bottom">
        <div class="cam-views" data-views></div>
        <div class="cam-actions">
          <div class="l"><button class="icon-btn" data-import aria-label="${t("Import from gallery")}">${SM.icon("image")}</button><button class="icon-btn" data-timer aria-label="${t("Countdown timer")}">${SM.icon("timer")}</button></div>
          <button class="shutter" data-shutter aria-label="${t("Capture photo")}"><span></span></button>
          <div class="r"><button class="btn sm" data-done style="background:#fff;color:#0E1B2C;border-color:#fff" hidden></button></div>
        </div>
      </div>
      <input type="file" accept="image/*" data-file hidden>`;
    document.body.appendChild(root);
    document.body.classList.add("no-scroll");
    const $ = (s) => root.querySelector(s);
    const video = $("[data-video]"), stage = $("[data-stage]"), wrap = $("[data-wrap]"), outline = $("[data-outline]"), gridC = $("[data-grid]");

    const title = () => {
      $("[data-title]").textContent = (customer ? customer.name + " · " : "") + t(SM.overlays.VIEWS[st.view].name) + (st.timer ? ` · ${st.timer}s` : "");
      $("[data-timer]").setAttribute("aria-pressed", st.timer ? "true" : "false");
    };
    const viewsBar = () => {
      const keys = req || Object.keys(SM.overlays.VIEWS);
      $("[data-views]").innerHTML = keys.map((k) => {
        const n = captured.filter((c) => c.view === k).length;
        return `<button data-v="${k}" aria-pressed="${st.view === k}">${n ? "✓ " : ""}${t(SM.overlays.VIEWS[k].name)}</button>`;
      }).join("");
      const d = $("[data-done]");
      d.hidden = !captured.length && !req;
      d.textContent = req ? t("Done") + ` (${captured.length})` : t("Done") + ` (${captured.length})`;
      d.hidden = false;
    };

    /* layout: stage keeps the video's aspect so overlays map 1:1 to the captured frame */
    let aspectCache = null;
    function layout() {
      const vw = video.videoWidth || 3, vh = video.videoHeight || 4;
      const W = wrap.clientWidth, H = wrap.clientHeight;
      const k = Math.min(W / vw, H / vh);
      stage.style.width = Math.round(vw * k) + "px"; stage.style.height = Math.round(vh * k) + "px";
      drawOverlay();
    }
    function drawOverlay() {
      const W = stage.clientWidth, H = stage.clientHeight;
      if (!aspectCache || aspectCache.key !== st.view + st.age) {
        aspectCache = { key: st.view + st.age, a: SM.overlays.aspectOf(st.view, st.age), svg: SM.overlays.outlineSVG(st.view, st.age) };
        outline.innerHTML = aspectCache.svg;
      }
      const r = SM.overlays.outlineRect(W, H, st, aspectCache.a);
      Object.assign(outline.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px", opacity: st.opacity });
      outline.hidden = !st.showOutline;
      SM.overlays.drawGrid(gridC, { show: st.showGrid, density: st.density, opacity: st.gridOpacity });
    }

    /* drag the outline to align (one finger), pinch to resize (two fingers) */
    const pointers = new Map(); let drag0 = null;
    outline.addEventListener("pointerdown", (e) => { outline.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); drag0 = { st: { x: st.x, y: st.y, scale: st.scale }, pts: new Map(pointers) }; });
    outline.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId) || !drag0) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const W = stage.clientWidth, H = stage.clientHeight;
      const now = [...pointers.values()], was = [...drag0.pts.values()];
      if (now.length === 1 && was.length === 1) { st.x = drag0.st.x + (now[0].x - was[0].x) / W; st.y = drag0.st.y + (now[0].y - was[0].y) / H; }
      else if (now.length >= 2 && was.length >= 2) {
        const d1 = Math.hypot(was[0].x - was[1].x, was[0].y - was[1].y), d2 = Math.hypot(now[0].x - now[1].x, now[0].y - now[1].y);
        st.scale = U.clamp(drag0.st.scale * d2 / Math.max(10, d1), 0.4, 1.6);
      }
      drawOverlay();
    });
    const up = (e) => { pointers.delete(e.pointerId); drag0 = pointers.size ? { st: { x: st.x, y: st.y, scale: st.scale }, pts: new Map(pointers) } : null; };
    outline.addEventListener("pointerup", up); outline.addEventListener("pointercancel", up);

    function panel() {
      const p = $("[data-ppanel]"); p.hidden = !st.panel;
      $("[data-panel]").setAttribute("aria-pressed", st.panel);
      if (!st.panel) return;
      const z = st.info && st.info.zoom;
      p.innerHTML = `
        <label class="check"><input type="checkbox" data-k="showOutline" ${st.showOutline ? "checked" : ""}><span>${t("Show body outline")}</span></label>
        <label>${t("Outline transparency")} <span data-opv>${Math.round((1 - st.opacity) * 100)}%</span><input type="range" min="0" max="100" value="${Math.round((1 - st.opacity) * 100)}" data-k="opacity"></label>
        <label>${t("Reference template")}<select data-k="age"><option value="adult" ${st.age === "adult" ? "selected" : ""}>${t("Adult")}</option><option value="child" ${st.age === "child" ? "selected" : ""}>${t("Child")}</option></select></label>
        <label>${t("Camera view")}<select data-k="view">${Object.entries(SM.overlays.VIEWS).map(([k, v]) => `<option value="${k}" ${st.view === k ? "selected" : ""}>${t(v.name)}</option>`).join("")}</select></label>
        <label>${t("Outline size")} <span>${Math.round(st.scale * 100)}%</span><input type="range" min="40" max="160" value="${Math.round(st.scale * 100)}" data-k="scale"></label>
        <div class="btn-row"><button class="btn" data-act="recenter">${t("Recenter")}</button><button class="btn" data-act="reset">${t("Reset alignment")}</button></div>
        <label class="check"><input type="checkbox" data-k="showGrid" ${st.showGrid ? "checked" : ""}><span>${t("Show grid")}</span></label>
        <label>${t("Grid density")} <span>${st.density}</span><input type="range" min="3" max="24" value="${st.density}" data-k="density"></label>
        <label>${t("Grid visibility")}<input type="range" min="10" max="100" value="${Math.round(st.gridOpacity * 100)}" data-k="gridOpacity"></label>
        ${z ? `<label>${t("Zoom")} <span>${(+z.value).toFixed(1)}×</span><input type="range" min="${z.min}" max="${z.max}" step="${z.step}" value="${z.value}" data-k="zoom"></label>` : ""}
        <label class="check"><input type="checkbox" data-k="mirror" ${st.mirror ? "checked" : ""}><span>${t("Mirror front-camera preview")}</span></label>
        ${"DeviceOrientationEvent" in window ? `<label class="check"><input type="checkbox" data-k="tiltOn" ${st.tiltOn ? "checked" : ""}><span>${t("Tilt warnings (uses motion sensor)")}</span></label>` : ""}
        <p style="color:#AFBACB;font-size:12.5px">${t("Grid squares are positioning guides only. They are not centimetres: a photo has no scale until it is calibrated.")}</p>
        <p style="color:#AFBACB;font-size:12.5px">${t("Starting point for full body: about 2–3 m away, lens at waist height. Adjust until the head and feet sit between the gold lines; the right distance depends on the person's height, the lens and the room.")}</p>`;
    }
    $("[data-ppanel]").addEventListener("input", async (e) => {
      const k = e.target.dataset.k; if (!k) return;
      const v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
      if (k === "opacity") { st.opacity = 1 - v / 100; $("[data-opv]").textContent = v + "%"; }
      else if (k === "scale") { st.scale = v / 100; e.target.previousElementSibling.textContent = v + "%"; }
      else if (k === "density") { st.density = +v; e.target.previousElementSibling.textContent = v; }
      else if (k === "gridOpacity") st.gridOpacity = v / 100;
      else if (k === "zoom") { await SM.camera.setZoom(+v); st.info.zoom.value = +v; e.target.previousElementSibling.textContent = (+v).toFixed(1) + "×"; }
      else if (k === "mirror") { st.mirror = v; applyMirror(); }
      else if (k === "tiltOn") { if (v) await enableTilt(); else st.tiltOn = false; }
      else if (k === "view" || k === "age") { st[k] = v; aspectCache = null; title(); viewsBar(); }
      else st[k] = v;
      drawOverlay();
    });
    $("[data-ppanel]").addEventListener("click", (e) => {
      const a = e.target.closest("[data-act]"); if (!a) return;
      if (a.dataset.act === "recenter") { st.x = 0; st.y = 0; }
      if (a.dataset.act === "reset") { st.x = 0; st.y = 0; st.scale = 1; st.opacity = 0.7; panel(); }
      drawOverlay();
    });

    async function enableTilt() {
      try {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          const r = await DeviceOrientationEvent.requestPermission();
          if (r !== "granted") { U.toast(t("Motion sensor permission was not granted. Tilt warnings are off.")); st.tiltOn = false; panel(); return; }
        }
        st.tiltOn = true;
        window.addEventListener("deviceorientation", onTilt);
      } catch (e) { st.tiltOn = false; U.toast(t("Tilt sensor unavailable on this device.")); panel(); }
    }
    function onTilt(e) { if (e.beta != null) st.tilt = { beta: e.beta, gamma: e.gamma }; }

    function applyMirror() { video.classList.toggle("mirror", st.mirror && SM.camera.facing === "user"); }

    /* live guidance */
    let guideTimer = null;
    function guide() {
      const g = $("[data-guide]");
      if (!SM.camera.active) { g.hidden = true; return; }
      let msg = t(GUIDE[st.view] || ""), sub = t("Manual alignment: AI body detection is not installed in this version."), cls = "";
      const full = ["front", "back", "left", "right", "extended"].includes(st.view);
      const a = SM.camera.analyse(video);
      const tiltBad = st.tiltOn && st.tilt && (Math.abs(st.tilt.beta - 90) > 8 || Math.abs(st.tilt.gamma) > 6);
      if (full && video.videoWidth > video.videoHeight && st.view !== "extended") { msg = t("Keep your phone upright (portrait) for full-body photos."); cls = "warn"; }
      else if (tiltBad) { msg = Math.abs(st.tilt.gamma) > 6 ? t("Level the phone: it is tilted sideways.") : st.tilt.beta < 82 ? t("Tilt the top of the phone back. Keep it upright.") : t("Tilt the top of the phone forward. Keep it upright."); sub = t("Tilt makes the body look shorter or longer."); cls = "warn"; }
      else if (a && a.brightness < 55) { msg = t("Improve the lighting. The picture is too dark."); cls = "warn"; }
      else if (a && a.brightness > 225) { msg = t("Too bright or backlit. Avoid standing in front of a window."); cls = "warn"; }
      else if (a && a.motion > 14) { msg = t("Please stand still."); cls = "warn"; }
      else if (full) { sub = t("Head at the top gold line, feet in the foot guides, whole body visible. Move the phone back if anything is cut off."); cls = "ok"; }
      g.className = "cam-guide " + cls; g.hidden = false;
      g.innerHTML = `<span>${U.esc(msg)}</span><small>${U.esc(sub)}</small>`;
    }

    function message(html) { const m = $("[data-msg]"); m.hidden = !html; m.innerHTML = html ? `<div class="box">${html}</div>` : ""; }

    async function startCam(facing) {
      message("");
      try {
        st.info = await SM.camera.start(video, facing ? { facing } : {});
        $("[data-torch]").hidden = !st.info.torch;
        $("[data-flip]").hidden = st.info.cameras < 2;
        applyMirror(); layout(); panel();
        clearInterval(guideTimer); guideTimer = setInterval(guide, 450);
        await SM.settings.set("cameraConsent", true);
      } catch (e) {
        stage.style.width = "0px";
        message(`${SM.icon("camera", "")}<p style="font-weight:600;font-size:17px">${U.esc(e.message)}</p>
          <div class="btn-row" style="justify-content:center"><button class="btn" data-msgimport>${SM.icon("image")}${t("Import photo")}</button>${SM.camera.support().ok ? `<button class="btn ghost" data-retry>${t("Try again")}</button>` : ""}</div>
          <p style="color:#AFBACB;font-size:13.5px">${t("You can always enter measurements manually with a tape.")}</p>`);
        const mi = root.querySelector("[data-msgimport]"); if (mi) mi.onclick = () => $("[data-file]").click();
        const rt = root.querySelector("[data-retry]"); if (rt) rt.onclick = () => startCam();
      }
    }

    /* camera permission explanation, shown once */
    async function explainFirst() {
      if (S.cameraConsent || !SM.camera.support().ok) return true;
      return new Promise((resolve) => {
        message(`${SM.icon("shield")}<p style="font-weight:600;font-size:18px">${t("Camera access")}</p>
          <p style="color:#C4CDDB">${t("StitchMeasure uses the camera only while this screen is open. Photos are processed on this device and are stored only if you save them to a customer. Nothing is uploaded.")}</p>
          <div class="btn-row" style="justify-content:center"><button class="btn" data-allow>${t("Continue")}</button><button class="btn ghost" data-msgimport>${t("Import a photo instead")}</button></div>`);
        root.querySelector("[data-allow]").onclick = () => { message(""); resolve(true); };
        root.querySelector("[data-msgimport]").onclick = () => { message(""); resolve(false); $("[data-file]").click(); };
      });
    }

    /* capture */
    let busy = false;
    async function shoot() {
      if (busy || !SM.camera.active) return;
      busy = true;
      try {
        for (let n = st.timer; n > 0; n--) { const c = $("[data-count]"); c.hidden = false; c.textContent = n; if (navigator.vibrate) navigator.vibrate(30); await new Promise((r) => setTimeout(r, 1000)); }
        $("[data-count]").hidden = true;
        const frame = SM.camera.capture(video, false);
        const mirroredPreview = st.mirror && SM.camera.facing === "user";
        const overlay = { view: st.view, age: st.age, scale: st.scale, x: mirroredPreview ? -st.x : st.x, y: st.y, opacity: st.opacity };
        await review(frame, { source: "camera", overlay, device: { facing: SM.camera.facing, label: st.info && st.info.label, w: frame.width, h: frame.height } });
      } catch (e) { U.toast(e.message, "err"); }
      finally { busy = false; $("[data-count]").hidden = true; }
    }

    async function importFile(file) {
      if (!file) return;
      try {
        const img = await SM.util.blobToImage(file);
        const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext("2d").drawImage(img, 0, 0);
        await review(c, { source: "import", overlay: { view: st.view, age: st.age, scale: st.scale, x: st.x, y: st.y, opacity: st.opacity }, device: null });
      } catch (e) { U.toast(t("That file could not be opened as an image."), "err"); }
    }

    /* review: preview versions, then save / export / retake / discard */
    function review(frame, meta) {
      return new Promise(async (resolve) => {
        const { blob, w, h } = await PX.compress(frame);
        const thumb = await PX.makeThumb(frame);
        const photo = {
          schema: "stitchmeasure.photo/1", id: U.uid("pho"), customerId: customer ? customer.id : null, sessionId: opts.sessionId || null,
          view: st.view, measureId: opts.measureId || null, garmentId: null, blob, thumb, w, h, overlay: meta.overlay,
          ann: { grid: { show: false, density: st.density, opacity: st.gridOpacity }, points: [], lines: [], cal: null, crop: null, rotation: 0 },
          source: meta.source, device: meta.device, createdAt: new Date().toISOString()
        };
        let version = "original", saved = false;
        const s = U.sheet({ title: t("Review photo"), wide: true, html: `
          <div class="review-img" data-prev></div>
          <div class="seg" role="group" aria-label="${t("Version")}">${Object.entries({ original: "Original", outline: "Outline", grid: "Grid", all: "All layers" }).map(([k, n]) => `<button data-ver="${k}" aria-pressed="${k === version}">${t(n)}</button>`).join("")}</div>
          <div data-consent></div>
          <div class="btn-row">
            <button class="btn primary" data-a="save">${SM.icon("check")}${t("Save to customer")}</button>
            <button class="btn" data-a="gallery">${SM.icon("image")}${t("Save to Gallery / Photos")}</button>
            <button class="btn" data-a="download">${SM.icon("download")}${t("Download photo")}</button>
            <button class="btn" data-a="share">${SM.icon("share")}${t("Share photo")}</button>
          </div>
          <div class="btn-row">
            <button class="btn" data-a="edit">${SM.icon("ruler")}${t("Annotate & calibrate")}</button>
            <button class="btn ghost" data-a="retake">${SM.icon("camera")}${t("Retake photo")}</button>
            <button class="btn ghost danger" data-a="delete" style="border-color:transparent">${SM.icon("trash")}${t("Delete photo")}</button>
          </div>
          <p class="muted small">${U.esc(PX.galleryHelp())} ${t("“Lines” versions are created in the editor after you add measurement lines.")}</p>
          <label class="field">${t("Format for export")}<select data-fmt><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label>`,
          onClose: () => resolve(saved ? photo : null)
        });
        const prev = s.el.querySelector("[data-prev]");
        const drawPrev = async () => { prev.innerHTML = ""; const c = await PX.render(photo, version, app.unit(customer)); prev.appendChild(c); };
        const consentBox = () => {
          const box = s.el.querySelector("[data-consent]");
          if (!customer) { box.innerHTML = `<div class="notice">${SM.icon("info")}<div>${t("No customer selected. “Save to customer” will ask which customer.")}</div></div>`; return; }
          if (!app.settings.keepPhotos) { box.innerHTML = `<div class="notice">${SM.icon("shield")}<div>${t("Photo storage is switched off in Settings (analyse without keeping). You can still annotate and export.")}</div></div>`; return; }
          if (!customer.consent.photos) box.innerHTML = `<div class="notice warn">${SM.icon("shield")}<div>${t("{n} has no photo consent recorded.", { n: U.esc(customer.name) })}<label class="check" style="margin-top:8px"><input type="checkbox" data-grant><span>${customer.ageGroup === "child" ? t("The guardian has consented to storing this child's photos.") : t("The customer consents to storing this photo.")}</span></label></div></div>`;
          else box.innerHTML = `<p class="muted small">${t("Will be saved to")} <b>${U.esc(customer.name)}</b> · ${t(SM.overlays.VIEWS[photo.view].name)}</p>`;
        };
        await drawPrev(); consentBox();
        s.el.querySelectorAll("[data-ver]").forEach((b) => (b.onclick = async () => { version = b.dataset.ver; s.el.querySelectorAll("[data-ver]").forEach((x) => x.setAttribute("aria-pressed", x === b)); await drawPrev(); }));
        const exportBlob = async () => {
          const fmt = s.el.querySelector("[data-fmt]").value;
          const c = await PX.render(photo, version, app.unit(customer));
          let b = await U.canvasToBlob(c, fmt, 0.92);
          if (fmt === "image/webp" && b.type !== "image/webp") b = await U.canvasToBlob(c, "image/jpeg", 0.92); // WebP unsupported → JPEG
          const ext = b.type === "image/png" ? "png" : b.type === "image/webp" ? "webp" : "jpg";
          return { b, name: PX.filename(customer, photo, version, ext) };
        };
        s.el.addEventListener("click", async (e) => {
          const a = e.target.closest("[data-a]"); if (!a) return;
          const act = a.dataset.a;
          if (act === "save") {
            if (!customer) { const c = await app.pickCustomer({ title: t("Save photo to…") }); if (!c) return; customer = c; photo.customerId = c.id; app.state.customerId = c.id; title(); consentBox(); }
            if (!app.settings.keepPhotos) { U.toast(t("Photo storage is off in Settings."), "err"); return; }
            if (!customer.consent.photos) {
              const g = s.el.querySelector("[data-grant]");
              if (!g || !g.checked) { U.toast(t("Record consent first, or use Download/Share without storing."), "err"); return; }
              customer.consent.photos = true;
              if (customer.ageGroup === "child") customer.consent.guardian = Object.assign({ name: customer.consent.guardian.name || t("Recorded at capture") }, customer.consent.guardian, { given: true });
              await SM.customers.save(customer);
            }
            try {
              await SM.db.put("photos", photo); saved = true; captured.push(photo); viewsBar();
              await SM.db.log(`Photo saved: ${customer.name} · ${SM.overlays.VIEWS[photo.view].name}`, photo.id);
              U.toast(t("Saved to {n} on this device.", { n: customer.name }));
              s.close();
              if (req) { const next = req.find((k) => !captured.some((c) => c.view === k)); if (next) { st.view = next; aspectCache = null; title(); viewsBar(); drawOverlay(); } }
            } catch (err) { U.toast(t("Could not save: ") + err.message + " " + t("The device may be out of storage."), "err"); }
          } else if (act === "gallery") { const x = await exportBlob(); const r = await PX.toGallery(x.b, x.name); U.toast(r.message); }
          else if (act === "download") { const x = await exportBlob(); const r = await PX.download(x.b, x.name); U.toast(r.message); }
          else if (act === "share") { const x = await exportBlob(); const r = await PX.share(x.b, x.name); U.toast(r.message, r.done ? "" : "err"); }
          else if (act === "retake" || act === "delete") { s.close(); if (act === "delete") U.toast(t("Photo discarded. Nothing was stored.")); }
          else if (act === "edit") {
            s.root.hidden = true;
            await SM.editor.open(photo, { customer, temporary: !saved, onSaveToCustomer: async () => { s.root.hidden = false; } });
            s.root.hidden = false; await drawPrev();
          }
        });
      });
    }

    /* wiring */
    $("[data-close]").onclick = () => close();
    $("[data-flip]").onclick = async () => { st.info = await SM.camera.flip(video).catch((e) => { U.toast(e.message, "err"); return st.info; }); applyMirror(); layout(); };
    $("[data-torch]").onclick = async (e) => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; const ok = await SM.camera.setTorch(on); if (ok) e.currentTarget.setAttribute("aria-pressed", on); else U.toast(t("Torch is not available on this camera.")); };
    $("[data-panel]").onclick = () => { st.panel = !st.panel; panel(); };
    $("[data-timer]").onclick = () => { const seq = [0, 3, 5, 10]; st.timer = seq[(seq.indexOf(st.timer) + 1) % seq.length]; SM.settings.set("countdown", st.timer); title(); U.toast(st.timer ? t("Countdown {n} seconds", { n: st.timer }) : t("Countdown off")); };
    $("[data-shutter]").onclick = shoot;
    $("[data-import]").onclick = () => $("[data-file]").click();
    $("[data-file]").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; importFile(f); };
    $("[data-views]").onclick = (e) => { const b = e.target.closest("[data-v]"); if (!b) return; st.view = b.dataset.v; aspectCache = null; title(); viewsBar(); drawOverlay(); panel(); };
    $("[data-done]").onclick = () => close();
    const onResize = () => layout();
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    video.addEventListener("loadedmetadata", layout);
    root.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); if (e.key === " " && e.target === document.body) shoot(); });

    let closed = false, resolveClose;
    const done = new Promise((r) => (resolveClose = r));
    function close() {
      if (closed) return; closed = true;
      clearInterval(guideTimer); SM.camera.stop();
      window.removeEventListener("resize", onResize); window.removeEventListener("orientationchange", onResize); window.removeEventListener("deviceorientation", onTilt);
      root.remove(); if (!document.querySelector(".sheet-wrap")) document.body.classList.remove("no-scroll");
      if (opts.onClose) opts.onClose(captured);
      resolveClose(captured);
    }

    title(); viewsBar();
    if (await explainFirst()) await startCam();
    return done;
  }

  SM.cameraUI = { open };

  /* route: #/camera opens the camera for the selected customer; closing returns to the previous screen */
  SM.views.camera = async function (el) {
    el.innerHTML = `<div class="empty">${SM.icon("camera")}<p>${t("Camera closed.")}</p><a class="btn" href="#/">${t("Dashboard")}</a></div>`;
    const back = app.state.customerId ? "#/customer/" + app.state.customerId : "#/";
    await open({ customerId: app.state.customerId });
    if (location.hash === "#/camera") app.go(back);
  };
})();

</script>
<script>/* src/photo-export/editor.js */
/* Photo editor: zoom/pan, rotate, crop, grid, landmark points, measurement

 * The original image is never modified; annotations are stored beside it. */
(function () {
  "use strict";
  const SM = window.SM, U = SM.util, t = SM.t, app = SM.app, E = SM.engine, CAL = SM.calibration, PX = SM.photoExport;

  const LANDMARKS = ["Top of head", "Neck base", "Nape", "Shoulder point (L)", "Shoulder point (R)", "Bust point", "Natural waist", "Hip (fullest)", "Crotch", "Knee", "Ankle", "Elbow", "Wrist", "Floor"];

  function open(photo, opts) {
    opts = opts || {};

      const customer = opts.customer || (photo.customerId ? await SM.customers.get(photo.customerId) : null);
      const unit = app.unit(customer);
      photo.ann = Object.assign({ points: [], lines: [], cal: null, crop: null, rotation: 0, grid: { show: false, density: 8, opacity: 0.5 } }, photo.ann || {});
      const ann = photo.ann;
      const img = await U.blobToImage(photo.blob);

      let rotCanvas = null;
      const undo = [], redo = [];

      const calIn = Object.assign({ method: (opts.calMethod && opts.calMethod !== "depth") ? opts.calMethod : "a4", confirmed: false, knownMm: 300, markerMm: 100, heightCm: customer && customer.heightCm ? customer.heightCm : null }, ann.cal ? { method: ann.cal.method, confirmed: ann.cal.confirmed, knownMm: ann.cal.knownMm, markerMm: ann.cal.markerMm, heightCm: ann.cal.heightCm || (customer && customer.heightCm) } : {});

      const root = document.createElement("div");
      root.className = "editor"; root.setAttribute("role", "dialog"); root.setAttribute("aria-label", t("Photo editor"));
      root.innerHTML = `
        <div class="ed-top">
          <button class="icon-btn" data-close aria-label="${t("Close editor")}">${SM.icon("back")}</button>
          <div class="title">${U.esc(customer ? customer.name + " · " : "")}${t(SM.overlays.VIEWS[photo.view] ? SM.overlays.VIEWS[photo.view].name : "Photo")}${opts.temporary ? " · " + t("not stored") : ""}</div>
          <button class="icon-btn" data-undo aria-label="${t("Undo")}" disabled>${SM.icon("undo")}</button>
          <button class="icon-btn" data-redo aria-label="${t("Redo")}" disabled>${SM.icon("redo")}</button>
          <button class="icon-btn" data-zoomout aria-label="${t("Zoom out")}"><b style="font-size:22px;line-height:1">−</b></button>
          <button class="icon-btn" data-zoomin aria-label="${t("Zoom in")}"><b style="font-size:22px;line-height:1">+</b></button>
          <button class="btn sm primary" data-save style="background:#3CC4B8;border-color:#3CC4B8;color:#06201E">${opts.temporary ? t("Done") : t("Save")}</button>
        </div>
        <div class="ed-stage" data-stage><canvas data-cv></canvas></div>
        <div class="ed-tools" role="toolbar">
          ${[["pan", "hand", "Move"], ["line", "line", "Line"], ["point", "point", "Point"], ["cal", "target", "Calibrate"], ["grid", "grid", "Grid"], ["rotate", "rotate", "Rotate"], ["crop", "crop", "Crop"], ["export", "download", "Export"]].map(([k, i, n]) => `<button data-tool="${k}" aria-pressed="${k === st.tool}">${SM.icon(i)}${t(n)}</button>`).join("")}
        </div>
        <div class="ed-panel" data-panel></div>`;
      document.body.appendChild(root);
      document.body.classList.add("no-scroll");
      const $ = (s) => root.querySelector(s);
      const cv = $("[data-cv]"), stage = $("[data-stage]");
      const g = cv.getContext("2d");

      /* ---------- geometry ---------- */
      const rot = () => ann.rotation || 0;
      const vd = () => PX.dims(IW, IH, rot());
      function buildRot() { const d = vd(); rotCanvas = document.createElement("canvas"); rotCanvas.width = d.w; rotCanvas.height = d.h; PX.drawRotated(rotCanvas.getContext("2d"), img, IW, IH, rot()); }
      function fit() { const d = vd(), W = stage.clientWidth, H = stage.clientHeight; st.s = Math.min(W / d.w, H / d.h) * 0.94; st.ox = (W - d.w * st.s) / 2; st.oy = (H - d.h * st.s) / 2; }
      const screenToView = (x, y) => ({ x: (x - st.ox) / st.s, y: (y - st.oy) / st.s });
      const viewToScreen = (p) => ({ x: st.ox + p.x * st.s, y: st.oy + p.y * st.s });

      function snapshot() { undo.push(JSON.stringify(ann)); if (undo.length > 60) undo.shift(); redo.length = 0; st.dirty = true; buttons(); }
      function restore(json) { const o = JSON.parse(json); Object.keys(ann).forEach((k) => delete ann[k]); Object.assign(ann, o); buildRot(); }
      function buttons() { $("[data-undo]").disabled = !undo.length; $("[data-redo]").disabled = !redo.length; }

      /* ---------- drawing ---------- */
      function draw(loupeAt) {
        const dpr = window.devicePixelRatio || 1, W = stage.clientWidth, H = stage.clientHeight;
        if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
        g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);

        const d = vd();
        if (ann.grid && ann.grid.show) { g.save(); g.beginPath(); g.rect(0, 0, d.w, d.h); g.clip(); SM.overlays.paintGrid(g, d.w, d.h, { density: ann.grid.density, opacity: ann.grid.opacity }); g.restore(); }
        if (ann.crop) {

          g.fillRect(0, 0, d.w, c.y); g.fillRect(0, c.y + c.h, d.w, d.h - c.y - c.h); g.fillRect(0, c.y, c.x, c.h); g.fillRect(c.x + c.w, c.y, d.w - c.x - c.w, c.h);
          g.strokeStyle = "#D8B76A"; g.lineWidth = 2 / st.s; g.setLineDash([8 / st.s, 6 / st.s]); g.strokeRect(c.x, c.y, c.w, c.h); g.setLineDash([]);
        }
        PX.drawAnnotations(g, ann, IW, IH, rot(), 1 / st.s, unit);
        // pending first point and selected handle
        const mark = (vp, color) => { g.beginPath(); g.arc(vp.x, vp.y, 9 / st.s, 0, 7); g.lineWidth = 3 / st.s; g.strokeStyle = color; g.stroke(); };
        if (st.pending) mark(toV(st.pending), "#ffffff");
        if (st.sel && st.sel.p) mark(toV(st.sel.p), "#ffffff");
        g.restore();
        if (loupeAt) loupe(loupeAt);
      }
      function loupe(op) {
        const sp = viewToScreen(toV(op)), dpr = window.devicePixelRatio || 1, R = 64, Z = 2.5;
        const lx = sp.x < 170 && sp.y < 170 ? stage.clientWidth - R * 2 - 12 : 12, ly = 12;
        g.save(); g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.beginPath(); g.arc(lx + R, ly + R, R, 0, 7); g.closePath(); g.save(); g.clip();
        g.fillStyle = "#000"; g.fillRect(lx, ly, R * 2, R * 2);
        const src = (R * 2 / Z) * dpr;
        g.drawImage(cv, sp.x * dpr - src / 2, sp.y * dpr - src / 2, src, src, lx, ly, R * 2, R * 2);
        g.restore();
        g.strokeStyle = "#D8B76A"; g.lineWidth = 3; g.beginPath(); g.arc(lx + R, ly + R, R, 0, 7); g.stroke();
        g.strokeStyle = "#fff"; g.lineWidth = 1; g.beginPath(); g.moveTo(lx + R - 10, ly + R); g.lineTo(lx + R + 10, ly + R); g.moveTo(lx + R, ly + R - 10); g.lineTo(lx + R, ly + R + 10); g.stroke();
        g.restore();
      }

      /* ---------- hit testing ---------- */
      function handles() {
        const hs = [];
        (ann.lines || []).forEach((l) => { hs.push({ obj: l, key: "a", p: l.a }); hs.push({ obj: l, key: "b", p: l.b }); });
        (ann.points || []).forEach((p) => hs.push({ obj: p, key: null, p }));
        if (ann.cal) ["edge1", "edge2"].forEach((e) => { const ed = ann.cal[e]; if (ed && ed[0]) { hs.push({ obj: ed, key: 0, p: ed[0], cal: true }); if (ed[1]) hs.push({ obj: ed, key: 1, p: ed[1], cal: true }); } });

      });

      async function addPoint(op) {
        const sh = U.sheet({ title: t("Landmark point"), html: `<div class="choice-grid">${LANDMARKS.map((l) => `<button class="choice" data-l="${U.esc(l)}"><b>${U.esc(t(l))}</b></button>`).join("")}</div><form class="row" data-f style="flex-wrap:nowrap"><input type="text" placeholder="${t("Custom label")}" data-c><button class="btn primary">${t("Add")}</button></form>` });
        const add = (label) => { snapshot(); ann.points.push({ id: U.uid("pt"), x: op.x, y: op.y, label }); sh.close(); draw(); panel(); };

      /* ---------- calibration ---------- */
      function recalibrate(record) {

        if (record && res.valid && !opts.temporary) SM.db.put("calibrations", { id: U.uid("cal"), photoId: photo.id, customerId: photo.customerId, method: res.method, mmPerPx: res.mmPerPx, scope: res.scope, at: res.at, warnings: res.warnings });
        return res;
      }

      /* value of a line for its measurement type */
      function lineValue(ln) {

        if (r.mm == null) return { text: Math.round(r.px) + " px", value: null, ok: false, note: r.reason };
        return { text: E.format(r.mm / 10, unit) + " " + E.unitLabel(unit), value: r.mm / 10, ok: true };
      }

      /* ---------- panels ---------- */
      const camEntries = SM.catalog.all.filter((e) => e.camera);
      function panelValues() { root.querySelectorAll("[data-lv]").forEach((n) => { const ln = ann.lines.find((l) => l.id === n.dataset.lv); if (ln) n.textContent = lineValue(ln).text; }); const cr = root.querySelector("[data-calres]"); if (cr) cr.innerHTML = calResultHTML(); }
      function calResultHTML() {

        if (!r.valid) return `<div class="notice danger">${SM.icon("warn")}<div><b>${t("Calibration rejected")}</b><br>${r.errors.map(U.esc).join("<br>")}<br><small>${t("Fix the marks or retake the photo. No physical values are shown until calibration passes.")}</small></div></div>`;

      }
      function panel() {
        const p = $("[data-panel]");
        root.querySelectorAll("[data-tool]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tool === st.tool));
        if (st.tool === "pan") p.innerHTML = `<p class="ed-hint">${t("Drag to move the photo. Pinch or use + / − to zoom.")}</p>`;
        else if (st.tool === "line") {
          p.innerHTML = `<p class="ed-hint">${t("Drag across the photo to draw a line, or tap two points. Drag the round handles to adjust; a magnifier helps you place them.")}</p>

            <div class="ed-lines">${(ann.lines || []).map((ln) => { const v = lineValue(ln); return `<div class="ed-line" data-l="${ln.id}">
              <div class="n"><select data-mid aria-label="${t("Measurement")}"><option value="">${t("Unassigned line")}</option>${camEntries.map((e) => `<option value="${e.id}" ${ln.measureId === e.id ? "selected" : ""}>${U.esc(SM.catalog.name(e.id))}</option>`).join("")}</select>
              ${v.note ? `<div class="ed-hint" style="margin-top:4px">${U.esc(v.note)}</div>` : ""}</div>

              <button class="icon-btn" data-del aria-label="${t("Delete line")}">${SM.icon("trash")}</button></div>`; }).join("") || `<p class="ed-hint">${t("No lines yet.")}</p>`}</div>
            <p class="ed-hint">${t("Only straight distances in the photo plane can be measured here. Circumferences and depths need a tape and are not listed.")}</p>`;

        } else if (st.tool === "export") {
          p.innerHTML = `<label class="field">${t("Version")}<select data-ver>${Object.entries(PX.VERSIONS).map(([k, v]) => `<option value="${k}" ${k === "lines" ? "selected" : ""}>${t(v)}</option>`).join("")}<option value="all">${t("All layers")}</option></select></label>
            <label class="field">${t("Format")}<select data-fmt><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label>
            <div class="btn-row"><button class="btn primary" data-ex="gallery">${t("Save to Gallery / Photos")}</button><button class="btn" data-ex="download">${t("Download")}</button><button class="btn" data-ex="share">${t("Share")}</button>${window.showSaveFilePicker ? `<button class="btn" data-ex="saveas">${t("Save as…")}</button>` : ""}</div>
            <p class="ed-hint">${U.esc(PX.galleryHelp())}</p>`;
        }
      }

      $("[data-panel]").addEventListener("change", (e) => {
        const tg = e.target;
        if (tg.matches("[data-mid]")) { snapshot(); const ln = ann.lines.find((l) => l.id === tg.closest("[data-l]").dataset.l); ln.measureId = tg.value; panel(); draw(); }
        else if (tg.matches("[data-cm]")) { calIn.method = tg.value; calIn.confirmed = false; st.calEdge = "edge1"; if (ann.cal) { ann.cal.edge2 = null; } if (calIn.method === "height" && !calIn.heightCm && customer && customer.heightCm) calIn.heightCm = customer.heightCm; if (ann.cal && ann.cal.edge1) recalibrate(false); panel(); draw(); }
        else if (tg.matches("[data-cv-mm]")) { calIn.markerMm = +tg.value; recalibrate(false); panelValues(); }
        else if (tg.matches("[data-cv-known]")) { calIn.knownMm = +tg.value; recalibrate(false); panelValues(); }
        else if (tg.matches("[data-cv-h]")) { calIn.heightCm = +tg.value; recalibrate(false); panelValues(); }
        else if (tg.matches("[data-cv-conf]")) { calIn.confirmed = tg.checked; if (ann.cal && ann.cal.edge1) recalibrate(true); panelValues(); draw(); }
        else if (tg.matches("[data-gs]")) { ann.grid.show = tg.checked; st.dirty = true; draw(); }
      });
      $("[data-panel]").addEventListener("input", (e) => {
        if (e.target.matches("[data-gd]")) { ann.grid.density = +e.target.value; st.dirty = true; draw(); }
        if (e.target.matches("[data-go]")) { ann.grid.opacity = e.target.value / 100; st.dirty = true; draw(); }
      });
      $("[data-panel]").addEventListener("click", async (e) => {
        const tg = e.target;
        if (tg.closest("[data-del]")) { snapshot(); const id = tg.closest("[data-l]").dataset.l; ann.lines = ann.lines.filter((l) => l.id !== id); panel(); draw(); }
        else if (tg.closest("[data-delp]")) { snapshot(); const id = tg.closest("[data-p]").dataset.p; ann.points = ann.points.filter((p) => p.id !== id); panel(); draw(); }
        else if (tg.closest("[data-send]")) sendLine(ann.lines.find((l) => l.id === tg.closest("[data-l]").dataset.l));
        else if (tg.closest("[data-edge]")) { st.calEdge = tg.closest("[data-edge]").dataset.edge; panel(); U.toast(t("Drag along the edge on the photo.")); }
        else if (tg.closest("[data-calclear]")) { snapshot(); ann.cal = null; st.calEdge = "edge1"; panel(); draw(); }
        else if (tg.closest("[data-dlmarker]")) downloadMarker(calIn.markerMm || 100);
        else if (tg.closest("[data-rot]")) { snapshot(); ann.rotation = (rot() + (+tg.closest("[data-rot]").dataset.rot) + 360) % 360; ann.crop = null; buildRot(); fit(); draw(); }
        else if (tg.closest("[data-cropclear]")) { snapshot(); ann.crop = null; draw(); panel(); }
        else if (tg.closest("[data-ex]")) {
          const mode = tg.closest("[data-ex]").dataset.ex, ver = $("[data-ver]").value, fmt = $("[data-fmt]").value;
          const c = await PX.render(photo, ver, unit);
          let b = await U.canvasToBlob(c, fmt, 0.92); if (fmt === "image/webp" && b.type !== "image/webp") b = await U.canvasToBlob(c, "image/png");
          const name = PX.filename(customer, photo, ver, b.type === "image/png" ? "png" : b.type === "image/webp" ? "webp" : "jpg");
          const r = mode === "gallery" ? await PX.toGallery(b, name) : mode === "share" ? await PX.share(b, name) : mode === "saveas" ? await PX.saveAs(b, name) : await PX.download(b, name);
          U.toast(r.message || "");
        }
      });

      async function sendLine(ln) {
        const v = lineValue(ln); if (!v.ok) return;
        const entry = SM.catalog.get(ln.measureId);
        if (!customer) { U.toast(t("Save this photo to a customer first."), "err"); return; }
        let s = opts.sessionId ? await SM.db.get("sessions", opts.sessionId) : photo.sessionId ? await SM.db.get("sessions", photo.sessionId) : null;
        if (!s) { const list = await SM.customers.sessions(customer.id); s = list[0] || (await app.ensureSession(customer.id, customer.garment || "u_body_basic")); }
        const tpl = await app.resolveTemplate(s.templateId);
        const it = (s.items[ln.measureId] = s.items[ln.measureId] || E.newItem());
        let force = false;
        if (it.verified) { force = await U.confirm({ title: t("Replace a verified value?"), message: t("{n} is already tape-verified. Adding a camera reading removes the verification.", { n: SM.catalog.name(ln.measureId) }), ok: t("Add reading"), danger: true }); if (!force) return; }
        E.addReading(it, v.value, "camera", { force, photoId: photo.id, by: app.settings.designer });
        const ids = app.sessionIds(s, tpl); if (!ids.includes(ln.measureId)) s.order = ids.concat([ln.measureId]);
        await app.saveSession(s);
        if (!photo.sessionId && !opts.temporary) { photo.sessionId = s.id; st.dirty = true; }
        U.toast(t("{n}: {v} added as a camera reading. {need}", { n: SM.catalog.name(ln.measureId), v: v.text, need: entry.critical ? t("Tape verification required.") : "" }));
      }

      async function downloadMarker(mm) {
        // 300 dpi image of a square marker of the given size with a ruler, to print at 100 %
        const dpi = 300, px = Math.round(mm / 25.4 * dpi), pad = Math.round(15 / 25.4 * dpi);
        const c = document.createElement("canvas"); c.width = px + pad * 2; c.height = px + pad * 2 + Math.round(20 / 25.4 * dpi);
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
        x.fillStyle = "#000"; x.fillRect(pad, pad, px, px); x.fillStyle = "#fff"; const q = px / 5;
        x.fillRect(pad + q, pad + q, q, q); x.fillRect(pad + 3 * q, pad + q, q, q); x.fillRect(pad + q, pad + 3 * q, 3 * q, q * 0.6);
        x.fillStyle = "#000"; x.font = `${Math.round(dpi / 7)}px sans-serif`;
        x.fillText(`StitchMeasure calibration marker · ${mm} × ${mm} mm · print at 100 % (actual size) and check with a ruler`, pad, pad + px + Math.round(dpi / 4));
        const b = await U.canvasToBlob(c, "image/png");
        const r = await PX.download(b, `StitchMeasure_marker_${mm}mm_300dpi.png`);
        U.toast(r.message + " " + t("Print at 300 dpi / actual size, then measure the black square: it must be exactly {mm} mm.", { mm }));
      }

      /* ---------- toolbar & lifecycle ---------- */
      root.querySelector(".ed-tools").onclick = (e) => { const b = e.target.closest("[data-tool]"); if (!b) return; st.tool = b.dataset.tool; st.pending = null; panel(); draw(); };
      $("[data-undo]").onclick = () => { if (!undo.length) return; redo.push(JSON.stringify(ann)); restore(undo.pop()); buttons(); panel(); draw(); };
      $("[data-redo]").onclick = () => { if (!redo.length) return; undo.push(JSON.stringify(ann)); restore(redo.pop()); buttons(); panel(); draw(); };
      $("[data-zoomin]").onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.3);
      $("[data-zoomout]").onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.3);
      const onResize = () => { fit(); draw(); };
      window.addEventListener("resize", onResize);
      async function save() {
        if (!opts.temporary) { await SM.db.put("photos", photo); await SM.db.log("Annotations saved", photo.id); U.toast(t("Annotations saved. The original photo is unchanged.")); }
        st.dirty = false;
      }
      $("[data-save]").onclick = async () => { await save(); close(); };
      $("[data-close]").onclick = async () => {
        if (st.dirty && !opts.temporary) {
          const keep = await U.confirm({ title: t("Save changes?"), message: t("You have unsaved annotations."), ok: t("Save"), cancel: t("Discard") });
          if (keep) await save();
        }
        close();
      };
      function close() { window.removeEventListener("resize", onResize); root.remove(); if (!document.querySelector(".sheet-wrap,.cam")) document.body.classList.remove("no-scroll"); resolve(photo); }

      buildRot(); fit(); panel(); draw();
      if (ann.cal && ann.cal.edge1) recalibrate(false);
      if (opts.tool) { st.tool = opts.tool; panel(); }
    });
  }

  SM.editor = { open };
})();

</script>
<script>/* src/photo-export/photos-view.js */
/* Local photo library: browse by customer and view, open, annotate, export, delete. */
(function () {
  "use strict";
  const SM = window.SM, U = SM.util, t = SM.t, app = SM.app, PX = SM.photoExport;
  const viewName = (v) => t(SM.overlays.VIEWS[v] ? SM.overlays.VIEWS[v].name : v === "measurement" ? "Measurement" : "Photo");

  SM.views.photos = async function (el, args) {
    if (args[0]) return detail(el, args[0]);
    const [photos, customers] = await Promise.all([SM.db.all("photos"), SM.db.all("customers")]);
    const cmap = Object.fromEntries(customers.map((c) => [c.id, c]));
    const f = (app._phF = app._phF || { view: "all", cust: "all" });
    const list = photos.filter((p) => (f.view === "all" || p.view === f.view) && (f.cust === "all" || p.customerId === f.cust)).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    const bytes = photos.reduce((s, p) => s + (p.blob ? p.blob.size : 0) + (p.thumb ? p.thumb.size : 0), 0);
    el.innerHTML = app.head({ title: t("Photo library"), sub: t("{n} photos · {b} on this device. Originals are never altered by annotations.", { n: photos.length, b: U.bytes(bytes) }), actions: `<a class="btn primary" href="#/camera">${SM.icon("camera")}${t("Open camera")}</a>` }) + `
      <div class="stack">
        <div class="form-grid">
          <label class="field">${t("Customer")}<select id="phCust"><option value="all">${t("All customers")}</option>${customers.map((c) => `<option value="${c.id}" ${f.cust === c.id ? "selected" : ""}>${U.esc(c.name)}</option>`).join("")}</select></label>
          <label class="field">${t("View")}<select id="phView"><option value="all">${t("All views")}</option>${Object.entries(SM.overlays.VIEWS).map(([k, v]) => `<option value="${k}" ${f.view === k ? "selected" : ""}>${t(v.name)}</option>`).join("")}</select></label>
        </div>
        ${list.length ? `<div class="photo-grid" id="phGrid"></div>` : `<div class="empty">${SM.icon("image")}<p>${t("No photos here yet.")}</p></div>`}
      </div>`;
    const grid = U.$("#phGrid");
    if (grid) list.forEach((p) => {
      const a = document.createElement("a"); a.className = "photo-card"; a.href = "#/photos/" + p.id;
      a.innerHTML = `<img src="${URL.createObjectURL(p.thumb || p.blob)}" alt=""><span class="cap">${U.esc(cmap[p.customerId] ? cmap[p.customerId].name : t("No customer"))}<br>${viewName(p.view)} · ${U.esc(U.fmtDate(p.createdAt))}</span>`;
      grid.appendChild(a);
    });
    U.$("#phCust").onchange = (e) => { f.cust = e.target.value; app.rerender(); };
    U.$("#phView").onchange = (e) => { f.view = e.target.value; app.rerender(); };
  };

  async function detail(el, id) {
    const p = await SM.db.get("photos", id);
    if (!p) { el.innerHTML = `<div class="empty">${t("Photo not found.")}</div>`; return; }
    const c = p.customerId ? await SM.customers.get(p.customerId) : null;
    const nLines = (p.ann && p.ann.lines || []).length, cal = p.ann && p.ann.cal && p.ann.cal.result;
    let version = "original";
    el.innerHTML = app.head({ eyebrow: c ? c.name + " · " + c.code : "", title: viewName(p.view), sub: `${U.esc(U.fmtDateTime(p.createdAt))} · ${p.w}×${p.h}px · ${U.bytes(p.blob ? p.blob.size : 0)} · ${p.source === "import" ? t("imported") : t("camera")}`,
      actions: `<a class="btn" href="#/photos">${SM.icon("back")}${t("Library")}</a><button class="btn primary" data-edit>${SM.icon("ruler")}${t("Annotate & calibrate")}</button>` }) + `
      <div class="grid-2" style="align-items:start">
        <div class="stack">
          <div class="review-img" id="phPrev"></div>
          <div class="seg">${Object.entries({ original: "Original", outline: "Outline", grid: "Grid", lines: "Lines", all: "All" }).map(([k, n]) => `<button data-ver="${k}" aria-pressed="${k === version}">${t(n)}</button>`).join("")}</div>
        </div>
        <div class="stack">
          <section class="card stack-sm">
            <h3>${t("Analysis")}</h3>
            <p>${nLines} ${t("measurement lines")} · ${cal ? (cal.valid ? t("calibrated") + " (" + t(SM.calibration.METHODS[cal.method].name) + ")" : t("calibration rejected")) : t("not calibrated")}</p>
          </section>
          <section class="card stack">
            <h3>${t("Save & share")}</h3>
            <label class="field">${t("Format")}<select id="phFmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label>
            <div class="btn-row"><button class="btn primary" data-x="gallery">${SM.icon("image")}${t("Save to Gallery / Photos")}</button><button class="btn" data-x="download">${SM.icon("download")}${t("Download photo")}</button><button class="btn" data-x="share">${SM.icon("share")}${t("Share photo")}</button><button class="btn" data-x="every">${t("Download all versions")}</button></div>
            <p class="muted small">${U.esc(PX.galleryHelp())}</p>
          </section>
          <section class="card stack-sm">
            <h3>${t("Organise")}</h3>
            <label class="field">${t("View / category")}<select id="phSetView">${Object.entries(SM.overlays.VIEWS).map(([k, v]) => `<option value="${k}" ${p.view === k ? "selected" : ""}>${t(v.name)}</option>`).join("")}<option value="measurement" ${p.view === "measurement" ? "selected" : ""}>${t("Selected measurement")}</option></select></label>
            <div class="btn-row"><button class="btn danger" data-del>${SM.icon("trash")}${t("Delete photo")}</button></div>
          </section>
        </div>
      </div>`;
    const draw = async () => { const box = U.$("#phPrev"); box.innerHTML = ""; box.appendChild(await PX.render(p, version, app.unit(c))); };
    await draw();
    U.$$("[data-ver]", el).forEach((b) => (b.onclick = async () => { version = b.dataset.ver; U.$$("[data-ver]", el).forEach((x) => x.setAttribute("aria-pressed", x === b)); await draw(); }));
    U.$("[data-edit]", el).onclick = async () => { await SM.editor.open(p, { customer: c }); app.rerender(); };
    U.$("#phSetView").onchange = async (e) => { p.view = e.target.value; await SM.db.put("photos", p); U.toast(t("Category updated")); };
    U.$("[data-del]", el).onclick = async () => {
      if (!(await U.confirm({ title: t("Delete photo?"), message: t("The photo and its annotations are removed from this device. Exported copies are not affected."), ok: t("Delete"), danger: true }))) return;
      await SM.db.del("photos", p.id); await SM.db.log("Photo deleted"); U.toast(t("Photo deleted")); app.go(c ? "#/customer/" + c.id : "#/photos");
    };
    U.$$("[data-x]", el).forEach((b) => (b.onclick = async () => {
      const fmt = U.$("#phFmt").value;
      const vers = b.dataset.x === "every" ? ["original", "outline", "grid", "lines"] : [version];
      for (const v of vers) {
        const cv = await PX.render(p, v, app.unit(c));
        let blob = await U.canvasToBlob(cv, fmt, 0.92); if (fmt === "image/webp" && blob.type !== "image/webp") blob = await U.canvasToBlob(cv, "image/jpeg", 0.92);
        const name = PX.filename(c, p, v, blob.type === "image/png" ? "png" : blob.type === "image/webp" ? "webp" : "jpg");
        const mode = b.dataset.x === "every" ? "download" : b.dataset.x;
        const r = mode === "gallery" ? await PX.toGallery(blob, name) : mode === "share" ? await PX.share(blob, name) : await PX.download(blob, name);
        U.toast(r.message);
        if (vers.length > 1) await new Promise((res) => setTimeout(res, 600));
      }
    }));
  }

  /* choose a photo to measure a specific item on */
  async function pickForMeasure(session, measureId) {
    const entry = SM.catalog.get(measureId);
    const c = await SM.customers.get(session.customerId);
    const photos = await SM.customers.photos(session.customerId);
    const want = entry.view === "side" ? ["right", "left"] : entry.view === "back" ? ["back"] : ["front", "upper", "lower", "sleeve", "extended"];
    const sorted = photos.slice().sort((a, b) => (want.includes(b.view) ? 1 : 0) - (want.includes(a.view) ? 1 : 0));
    const sh = U.sheet({ title: t("Measure {n} on a photo", { n: SM.catalog.name(measureId) }), wide: true, html: `
      <div class="notice">${SM.icon("info")}<div>${t("Best view: {v}. Calibrate the photo (marker, A4, known length or height) before the value can be used. The result is saved as a camera reading that needs verification.", { v: t(entry.view === "side" ? "Side" : entry.view === "back" ? "Back" : "Front") })}</div></div>
      <div class="btn-row"><button class="btn primary" data-new>${SM.icon("camera")}${t("Take new photo")}</button></div>
      ${sorted.length ? `<div class="photo-grid" data-g></div>` : `<p class="muted">${t("No stored photos for this customer yet.")}</p>`}` });
    const grid = sh.el.querySelector("[data-g]");
    if (grid) sorted.forEach((p) => {
      const b = document.createElement("button"); b.className = "photo-card"; b.dataset.id = p.id;
      b.innerHTML = `<img src="${URL.createObjectURL(p.thumb || p.blob)}" alt=""><span class="cap">${viewName(p.view)}${want.includes(p.view) ? " ★" : ""} · ${U.esc(U.fmtDate(p.createdAt))}</span>`;
      grid.appendChild(b);
    });
    sh.el.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-id]");
      if (b) { sh.close(); const p = photos.find((x) => x.id === b.dataset.id); await SM.editor.open(p, { customer: c, sessionId: session.id, measureId, tool: (p.ann && p.ann.cal && p.ann.cal.result && p.ann.cal.result.valid) ? "line" : "cal" }); app.rerender(); }
      if (e.target.closest("[data-new]")) {
        sh.close();
        const view = entry.view === "side" ? "right" : entry.view === "back" ? "back" : (entry.region === "arms" ? "sleeve" : "front");
        const shots = await SM.cameraUI.open({ customerId: c.id, sessionId: session.id, view, views: [view], measureId });
        if (shots && shots[0]) { await SM.editor.open(shots[0], { customer: c, sessionId: session.id, measureId, tool: "cal" }); }
        app.rerender();
      }
    });
  }
  SM.photosView = { pickForMeasure };
})();

</script>
<script>/* src/reports/views.js */
/* Reports screens: list of measurement records and the measurement sheet. */
(function () {
  "use strict";
  const SM = window.SM, U = SM.util, t = SM.t, app = SM.app, PX = SM.photoExport;

  SM.views.reports = async function (el) {
    const [sessions, customers, templates] = await Promise.all([SM.db.all("sessions"), SM.db.all("customers"), app.templatesAll()]);
    const cmap = Object.fromEntries(customers.map((c) => [c.id, c]));
    const q = (app._repQ = app._repQ || { q: "" });
    el.innerHTML = app.head({ title: t("Reports"), sub: t("Choose a measurement record to view its sheet and export it as PDF, CSV, JSON or a printable page.") }) + `
      <div class="stack"><div class="search">${SM.icon("search")}<input type="search" id="repQ" placeholder="${t("Search customer or garment")}" value="${U.esc(q.q)}"></div><div class="list" id="repList"></div></div>`;
    const draw = () => {
      const s = q.q.toLowerCase();
      const rows = sessions.filter((x) => cmap[x.customerId]).map((x) => ({ x, c: cmap[x.customerId], tp: templates.find((tp) => tp.id === x.templateId) }))
        .filter((r) => !s || [r.c.name, r.c.code, r.tp ? r.tp.name : ""].join(" ").toLowerCase().includes(s))
        .sort((a, b) => (b.x.date + b.x.updatedAt).localeCompare(a.x.date + a.x.updatedAt));
      U.$("#repList").innerHTML = rows.length ? rows.map((r) => { const sum = SM.engine.summary(r.x, app.sessionIds(r.x, r.tp)); return `<a class="list-item" href="#/report/${r.x.id}"><span class="avatar">${SM.icon("report")}</span><span class="main"><span class="t">${U.esc(r.c.name)} · ${U.esc(r.tp ? r.tp.name : t("Custom"))}</span><span class="s">${U.esc(r.c.code)} · ${U.esc(U.fmtDate(r.x.date))} · ${sum.done}/${sum.total}${sum.verify ? " · " + sum.verify + " " + t("to verify") : ""}</span></span>${SM.icon("chevron")}</a>`; }).join("") : `<div class="empty">${SM.icon("report")}<p>${t("No measurement records yet.")}</p></div>`;
    };
    draw();
    U.$("#repQ").oninput = (e) => { q.q = e.target.value; draw(); };
  };

  SM.views.report = async function (el, args) {
    let r;
    try { r = await SM.reports.build(args[0]); } catch (e) { el.innerHTML = `<div class="empty">${U.esc(e.message)}</div>`; return; }
    const photos = r.customer ? await SM.customers.photos(r.customer.id) : [];
    const sel = (app._repSel && app._repSel.id === args[0]) ? app._repSel : (app._repSel = { id: args[0], ids: photos.filter((p) => p.sessionId === r.session.id).slice(0, 4).map((p) => p.id), version: "lines" });
    const base = U.safeName(((r.customer && r.customer.code) || "Customer") + "_" + (r.template ? r.template.name : "Measurements") + "_" + r.session.date);
    el.innerHTML = app.head({ eyebrow: r.customer ? r.customer.name : "", title: t("Measurement sheet"), actions: `<a class="btn no-print" href="#/session/${r.session.id}">${SM.icon("edit")}${t("Edit values")}</a>` }) + `
      <div class="stack">
        <section class="card stack no-print">
          <div class="btn-row">
            <button class="btn primary" data-x="pdf">${SM.icon("download")}PDF</button>
            <button class="btn" data-x="csv">${SM.icon("download")}CSV</button>
            <button class="btn" data-x="json">${SM.icon("download")}JSON</button>
            <button class="btn" data-x="print">${SM.icon("print")}${t("Print / A4")}</button>
            <button class="btn" data-x="sharepdf">${SM.icon("share")}${t("Share PDF")}</button>
          </div>
          ${photos.length ? `<details><summary style="cursor:pointer;font-weight:600">${t("Reference photographs in the report")} (${sel.ids.length})</summary>
            <div class="stack-sm" style="margin-top:10px">
              <label class="field">${t("Photo version")}<select id="repVer">${Object.entries(PX.VERSIONS).map(([k, v]) => `<option value="${k}" ${sel.version === k ? "selected" : ""}>${t(v)}</option>`).join("")}</select></label>
              <div class="photo-grid">${photos.map((p) => `<label class="photo-card" style="cursor:pointer"><img src="${URL.createObjectURL(p.thumb || p.blob)}" alt=""><span class="cap"><input type="checkbox" data-ph="${p.id}" ${sel.ids.includes(p.id) ? "checked" : ""}> ${t(SM.overlays.VIEWS[p.view] ? SM.overlays.VIEWS[p.view].name : "Photo")}</span></label>`).join("")}</div>
            </div></details>` : ""}
          <p class="muted small">${t("Exports are created on this device and work offline.")}</p>
        </section>
        <div id="repBody"></div>
      </div>`;
    async function photoAssets(max) {
      const out = [];
      for (const id of sel.ids) {
        const p = photos.find((x) => x.id === id); if (!p) continue;
        const c = await PX.render(p, sel.version, r.unit);
        const k = Math.min(1, (max || 1200) / Math.max(c.width, c.height));
        const s = document.createElement("canvas"); s.width = Math.round(c.width * k); s.height = Math.round(c.height * k); s.getContext("2d").drawImage(c, 0, 0, s.width, s.height);
        out.push({ dataURL: s.toDataURL("image/jpeg", 0.85), url: s.toDataURL("image/jpeg", 0.85), w: s.width, h: s.height, caption: t(SM.overlays.VIEWS[p.view] ? SM.overlays.VIEWS[p.view].name : "Photo") + " · " + U.fmtDate(p.createdAt) });
      }
      return out;
    }
    const drawBody = async () => { U.$("#repBody").innerHTML = await SM.reports.html(r, await photoAssets(700)); };
    await drawBody();
    U.$$("[data-ph]", el).forEach((cb) => (cb.onchange = async () => { sel.ids = U.$$("[data-ph]", el).filter((x) => x.checked).map((x) => x.dataset.ph); await drawBody(); }));
    const rv = U.$("#repVer"); if (rv) rv.onchange = async (e) => { sel.version = e.target.value; await drawBody(); };
    U.$$("[data-x]", el).forEach((b) => (b.onclick = async () => {
      const x = b.dataset.x;
      try {
        if (x === "csv") await app.deliver(new Blob([SM.reports.csv(r)], { type: "text/csv;charset=utf-8" }), base + ".csv", "saveas");
        else if (x === "json") await app.deliver(new Blob([SM.reports.json(r)], { type: "application/json" }), base + ".json", "saveas");
        else if (x === "print") window.print();
        else { b.disabled = true; const blob = await SM.reports.pdf(r, await photoAssets(1400)); b.disabled = false; await app.deliver(blob, base + ".pdf", x === "sharepdf" ? "share" : "saveas"); }
        if (x !== "print") await SM.db.log(`Exported ${x.replace("share", "").toUpperCase()} report for ${r.customer ? r.customer.name : ""}`, r.session.id);
      } catch (e) { b.disabled = false; U.toast(t("Export failed: ") + e.message, "err"); }
    }));
  };
})();

</script>

(function () {

        </section>

        <section class="card stack" id="calibration"><h2>${t("Calibration & tolerances")}</h2>
          <p class="lead">${t("Photo values are shown in physical units only after a photo passes calibration. Methods:")}</p>
          <dl class="kv">${Object.entries(SM.calibration.METHODS).map(([k, m]) => `<dt>${t(m.name)}</dt><dd>${t(m.hint)}</dd>`).join("")}</dl>
